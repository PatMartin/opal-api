# OPAL suite conventions, layered on top of the generic OpenAPI ruleset.
# These rules encode the normative "OPAL SUITE STANDARD" text shared by
# the specs in openapi/ — not general OpenAPI style.
extends:
  - - spectral:oas
    - recommended
rules:
  # OPAL convention REQUIRES a trailing slash on collection roots
  # (documented in each spec's "OPAL shared conventions").
  path-keys-no-trailing-slash: off

  opal-correlation-headers:
    description: Every response must declare the four OPAL correlation headers (Request/Transaction required; Session/Causation conditionally present).
    severity: error
    given: $.paths[*][*].responses[*]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - headers
          properties:
            headers:
              type: object
              required:
                - X-Opal-Session-Id
                - X-Opal-Transaction-Id
                - X-Opal-Request-Id
                - X-Opal-Causation-Id

  opal-standard-error-body:
    description: 4xx/5xx JSON bodies must be OpalError-shaped (error object) or OpalHealthProbe-shaped (ready/status) on health probes.
    severity: error
    given: $.paths[*][*].responses[?(@property.match(/^[45]/))].content['application/json'].schema
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - type: object
              required:
                - properties
              properties:
                properties:
                  type: object
                  required:
                    - error
            - type: object
              required:
                - properties
              properties:
                properties:
                  type: object
                  required:
                    - ready
                    - status

  opal-zeromq-frame-count:
    description: The shared ZeroMQ wire protocol is exactly two frames (topic + JSON envelope).
    severity: error
    given: $.x-opal-context-standard.events
    then:
      field: zero_mq_frames
      function: truthy

  opal-context-events-compatibility:
    description: The events block must document cross-version metadata compatibility.
    severity: warn
    given: $.x-opal-context-standard.events
    then:
      field: compatibility
      function: truthy

  opal-ifmatch-precondition-responses:
    description: Operations requiring If-Match should declare 412 (stale revision) and 428 (missing precondition) per the suite concurrency convention.
    severity: warn
    given: $.paths[*][*]
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - properties:
                parameters:
                  not:
                    contains:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          const: If-Match
            - required:
                - responses
              properties:
                responses:
                  required:
                    - '412'
                    - '428'

  opal-item-op-404:
    description: Operations under parameterized paths must declare a 404 (missing item or parent resource).
    severity: error
    given: $.paths[?(@property.match(/\{[^}]+\}/))][?(@property.match(/^(get|post|patch|delete)$/))].responses
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - '404'

  opal-201-location-header:
    description: Every 201 Created response must declare a Location header naming the created resource.
    severity: error
    given: $.paths[*][*].responses[?(@property === '201')]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - headers
          properties:
            headers:
              type: object
              required:
                - Location

  opal-recognition-stream-sse:
    description: GET /api/v1/recognition/stream is an SSE endpoint; its 200 response must declare text/event-stream, not application/json.
    severity: error
    given: $.paths['/api/v1/recognition/stream'].get.responses['200'].content
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - text/event-stream

  opal-context-params:
    description: Every path item should declare the four X-Opal-* correlation header parameters (suite standard request context).
    severity: warn
    given: $.paths[*]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - parameters
          properties:
            parameters:
              type: array
              allOf:
                - contains:
                    type: object
                    required:
                      - name
                      - in
                    properties:
                      name:
                        const: X-Opal-Session-Id
                      in:
                        const: header
                - contains:
                    type: object
                    required:
                      - name
                      - in
                    properties:
                      name:
                        const: X-Opal-Transaction-Id
                      in:
                        const: header
                - contains:
                    type: object
                    required:
                      - name
                      - in
                    properties:
                      name:
                        const: X-Opal-Request-Id
                      in:
                        const: header
                - contains:
                    type: object
                    required:
                      - name
                      - in
                    properties:
                      name:
                        const: X-Opal-Causation-Id
                      in:
                        const: header
