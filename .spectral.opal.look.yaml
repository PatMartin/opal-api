extends:
- - spectral:oas
  - off
rules:

  opal-look-config-ifmatch:
    description: OPAL Look configuration mutations must require a strong If-Match precondition.
    severity: error
    given: $.paths[?(@property.match(/api\/v1\/((engine|model|source|pipeline|profile|zone|rule|monitor)(\/\{[^}]+\}|\/)|profile\/{[^}]+}\/activate|setting(\/{key}|\/)|configuration\/import)$/))][?(@property.match(/^(post|put|patch|delete)$/))]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - parameters
          properties:
            parameters:
              type: array
              contains:
                type: object
                required:
                  - name
                  - required
                properties:
                  name:
                    const: If-Match
                  required:
                    const: true

  opal-look-cursor-page:
    description: OPAL Look cursor-paginated collections must return items, next_cursor and has_more.
    severity: error
    given:
      - $.paths['/api/v1/session/'].get.responses['200'].content
      - $.paths['/api/v1/session/{session_id}/observation/'].get.responses['200'].content
      - $.paths['/api/v1/job/'].get.responses['200'].content
      - $.paths['/api/v1/observation/'].get.responses['200'].content
      - $.paths['/api/v1/media/'].get.responses['200'].content
      - $.paths['/api/v1/capture/'].get.responses['200'].content
      - $.paths['/api/v1/artifact/'].get.responses['200'].content
      - $.paths['/api/v1/recording/'].get.responses['200'].content
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - application/json
          properties:
            application/json:
              type: object
              required:
                - schema
              properties:
                schema:
                  type: object
                  required:
                    - properties
                  properties:
                    properties:
                      type: object
                      required:
                        - items
                        - next_cursor
                        - has_more


  opal-look-health-probe:
    description: OPAL Look liveness/readiness probes must return status+ready bodies on 200 and 503.
    severity: error
    given: $.paths[?(@property.match(/\/health\/(live|ready)$/))].get.responses
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - '200'
            - '503'
          properties:
            '200':
              type: object
              properties:
                content:
                  type: object
                  properties:
                    application/json:
                      type: object
                      properties:
                        schema:
                          type: object
                          properties:
                            required:
                              type: array
                              allOf:
                                - contains:
                                    const: status
                                - contains:
                                    const: ready
            '503':
              type: object
              properties:
                content:
                  type: object
                  properties:
                    application/json:
                      type: object
                      properties:
                        schema:
                          type: object
                          properties:
                            required:
                              type: array
                              allOf:
                                - contains:
                                    const: status
                                - contains:
                                    const: ready

  opal-look-event-contract:
    description: OPAL Look must declare the two-frame BusEvent contract with optional data.metadata correlation.
    severity: error
    given: $.x-opal-event-contract
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - envelope
            - rules
          properties:
            envelope:
              type: string
              pattern: metadata


  opal-look-ifmatch-strong-schema:
    description: OPAL Look If-Match parameters must constrain to one exact strong quoted ETag (pattern required).
    severity: error
    given: $.paths[*][*].parameters[?(@.name == 'If-Match')].schema
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - pattern

  opal-look-header-required-ids:
    description: OPAL Look request/transaction response headers must be declared required.
    severity: error
    given: $.components.headers[?(@property.match(/Opal(Request|Transaction)IdHeader$/))]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - required
          properties:
            required:
              const: true

  opal-look-header-conditional-ids:
    description: OPAL Look session/causation response headers must stay conditional (required false).
    severity: error
    given: $.components.headers[?(@property.match(/Opal(Session|Causation)IdHeader$/))]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - required
          properties:
            required:
              const: false
