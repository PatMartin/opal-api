# OPAL Devices — shared contract base for the OPAL devices registry domain.
# Consumed via external $ref; never published standalone. See info.description.

openapi: 3.1.0
info:
  title: OPAL Devices API
  version: 1.7.1
  description: 'Optional metadata-only registry for audio, video and compute devices (OPAL SUITE
    STANDARD v1.2; follows the shared kernel version). Local-first and optionally federated.
    No capture, playback, reservation, inference or device-control endpoints. Human-managed
    YAML configuration; observed inventories and remote caches in SQLite. Peer inventory reads
    require authentication; registered peers see metadata by default unless a sharing policy
    denies it.

    This document is never served directly. A serving spec mounts the reusable Path Items
    below under `/api/v1` and references this document''s components via external `$ref`s;
    the standard kernel route families (health/, info/, setting/, backup/, profile/, persona/,
    service/) are mounted from `./opal_kernel.yaml` by that same serving spec and are not
    redeclared here. Conventions inherited from the kernel: the four X-Opal-* correlation
    headers on every request and response; strong ETag + mandatory If-Match on mutable
    configuration (428 missing, 412 stale); 204 for empty deletion; 201 + Location for
    creation; the OpalError envelope for all 4xx/5xx JSON bodies; and a single BearerAuth —
    trusted-peer status on federation reads is an authorization decision (403) driven by
    sharing policy, not a separate scheme.

    Normalization from the v0.1.0 proposal (`openapi/OPAL_DEVICES_OPENAPI.yaml`): `/v1/*`
    routes become `/api/v1` singular collections with a trailing slash — a serving spec
    mounts `device/`, `group/`, `peer/`, `plugin/`, `sharing/policy/`, `default/`, `event/`,
    `discovery/`, `federation/` and `catalog`; `/v1/health` and `/v1/settings{,/{key}}` are
    kernel surface and are not part of this domain base; `adminBearer`/`peerBearer` collapse
    to the kernel `BearerAuth`.'
  x-decisions:
  - '12.1'
  - '12.2'
  - '12.3'
  - '12.4'
  - '12.5'
  - '12.6'
  - '12.7'
  - '12.8'
  - '12.9'
  - '12.10'
  - '12.11'
  - '12.12'
  - '12.13'
  - '12.14'
  - '12.15'
  - '12.16'
  - '12.17'
  x-design-notes:
  - SSE native; outbound publishing is separate and disabled by default (events.publish_enabled=false).
  - Peer auto discovery disabled by default (federation.auto_discovery_enabled=false).
  - Federation refresh is periodic + on-demand; inventory cached locally and staleness reported.
  - Default trusted-peer inventory visibility is allow_trusted; deny policies take precedence.
  - Device names may contain /; use UUIDs as path parameters or URL-encode qualified names.
  - Discovery plugins use Python package entry points; backend-specific capabilities are extensible.
  - No media capture, stream creation, output playback, GPU reservation or remote control endpoints.
tags:
- name: devices
  description: Device inventory and metadata
- name: discovery
  description: Local backend discovery
- name: defaults
  description: Preferred device defaults
- name: labels
  description: Key-value device metadata
- name: tags
  description: Simple device tags
- name: groups
  description: Static and dynamic collections
- name: peers
  description: Optional federated registry peers
- name: sharing
  description: Visibility rules for trusted peers
- name: plugins
  description: Discovery backend inspection and activation
- name: events
  description: Native SSE changes and optional outbound publishing
- name: federation
  description: Peer-facing authenticated inventory
- name: catalog
  description: Device types, discovery backends and event names
paths: {}
components:
  securitySchemes:
    BearerAuth:
      $ref: './opal_kernel.yaml#/components/securitySchemes/BearerAuth'
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: UUID or URL-encoded host-qualified name. Names containing / must be percent encoded.
      schema:
        type: string
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PeerId:
      name: peer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
    LabelKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TagValue:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DefaultScope:
      name: scope
      in: path
      required: true
      schema:
        type: string
        enum:
        - global
        - host
        - device
        - type
    DefaultTarget:
      name: target
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  schemas:


    DeviceType:
      type: string
      enum:
      - camera
      - microphone
      - speaker
      - cpu
      - gpu
      - npu
      - accelerator
      - other

    Availability:
      type: string
      enum:
      - available
      - unavailable
      - unknown
      - stale

    Time:
      type: string
      format: date-time

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        qualified_name:
          type: string
        host_id:
          type: string
        host_name:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        backend:
          type: string
        status:
          $ref: '#/components/schemas/Availability'
        status_reason:
          type: string
        last_seen:
          $ref: '#/components/schemas/Time'
        last_checked:
          $ref: '#/components/schemas/Time'
        origin_peer_id:
          type: string
          format: uuid
        capabilities:
          type: object
          additionalProperties: {}
        configuration:
          type: object
          additionalProperties: {}
        preferred_defaults:
          type: object
          additionalProperties: {}
        labels:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        access:
          type: string
          enum:
          - local
          - network
          - virtual
        resource_uri:
          type: string
          description: Device locator; credentials must be redacted for inventory sharing
        metadata:
          type: object
          additionalProperties: {}
      required:
      - id
      - name
      - qualified_name
      - host_id
      - host_name
      - type
      - backend
      - status
      - capabilities
      - labels
      - tags
      - access
      description: Core portable fields; backend-defined capability keys may be namespaced and may evolve.
      additionalProperties: false

    DeviceCreate:
      type: object
      properties:
        name:
          type: string
        host_id:
          type: string
        host_name:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        backend:
          type: string
        resource_uri:
          type: string
        access:
          type: string
          enum:
          - local
          - network
          - virtual
        configuration:
          type: object
          additionalProperties: {}
        labels:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: {}
      required:
      - name
      - host_id
      - host_name
      - type
      - backend
      - access
      additionalProperties: false

    DevicePatch:
      type: object
      properties:
        name:
          type: string
        resource_uri:
          type: string
        configuration:
          type: object
          additionalProperties: {}
        metadata:
          type: object
          additionalProperties: {}
      additionalProperties: false

    DeviceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        next_cursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          minimum: 0
      required:
      - items
      additionalProperties: false

    DeviceStatus:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/Availability'
        status_reason:
          type: string
        last_seen:
          $ref: '#/components/schemas/Time'
        last_checked:
          $ref: '#/components/schemas/Time'
        origin:
          type: string
          enum:
          - local
          - federated
      required:
      - device_id
      - status
      - origin
      additionalProperties: false

    DeviceTest:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/Availability'
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              ok:
                type: boolean
              message:
                type: string
            required:
            - name
            - ok
            additionalProperties: false
        checked_at:
          $ref: '#/components/schemas/Time'
      required:
      - device_id
      - status
      - checks
      - checked_at
      description: Non-invasive metadata/status checks; never opens audio/video streams or runs GPU workloads.
      additionalProperties: false

    DiscoveryRequest:
      type: object
      properties:
        plugin_ids:
          type: array
          items:
            type: string
        include_network:
          type: boolean
          default: false
        dry_run:
          type: boolean
          default: false
      description: Local scan only; network probing is opt-in.
      additionalProperties: false

    DiscoveryResult:
      type: object
      properties:
        discovered:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: './opal_kernel.yaml#/components/schemas/OpalErrorBody'
      required:
      - discovered
      - created
      - updated
      - errors
      additionalProperties: false

    Default:
      type: object
      properties:
        scope:
          type: string
          enum:
          - global
          - host
          - device
          - type
        target:
          type: string
        values:
          type: object
          additionalProperties: {}
      required:
      - scope
      - target
      - values
      additionalProperties: false

    LabelSet:
      type: object
      properties:
        value:
          type: string
      required:
      - value
      additionalProperties: false

    TagSet:
      type: object
      properties:
        tag:
          type: string
      required:
      - tag
      additionalProperties: false

    GroupMode:
      type: string
      enum:
      - static
      - dynamic

    DeviceFilter:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DeviceType'
        status:
          $ref: '#/components/schemas/Availability'
        host:
          type: string
        backend:
          type: string
        peer_id:
          type: string
          format: uuid
        tags_all:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        capabilities:
          type: array
          items:
            type: string
            description: Comparison expression e.g. audio.sample_rates contains 48000; compute.memory_mb >= 8192
      description: Filter is declarative, read-only and is shared by device search and dynamic groups.
      additionalProperties: false

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          $ref: '#/components/schemas/GroupMode'
        selector:
          $ref: '#/components/schemas/DeviceFilter'
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        description:
          type: string
      required:
      - id
      - name
      - mode
      additionalProperties: false

    GroupCreate:
      type: object
      properties:
        name:
          type: string
        mode:
          $ref: '#/components/schemas/GroupMode'
        selector:
          $ref: '#/components/schemas/DeviceFilter'
        description:
          type: string
      required:
      - name
      - mode
      description: selector required for dynamic groups, forbidden for static groups (semantic validation).
      additionalProperties: false

    GroupPatch:
      type: object
      properties:
        description:
          type: string
        selector:
          $ref: '#/components/schemas/DeviceFilter'
      additionalProperties: false

    GroupList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
      required:
      - items
      additionalProperties: false

    Peer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
          format: uri
        trusted:
          type: boolean
        status:
          $ref: '#/components/schemas/Availability'
        last_synced:
          $ref: '#/components/schemas/Time'
        auto_discovered:
          type: boolean
        tls_verified:
          type: boolean
      required:
      - id
      - name
      - base_url
      - trusted
      - status
      - auto_discovered
      additionalProperties: false

    PeerCreate:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
          format: uri
        credential_ref:
          type: string
          description: Reference to secret store; never a credential value
        trusted:
          type: boolean
          default: false
      required:
      - name
      - base_url
      additionalProperties: false

    PeerPatch:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
          format: uri
        credential_ref:
          type: string
        trusted:
          type: boolean
      additionalProperties: false

    PeerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
      required:
      - items
      additionalProperties: false

    PeerSyncResult:
      type: object
      properties:
        peer_id:
          type: string
          format: uuid
        synced_at:
          $ref: '#/components/schemas/Time'
        added:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        stale:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: './opal_kernel.yaml#/components/schemas/OpalErrorBody'
      required:
      - peer_id
      - synced_at
      - added
      - updated
      - stale
      - errors
      additionalProperties: false

    PeerDiscoveryResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
      required:
      - items
      description: Candidates are not trusted automatically and must be explicitly enrolled.
      additionalProperties: false

    SharingPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        effect:
          type: string
          enum:
          - allow
          - deny
        peer_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        host:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        description:
          type: string
      required:
      - id
      - effect
      description: Policies govern inventory metadata visibility only. Trusted peers see devices by default; deny
        takes priority.
      additionalProperties: false

    SharingPolicyCreate:
      type: object
      properties:
        effect:
          type: string
          enum:
          - allow
          - deny
        peer_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        host:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        description:
          type: string
      required:
      - effect
      additionalProperties: false

    SharingPolicyList:
      type: object
      properties:
        default_visibility:
          type: string
          enum:
          - allow_trusted
          - deny_trusted
        items:
          type: array
          items:
            $ref: '#/components/schemas/SharingPolicy'
      required:
      - default_visibility
      - items
      additionalProperties: false

    Plugin:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        installed:
          type: boolean
        available:
          type: boolean
        supported_types:
          type: array
          items:
            $ref: '#/components/schemas/DeviceType'
        capabilities:
          type: array
          items:
            type: string
        reason:
          type: string
      required:
      - id
      - name
      - enabled
      - installed
      - available
      - supported_types
      additionalProperties: false

    PluginList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plugin'
      required:
      - items
      additionalProperties: false

    PluginTest:
      type: object
      properties:
        plugin_id:
          type: string
        ok:
          type: boolean
        details:
          type: object
          additionalProperties: {}
      required:
      - plugin_id
      - ok
      additionalProperties: false

    Event:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        time:
          $ref: '#/components/schemas/Time'
        device_id:
          type: string
          format: uuid
        peer_id:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: {}
      required:
      - id
      - event
      - time
      - data
      additionalProperties: false

    EventHistory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      additionalProperties: false

    FederationInventory:
      type: object
      properties:
        registry_id:
          type: string
          format: uuid
        host:
          type: string
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        snapshot_at:
          $ref: '#/components/schemas/Time'
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - registry_id
      - host
      - devices
      - snapshot_at
      additionalProperties: false

    Catalog:
      type: object
      properties:
        device_types:
          type: array
          items:
            $ref: '#/components/schemas/DeviceType'
        backends:
          type: array
          items:
            type: string
        event_types:
          type: array
          items:
            type: string
        capability_namespaces:
          type: array
          items:
            type: string
      required:
      - device_types
      - backends
      - event_types
      - capability_namespaces
      additionalProperties: false

    Accepted:
      type: object
      properties:
        accepted:
          type: boolean
        message:
          type: string
      required:
      - accepted
      additionalProperties: false

    FederationRegistry:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          type: string
        registry_id:
          type: string
          format: uuid
      required:
      - status
      - version
      - registry_id
      description: Local registry identity and federation metadata as reported to trusted peers.
      additionalProperties: false
    DefaultList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Default'
      required:
      - items
      additionalProperties: false
    DeviceCapabilities:
      type: object
      additionalProperties: {}
      description: Namespaced capability map for one device; keys are backend-defined and may evolve.
    LabelMap:
      type: object
      additionalProperties:
        type: string
      description: Key-value labels on one device.
    TagList:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
      required:
      - items
      additionalProperties: false

  pathItems:
    catalog:
      x-opal-cli:
        get:
          command: catalog
      parameters:
      - $ref: './opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
      - $ref: './opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
      - $ref: './opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
      - $ref: './opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
      get:
        tags:
        - catalog
        summary: Discover device types, discovery backends and event names
        operationId: opal_devices_catalog_get
        description: "Static catalog of the registry vocabulary: device types, installed discovery backends, event names and capability namespaces."
        responses:
          '200':
            description: Registry catalog.
            headers:
              X-Opal-Session-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Catalog'
          '401':
            $ref: './opal_kernel.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './opal_kernel.yaml#/components/responses/Forbidden'
          '422':
            $ref: './opal_kernel.yaml#/components/responses/UnprocessableEntity'
    device_collection:
      x-opal-cli:
        get:
          command: list
        post:
          command: add
      parameters:
      - $ref: './opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
      - $ref: './opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
      - $ref: './opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
      - $ref: './opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
      get:
        tags:
        - devices
        summary: List and filter local and federated device inventory
        operationId: opal_devices_device_list
        description: List and filter local and federated device inventory
        parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: './opal_kernel.yaml#/components/parameters/Limit'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeviceType'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Availability'
        - name: host
          in: query
          required: false
          schema:
            type: string
        - name: backend
          in: query
          required: false
          schema:
            type: string
        - name: peer_id
          in: query
          required: false
          schema:
            type: string
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: label
          in: query
          required: false
          schema:
            type: string
          description: key=value
        - name: capability
          in: query
          required: false
          schema:
            type: string
          description: key comparator value, e.g. compute.memory_mb>=8192
        - name: min_memory_mb
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: group
          in: query
          required: false
          schema:
            type: string
        - name: include_stale
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        responses:
          '200':
            description: Filtered device inventory.
            headers:
              X-Opal-Session-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
              X-Opal-Transaction-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
              X-Opal-Request-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
              X-Opal-Causation-Id:
                $ref: './opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
              ETag:
                $ref: './opal_kernel.yaml#/components/headers/ETag'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/DeviceList'
          '401':
            $ref: './opal_kernel.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './opal_kernel.yaml#/components/responses/Forbidden'
          '422':
            $ref: './opal_kernel.yaml#/components/responses/UnprocessableEntity'
      post:
        tags:
        - devices
        summary: Register user-managed device
        operationId: opal_devices_device_add
        description: Register user-managed device
        parameters:
        - $ref: './opal_kernel.yaml#/components/parameters/IfMatch'
        requestBody:
