components:
  securitySchemes:
    BearerAuth:
      $ref: './shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth'
x-opal-context-standard:
  version: '1.2'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    $ref: './shared/opal_kernel.yaml#/x-opal-event-envelope'
    metadata_schema_version: '1.0'
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  pagination:
    configuration: none
    history: cursor
    ordering: stable-deterministic
    default_limit: 100
    max_limit: 500
  streaming: HTTP context headers precede bytes; /api/v1/event/stream is SSE carrying JSON
    Event data with id, event and data lines; Last-Event-ID resumes within a bounded replay
    window; no unlimited replay.
security:
- BearerAuth: []
x-opal-authorization:
  $ref: './shared/opal_kernel.yaml#/x-opal-authorization'
