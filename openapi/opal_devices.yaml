openapi: 3.1.0
info:
  title: OPAL Devices API
  version: 1.7.1
  description: "Optional metadata-only registry for audio, video and compute devices. Local-first\
    \ and optionally federated. No capture, playback, reservation, inference or device-control\
    \ endpoints: consuming services operate devices themselves using the metadata this registry\
    \ publishes. Human-managed YAML configuration; observed inventories and remote caches in\
    \ SQLite. Peer inventory reads require authentication; registered peers see metadata by\
    \ default unless a sharing policy denies it.\n\nThe devices domain surface is defined in\
    \ the shared contract base `openapi/shared/opal_devices.yaml` and mounted here under\
    \ `/api/v1`; the standard kernel route families are mounted from `openapi/shared/opal_kernel.yaml`.\
    \n\nOPAL SUITE STANDARD v1.2 (normative)\nX-Opal-Session-Id is an optional logical context\
    \ identifier; it does not create a server-managed session or grant authorization. Entry-point\
    \ services generate one when absent where a workflow requires it, and propagate it unchanged.\
    \ A preexisting service-local session resource has a separate lifecycle. X-Opal-Transaction-Id\
    \ is a single logical end-to-end operation and is not an atomic distributed transaction.\
    \ X-Opal-Request-Id identifies one inbound HTTP exchange and is regenerated for each downstream\
    \ HTTP hop (the incoming one can be used for diagnostics); X-Opal-Causation-Id names the\
    \ immediate parent event/request, where applicable. For inbound requests, if a transaction\
    \ ID is absent the service assigns one; all response types (including errors, streamed headers,\
    \ and binary bodies) return session ID if known and transaction/request IDs. Never trust\
    \ these values for access control. Propagate them into derived ZeroMQ envelope metadata.\
    \ All identifiers are opaque 1..128-character printable ASCII tokens with no control/whitespace\
    \ characters; client-supplied invalid values yield 422.\nStandard health routes: /api/v1/health/,\
    \ /api/v1/health/live, /api/v1/health/ready. Setting: GET and PATCH /api/v1/setting/ for\
    \ the whole map, plus GET, PUT and DELETE /api/v1/setting/{key} for individual keys retained\
    \ for OPAL suite consistency; PATCH is atomic. Mutable configuration uses strong ETags and\
    \ mandatory If-Match with 428 missing, 412 stale. For bounded configuration catalogs return\
    \ full arrays (subject to explicit deployment caps); growing histories return bounded arrays\
    \ in stable deterministic order and `limit` caps the returned items. Standard HTTP creation\
    \ 201 Location, async admission 202, empty deletion 204. Streaming keeps media-specific\
    \ transports but exposes correlation headers, defined failure behavior, and no unsupported\
    \ replay guarantee. Configuration export/import/validation excludes secrets and history.\n\n\
    Authentication and authorization follow the kernel `x-opal-authorization` extension: a\
    \ single BearerAuth scheme covers the management API and the federation surface; trusted-peer\
    \ status on `/api/v1/federation/*` reads is an authorization decision (403) driven by peer\
    \ enrollment and sharing policy, not a separate scheme."
tags:
- name: devices
  description: Device inventory and metadata.
- name: discovery
  description: Local backend discovery.
- name: defaults
  description: Preferred device defaults.
- name: labels
  description: Key-value device metadata.
- name: tags
  description: Simple device tags.
- name: groups
  description: Static and dynamic collections.
- name: peers
  description: Optional federated registry peers.
- name: sharing
  description: Visibility rules for trusted peers.
- name: plugins
  description: Discovery backend inspection and activation.
- name: events
  description: Native SSE changes and optional outbound publishing.
- name: federation
  description: Peer-facing authenticated inventory.
- name: catalog
  description: Device types, discovery backends and event names.
- name: health
  description: Service readiness and health information.
- name: info
  description: Service identity, version and liveness probes.
- name: settings
  description: Service-wide key/value setting.
- name: backup
  description: Backup, restore, import, export, and validate registry configuration.
- name: profiles
  description: Reusable named configuration presets; exactly one may be active at a time.
- name: service
  description: Service process lifecycle (start, stop, log tail).
servers:
- url: http://127.0.0.1:8080
  description: Illustrative local endpoint; actual bind address and port are configurable.
