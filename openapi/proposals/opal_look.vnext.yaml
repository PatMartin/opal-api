      - media_types
      - stream_transports
      - export_formats
      - limits
    Engine:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        state:
          type: string
        tasks:
          type: array
          items:
            type: string
        device_types:
          type: array
          items:
            type: string
        options_schema:
          type: object
          additionalProperties: true
      required:
      - id
      - name
      - version
      - enabled
      - state
      - tasks
    EnginePatch:
      type: object
      additionalProperties: false
      description: Only installed engines can be reconfigured. Unknown/unsupported engine options are rejected.
      properties:
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties: true
    ModelCreate:
      type: object
      additionalProperties: false
      description: Register an already provisioned model resource; never download or install via this operation.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        engine_id:
          $ref: '#/components/schemas/Id'
        resource_ref:
          type: string
        tasks:
          type: array
          items:
            type: string
          minItems: 1
        options:
          type: object
          additionalProperties: true
      required:
      - id
      - engine_id
      - resource_ref
      - tasks
    Model:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        engine_id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
        tasks:
          type: array
          items:
            type: string
        state:
          type: string
        resource_label:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - engine_id
      - display_name
      - tasks
      - state
      - created_at
    ModelPatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
        options:
          type: object
          additionalProperties: true
    SourceZone:
      type: object
      additionalProperties: false
      description: Source-local named geometric region. Polygon needs >=3 points; line exactly 2. Constraints validated
        by kind.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        kind:
          type: string
          enum:
          - polygon
          - line
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
          minItems: 2
        enabled:
          type: boolean
          default: true
      required:
      - id
      - name
      - kind
      - points
    SourceCreate:
      type: object
      additionalProperties: false
      description: The locator must be allowlisted; secrets are referenced out of band and cannot appear in the locator.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - rtsp
          - http
          - camera
          - file
          - media
          - image
        name:
          type: string
        locator:
          type: string
        secret_ref:
          oneOf:
          - type: string
          - type: 'null'
        options:
          type: object
          additionalProperties: true
        zones:
          type: array
          items:
            $ref: '#/components/schemas/SourceZone'
        enabled:
          type: boolean
          default: true
      required:
      - id
      - kind
      - name
      - locator
    Source:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        state:
          type: string
        redacted_locator:
          type: string
        last_frame_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/SourceZone'
        capabilities:
          type: array
          items:
            type: string
      required:
      - id
      - kind
      - name
      - enabled
      - state
      - redacted_locator
      - zones
    SourcePatch:
      type: object
      additionalProperties: false
      description: zones, if provided, replaces the complete source-local zone collection atomically; it is not a deep
        merge.
      properties:
        name:
          type: string
        locator:
          type: string
        secret_ref:
          oneOf:
          - type: string
          - type: 'null'
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties: true
        zones:
          type: array
          items:
            $ref: '#/components/schemas/SourceZone'
    SourceStatus:
      type: object
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/Id'
        connected:
          type: boolean
        last_frame_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        last_error:
          oneOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: 'null'
        reconnect_count:
          type: integer
          minimum: 0
        dropped_frames:
          type: integer
          minimum: 0
      required:
      - source_id
      - connected
    ProbeResult:
      type: object
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/Id'
        reachable:
          type: boolean
        details:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
      required:
      - source_id
      - reachable
    MotionFilterParameters:
      type: object
      additionalProperties: false
      description: Temporal comparison only. Missing baseline, reinitialization or discontinuity yields motion=unknown,
        never false.
      properties:
        sensitivity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        minimum_area:
          type: integer
          minimum: 1
          default: 500
        warmup_frames:
          type: integer
          minimum: 1
          default: 3
        visualization:
          type: string
          enum:
          - none
          - highlight
          - mask
          default: highlight
        roi:
          $ref: '#/components/schemas/NormalizedPolygon'
    FilterSpec:
      type: object
      additionalProperties: false
      description: Type-specific parameter schema and limits are normative in x-opal-filter-catalog and advertised capabilities.
        Unknown keys fail 422.
      properties:
        type:
          type: string
          enum:
          - grayscale
          - brightness_contrast
          - blur
          - sharpen
          - threshold
          - edges
          - rotate
          - flip
          - crop
          - resize
          - motion
        parameters:
          type: object
          additionalProperties: true
      required:
      - type
    MotionGateOptions:
      type: object
      additionalProperties: false
      description: Skipped inference does not mean object absence. Periodic samples prevent permanent blind spots.
      properties:
        motion_stage_id:
          $ref: '#/components/schemas/Id'
        sample_every_n_frames:
          type: integer
          minimum: 1
          default: 30
        on_unknown:
          type: string
          enum:
          - run_inference
          - skip
          default: run_inference
      required:
      - motion_stage_id
    AnnotationOptions:
      type: object
      additionalProperties: false
      description: 'Presentation only: no effect on inference, persisted observations or event conditions.'
      properties:
        enabled:
          type: boolean
          default: true
        show_boxes:
          type: boolean
          default: true
        show_labels:
          type: boolean
          default: true
        show_confidence:
          type: boolean
          default: true
        show_track_ids:
          type: boolean
          default: false
        show_zones:
          type: boolean
          default: false
        classes:
          type: array
          items:
            type: string
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
    VideoProcessingOptions:
      type: object
      additionalProperties: false
      description: Supported rates and sizes are bounded by runtime capabilities; never silently clamped.
      properties:
        target_fps:
          type: number
          minimum: 0.1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        quality:
          type: integer
          minimum: 1
          maximum: 100
    InferenceOptions:
      type: object
      additionalProperties: false
      properties:
        target_fps:
          type: number
          minimum: 0.1
        max_frames:
          type: integer
          minimum: 1
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
        classes:
          type: array
          items:
            type: string
        roi:
          $ref: '#/components/schemas/NormalizedPolygon'
        engine_options:
          type: object
          additionalProperties: true
        video:
          $ref: '#/components/schemas/VideoProcessingOptions'
        annotations:
          $ref: '#/components/schemas/AnnotationOptions'
    RetentionOptions:
      type: object
      additionalProperties: false
      description: All retention is opt-in; resolved TTL must not exceed configured caps. No raw frames inferred from
        observation persistence.
      properties:
        persist_observations:
          type: boolean
          default: false
        save_raw_frames:
          type: boolean
          default: false
        save_annotated_frames:
          type: boolean
          default: false
        ttl_seconds:
          type: integer
          minimum: 0
    ProcessingStageOptions:
      type: object
      additionalProperties: false
      properties:
        filter:
          $ref: '#/components/schemas/FilterSpec'
        gate:
          $ref: '#/components/schemas/MotionGateOptions'
        annotation:
          $ref: '#/components/schemas/AnnotationOptions'
        video:
          $ref: '#/components/schemas/VideoProcessingOptions'
    PipelineStage:
      type: object
      additionalProperties: false
      description: Advanced ordered DAG nodes; inputs may reference earlier stage IDs only. Inference needs model_id
        and task. Filter-only pipelines allowed.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - preprocess
          - inference
          - tracker
          - filter
          - transform
          - annotate
        model_id:
          $ref: '#/components/schemas/Id'
        task:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        options:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
          default: true
        portable:
          $ref: '#/components/schemas/ProcessingStageOptions'
        phase:
          type: string
          enum:
          - inference_input
          - presentation
      required:
      - id
      - kind
    PipelineCreate:
      type: object
      additionalProperties: false
      description: 'Exactly one mode: simple (model_id plus task) OR advanced (stages array). Advanced pipelines may
        contain only filters. Options and retention are pipeline defaults; no separate profile resource. Models must
        be registered and available.'
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        model_id:
          $ref: '#/components/schemas/Id'
          description: 'Shorthand pipeline: one inference stage, model selected by ID.'
        task:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
          minItems: 1
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
      required:
      - id
      - name
      oneOf:
      - required:
        - model_id
        - task
        not:
          required:
          - stages
      - required:
        - stages
        not:
          anyOf:
          - required:
            - model_id
          - required:
            - task
    Pipeline:
      type: object
      additionalProperties: false
      description: Resolved simple or advanced definition. Read back the revision to audit immutable observations.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        model_id:
          $ref: '#/components/schemas/Id'
        task:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
        revision:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - name
      - revision
      - created_at
    PipelinePatch:
      type: object
      additionalProperties: false
      description: Atomic JSON merge patch. Explicit null clears a field, allowing simple/advanced mode switches. The
        resolved pipeline must satisfy PipelineCreate oneOf. Never silently deep-merge stages.
      properties:
        name:
          type: string
        description:
          type: string
        model_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        task:
          oneOf:
          - type: string
          - type: 'null'
        stages:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/PipelineStage'
            minItems: 1
          - type: 'null'
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
    MonitorCondition:
      type: object
      additionalProperties: false
      description: Evaluated only from visual observations; no arbitrary actions. zone_id is required for zone/line events.
        Disappearance requires established tracking state; dropped frames or unknown motion never imply absence.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        event:
          type: string
          enum:
          - object_appears
          - object_disappears
          - enters_zone
          - exits_zone
          - line_crosses
          - count_threshold
          - dwell_time
          - motion_detected
        zone_id:
          $ref: '#/components/schemas/Id'
          description: Refers to a SourceZone.id belonging to the monitor source
        classes:
          type: array
          items:
            type: string
        threshold:
          type: number
          minimum: 0
        minimum_duration_ms:
          type: integer
          minimum: 0
        cooldown_ms:
          type: integer
          minimum: 0
        enabled:
          type: boolean
          default: true
        capture_on_match:
          type: boolean
          default: false
        clip_on_match:
          type: boolean
          default: false
      required:
      - id
      - event
    MonitorCreate:
      type: object
      additionalProperties: false
      description: Persistent desired state. Service manages runtime workers and restarts; viewers need not manage sessions.
        Creating a monitor does not imply storing video or emitting events. publish_events also requires service-level
        enabled allowlist.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        source_id:
          $ref: '#/components/schemas/Id'
        pipeline_id:
          $ref: '#/components/schemas/Id'
        enabled:
          type: boolean
          default: true
        restart_policy:
          type: string
          enum:
          - on_failure
          - always
          - never
          default: on_failure
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/MonitorCondition'
        publish_events:
          type: boolean
          default: false
      required:
      - id
      - name
      - source_id
      - pipeline_id
    Monitor:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        source_id:
          $ref: '#/components/schemas/Id'
        pipeline_id:
          $ref: '#/components/schemas/Id'
        enabled:
          type: boolean
        restart_policy:
          type: string
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/MonitorCondition'
        publish_events:
          type: boolean
        state:
          type: string
          enum:
          - starting
          - running
          - stopped
          - failed
          - disabled
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_observation_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        last_failure:
          oneOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: 'null'
      required:
      - id
      - name
      - source_id
      - pipeline_id
      - enabled
      - state
      - conditions
    MonitorPatch:
      type: object
      additionalProperties: false
      description: If supplied, conditions replaces the entire condition list. Mutation is atomic under If-Match.
      properties:
        name:
          type: string
        source_id:
          $ref: '#/components/schemas/Id'
        pipeline_id:
          $ref: '#/components/schemas/Id'
        enabled:
          type: boolean
        restart_policy:
          type: string
          enum:
          - on_failure
          - always
          - never
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/MonitorCondition'
        publish_events:
          type: boolean
    SourceInput:
      type: object
      additionalProperties: false
      description: Exactly one source_id (current frame) or media_id (finite image/video input). frame_at_ms only valid
        for media/video.
      properties:
        source_id:
          $ref: '#/components/schemas/Id'
        media_id:
          $ref: '#/components/schemas/Id'
        frame_at_ms:
          type: integer
          minimum: 0
      oneOf:
      - required:
        - source_id
        not:
          required:
          - media_id
      - required:
        - media_id
        not:
          required:
          - source_id
    AnalyzeRequest:
      type: object
      additionalProperties: false
      description: One current frame or one stored still, synchronous. Omitted pipeline resolves settings.default_pipeline_id;
        otherwise 422. A temporal motion filter cannot run on an isolated still without a documented baseline. Requested
        retention can tighten, not exceed, pipeline and service limits.
      properties:
        source:
          $ref: '#/components/schemas/SourceInput'
        pipeline_id:
          $ref: '#/components/schemas/Id'
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
      required:
      - source
    AnalyzeResponse:
      type: object
      additionalProperties: false
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        processing_ms:
          type: number
          minimum: 0
        media_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
            description: Only when an explicitly retained output image is generated
          - type: 'null'
      required:
      - observations
      - processing_ms
    ImageAnalyzeOptions:
      type: object
      additionalProperties: false
      description: JSON form part alongside multipart image; may be omitted if a default pipeline is configured.
      properties:
        pipeline_id:
          $ref: '#/components/schemas/Id'
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
    MediaRange:
      type: object
      additionalProperties: false
      description: end_ms must be greater than start_ms.
      properties:
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 0
      required:
      - start_ms
      - end_ms
    ExportOptions:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          enum:
          - mp4
          - webm
          - jpeg
          - png
        annotated:
          type: boolean
          default: false
        include_audio:
          type: boolean
          default: false
        quality:
          type: integer
          minimum: 1
          maximum: 100
    JobCreate:
      type: object
      additionalProperties: false
      description: Finite asynchronous work. Exactly one of source_id or media_id; media_export requires output. video_analysis
        requires pipeline_id or configured default. No permanent storage except explicitly requested generated media.
      properties:
        kind:
          type: string
          enum:
          - video_analysis
          - media_export
        source_id:
          $ref: '#/components/schemas/Id'
        media_id:
          $ref: '#/components/schemas/Id'
        pipeline_id:
          $ref: '#/components/schemas/Id'
        range:
          $ref: '#/components/schemas/MediaRange'
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
        output:
          $ref: '#/components/schemas/ExportOptions'
      required:
      - kind
      oneOf:
      - required:
        - source_id
        not:
          required:
          - media_id
      - required:
        - media_id
        not:
          required:
          - source_id
    Job:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
        state:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        ended_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        progress:
          type: number
          minimum: 0
          maximum: 1
        media_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        failure:
          oneOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: 'null'
      required:
      - id
      - kind
      - state
      - created_at
      - media_ids
    JobPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
    Media:
      type: object
      additionalProperties: false
      description: Unified retention and download resource. Media created by upload/capture/recording/job is immutable.
        Deletion while referenced by active work returns 409. Expiration and access controls are kind-aware.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - upload_image
          - upload_video
          - snapshot
          - clip
          - recording
          - derived_image
          - derived_video
        origin:
          type: string
          enum:
          - upload
          - capture
          - recording
          - job
          - monitor
        source_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        job_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        monitor_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        duration_ms:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        annotated:
          type: boolean
          default: false
        sha256:
          type: string
      required:
      - id
      - kind
      - origin
      - mime_type
      - size_bytes
      - created_at
    MediaPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
    CaptureRequest:
      type: object
      additionalProperties: false
      description: Always retains one exact frame as Media (kind=snapshot). Use GET frame for unretained capture. Annotated
        capture requires a supported pipeline and may run inference.
      properties:
        pipeline_id:
          $ref: '#/components/schemas/Id'
        annotated:
          type: boolean
          default: false
        ttl_seconds:
          type: integer
          minimum: 1
    RecordingCreate:
      type: object
      additionalProperties: false
      description: Recording is explicit and independent from viewing/analysis/monitoring; standard output is an immutable
        Media object. Annotated recording requires pipeline_id and a supported annotation-capable output.
      properties:
        source_id:
          $ref: '#/components/schemas/Id'
        pipeline_id:
          $ref: '#/components/schemas/Id'
        include_audio:
          type: boolean
          default: false
        max_duration_seconds:
          type: integer
          minimum: 1
        output:
          $ref: '#/components/schemas/ExportOptions'
      required:
      - source_id
    Recording:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        source_id:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum:
          - starting
          - recording
          - stopping
          - completed
          - failed
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        finished_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        media_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        failure:
          oneOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: 'null'
      required:
      - id
      - source_id
      - state
      - created_at
    RecordingPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recording'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
    Settings:
      type: object
      additionalProperties: false
      description: Typed portable settings, no credentials. default_pipeline_id makes one-command analyze/view-with-annotations
        possible.
      properties:
        default_pipeline_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        events_enabled:
          type: boolean
          default: false
        events_allowlist:
          type: array
          items:
            type: string
        events_queue_capacity:
          type: integer
          minimum: 1
        max_viewers:
          type: integer
          minimum: 1
        max_monitors:
          type: integer
          minimum: 1
        max_jobs:
          type: integer
          minimum: 1
        max_uploaded_bytes:
          type: integer
          minimum: 1
        max_source_fps:
          type: number
          minimum: 0.1
        max_observation_retention_seconds:
          type: integer
          minimum: 0
        max_media_retention_seconds:
          type: integer
          minimum: 0
        default_observations_persist:
          type: boolean
          default: false
        max_frame_cache:
          type: integer
          minimum: 1
        stream_replay_capacity:
          type: integer
          minimum: 1
        remote_inference_allowed:
          type: boolean
          default: false
    SettingsPatch:
      type: object
      additionalProperties: false
      description: Atomic partial setting update; each supplied field replaces exactly that leaf, never a deep merge.
      properties:
        default_pipeline_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        events_enabled:
          type: boolean
          default: false
        events_allowlist:
          type: array
          items:
            type: string
        events_queue_capacity:
          type: integer
          minimum: 1
        max_viewers:
          type: integer
          minimum: 1
        max_monitors:
          type: integer
          minimum: 1
        max_jobs:
          type: integer
          minimum: 1
        max_uploaded_bytes:
          type: integer
          minimum: 1
        max_source_fps:
          type: number
          minimum: 0.1
        max_observation_retention_seconds:
          type: integer
          minimum: 0
        max_media_retention_seconds:
          type: integer
          minimum: 0
        default_observations_persist:
          type: boolean
          default: false
        max_frame_cache:
          type: integer
          minimum: 1
        stream_replay_capacity:
          type: integer
          minimum: 1
        remote_inference_allowed:
          type: boolean
          default: false
    SettingValue:
      type: object
      additionalProperties: false
      description: Typed value enforced against the schema of the setting path key.
      properties:
        value:
          description: An arbitrary JSON value; the setting key determines its validated schema.
      required:
      - value
    PortableEngine:
      type: object
      additionalProperties: false
      description: Logical desired state only; omits runtime state and engine capability descriptors.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties: true
      required:
      - id
      - enabled
    PortableSource:
      type: object
      additionalProperties: false
      description: No usable locator or credentials are exported. Import must reuse existing binding by ID or supply
        source_bindings.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        redacted_locator:
          type: string
        zones:
          type: array
          items:
            $ref: '#/components/schemas/SourceZone'
        options:
          type: object
          additionalProperties: true
      required:
      - id
      - kind
      - name
      - redacted_locator
    SourceBinding:
      type: object
      additionalProperties: false
      description: Import-time binding only, never exported; secret_ref names an out-of-band credential.
      properties:
        locator:
          type: string
        secret_ref:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - locator
    PortableConfiguration:
      type: object
      additionalProperties: false
      description: Logical configuration only; source locations redacted, secret values never exported. A model resource_ref
        must not include credentials. Runtime state, uploaded media and observations are not portable.
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
        engines:
          type: array
          items:
            $ref: '#/components/schemas/PortableEngine'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelCreate'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/PortableSource'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/PipelineCreate'
        monitors:
          type: array
          items:
            $ref: '#/components/schemas/MonitorCreate'
    ConfigurationImport:
      type: object
      additionalProperties: false
      description: Validated and atomically applied under If-Match. Missing source locator must resolve from existing
        source ID or source_bindings; never import redacted_locator as a real URI. Return 422 for unresolved bindings
        and 409 if incompatible running work prevents a safe swap.
      properties:
        configuration:
          $ref: '#/components/schemas/PortableConfiguration'
        mode:
          type: string
          enum:
          - replace
          default: replace
        source_bindings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SourceBinding'
      required:
      - configuration
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down
        ready:
          type: boolean
          description: True when the service can perform useful work (probes use it as readiness).
        uptime_seconds:
          type: number
          minimum: 0
        components:
          type: object
          additionalProperties: true
      required:
      - status
      - ready
    Metrics:
      type: object
      additionalProperties: false
      properties:
        counters:
          type: object
          additionalProperties:
            type: number
        gauges:
          type: object
          additionalProperties:
            type: number
      required:
      - counters
      - gauges
    EventStatus:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        topics:
          type: array
          items:
            type: string
        queue_capacity:
          type: integer
          minimum: 0
        drops:
          type: integer
          minimum: 0
        transport_status:
          type: string
      required:
      - enabled
      - topics
      - queue_capacity
      - drops
      - transport_status
  parameters:
    OpalSessionIdHeader:
      name: X-Opal-Session-Id
      in: header
      required: false
      description: Logical session context, distinct from any internal inference run
      schema:
        $ref: '#/components/schemas/Id'
    OpalTransactionIdHeader:
      name: X-Opal-Transaction-Id
      in: header
      required: false
      description: End-to-end transaction ID
      schema:
        $ref: '#/components/schemas/Id'
    OpalRequestIdHeader:
      name: X-Opal-Request-Id
      in: header
      required: false
      description: Unique ID per HTTP hop
      schema:
        $ref: '#/components/schemas/Id'
    OpalCausationIdHeader:
      name: X-Opal-Causation-Id
      in: header
      required: false
      description: Direct parent action ID
      schema:
        $ref: '#/components/schemas/Id'
    OpalIfMatch:
      name: If-Match
      in: header
      required: true
      description: Required current strong ETag of the complete logical configuration. Missing returns 428,
        stale returns 412. One exact strong quoted tag required; weak tags, lists and * are rejected with 422.
      schema:
        type: string
        pattern: '^"[^"]+"$' 
    OpalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replay-safe runtime admission for 24 hours. Different payload with same key returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Optional replay cursor for monitor SSE only. A stale cursor fails 409.
      schema:
        type: string
    OpalLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OpalCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EngineId:
      name: engine_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PipelineId:
      name: pipeline_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MonitorId:
      name: monitor_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ObservationId:
      name: observation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OpalRange:
      name: Range
      in: header
      required: false
      schema:
        type: string
      description: Optional bytes=start-end on supported immutable media content. Invalid range returns 416.
  headers:
    OpalSessionIdHeader:
      description: Logical session context, distinct from any internal inference run
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    OpalTransactionIdHeader:
      description: End-to-end transaction ID
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OpalRequestIdHeader:
      description: Unique ID per HTTP hop
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OpalCausationIdHeader:
      description: Direct parent action ID
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    ETagHeader:
      description: Strong portable configuration revision
      schema:
        type: string
    LocationHeader:
      description: URL of the created resource
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed input
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    Forbidden:
      description: Access denied
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    NotFound:
      description: Resource not found
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    Conflict:
      description: State conflict, including stale SSE replay or referenced media
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    Gone:
      description: Resource expired
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    OpalError412:
      description: Strong ETag did not match
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    RangeNotSatisfiable:
      description: Requested byte range is invalid or unsupported
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    OpalError422:
      description: Invalid, unsupported or incompatible input
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    OpalError428:
      description: If-Match required
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    CapacityExceeded:
      description: Capacity or quota exceeded
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    OperationFailed:
      description: Internal processing error
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    ServiceUnavailable:
      description: Unavailable capability or dependency
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Optional on loopback deployments; required on non-loopback interfaces.
        Bearer credentials are configured via token_env. Correlation headers are transport
        context, never authorization credentials.
x-opal-cli:
  root: opal look
  resource_verbs:
  - add
  - remove
  - update
  - list
  - show
  options: kebab-case
  shortcuts:
  - command: view
    operationId: sources_view
    positional:
    - source_id
    example: opal look view driveway --pipeline people
    argument_map:
      --pipeline: query.pipeline_id
      --annotations: query.annotations
  - command: analyze
    operationId: analyze_run
    positional:
    - source.source_id
    example: opal look analyze driveway --pipeline people
    argument_map:
      --pipeline: body.pipeline_id
      source_id: body.source.source_id
  notes: Canonical grouped commands remain available. Shortcuts are explicitly specified convenience bindings; the analyze
    group must accept its default-command callback without breaking analyze image.
x-opal-compatibility:
  breaking_from: 1.4.0
  migration: See companion migration guide. Legacy profiles/sessions/zones/rules/captures/artifacts are not exposed as
    public resources.
x-opal-event-contract:
  envelope: OPAL suite BusEvent versioned envelope; topic frame + JSON body with data.metadata and correlation IDs
  example_topics:
  - opal.look.observation
  - opal.look.condition.matched
  - opal.look.monitor.failed
  rules: Disabled by default, explicitly allowlisted, bounded drop-newest queue; never blocks source or inference; best
    effort only. Condition matches may request snapshot/clip retention; an event alone does not retain imagery.
x-opal-filter-catalog:
  portable_filters:
    grayscale: No parameters
    brightness_contrast: brightness [-1,1], contrast [0,4]
    blur: kernel_size odd integer [3,31]
    sharpen: amount [0,3]
    threshold: threshold [0,255]
    edges: low_threshold [0,255], high_threshold [0,255], low<=high
    rotate: degrees one of 0,90,180,270
    flip: axis horizontal or vertical
    crop: roi normalized rectangle
    resize: width and/or height positive
    motion: MotionFilterParameters; modes none/highlight/mask
  semantics: Filters evaluated in declared order. Preprocess affects inference; presentation is isolated. Motion requires
    sequential source frames, resets on source discontinuity, and warmup produces unknown state. Unsupported types, parameter
    keys or pipeline topologies return 422.

x-opal-context-standard:
  version: '1.4'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    propagate:
    - session_id
    - transaction_id
    - request_id
    - causation_id
    metadata_schema_version: '1.0'
    zero_mq_frames: 2
    compatibility: metadata_schema_version versions the optional data.metadata block only; the two-frame
      wire envelope (topic + JSON with topic/data) is unchanged across versions. Consumers extract known
      correlation keys (session_id, transaction_id, request_id, causation_id) and MUST ignore unknown
      metadata fields; producers may emit any metadata_schema_version without breaking the wire contract.
  pagination:
    history: cursor
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  streaming: Include HTTP context headers before bytes; after headers are sent, failures are represented
    by transport-specific terminal events or stream termination; no invented resumability.
x-opal-stage: draft
x-opal-authorization:
  version: '1.0'
  description: Suite REST authentication and authorization semantics. Loopback-only
    deployments may explicitly disable authentication; non-loopback deployments require
    authentication. Privileged configuration operations require authorization. 401
    means missing or invalid authentication; 403 means authenticated but not permitted.
    Correlation IDs are never authorization credentials. Secret values must not appear
    in responses, exports, or error details.
  semantics:
    missing_or_invalid_credentials: '401'
    authenticated_but_not_permitted: '403'
    loopback: authentication may be explicitly disabled on loopback deployments
    non_loopback: authentication required
    privileged_operations: authorization required for configuration mutations
    credentials: correlation headers are transport context, never authorization credentials
    secrets: secret values must not appear in responses, exports, or error details
