components:
  schemas:
    Id:
      type: string
      description: Portable resource identifier, not a secret.
      minLength: 1
      maxLength: 128
      pattern: ^[!-~]+$
    Timestamp:
      type: string
      format: date-time
    OpalError:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/Id'
        transaction_id:
          $ref: '#/components/schemas/Id'
        session_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        causation_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
      - transaction_id
    ValidationIssue:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
          - error
          - warning
      required:
      - path
      - message
      - severity
    ValidationResult:
      type: object
      additionalProperties: false
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
      required:
      - valid
      - issues
    Point:
      type: object
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
      required:
      - x
      - y
    NormalizedPolygon:
      type: array
      items:
        $ref: '#/components/schemas/Point'
      minItems: 3
    NormalizedBox:
      type: object
      additionalProperties: false
      description: Top-left and dimensions relative to orientation-corrected source frame; cannot extend outside image.
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
