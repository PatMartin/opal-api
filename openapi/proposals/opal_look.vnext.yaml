openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OPAL LOOK — Simplified Visual Observation API (vnext draft)
  version: '2.0.0-draft.1'
  summary: Make viewing effortless, analysis composable, and continuous monitoring declarative.
  description: 'DRAFT / BREAKING REVISION of opal-api/openapi/opal_look.yaml v1.4.0. Public concepts are sources, engines/models,
    pipelines, monitors, observations, jobs, media and recordings. Pipelines own reusable inference/retention defaults
    (profiles removed). Sources own named zones. Monitors own observation conditions (standalone rules removed) and persist
    across restarts. Live viewing/streaming is connection-scoped; callers do not create/manage sessions. Session execution
    identities remain internal and MUST NOT be confused with the X-Opal-Session-Id correlation header. Media unifies
    uploaded inputs, snapshots, recordings, and derived artifacts with distinct immutable kind, origin, TTL and deletion
    guards. OPAL-LOOK detects visual events but never executes shell, HTTP, or other automation actions: OPAL-EVENT consumes
    best-effort events. Unimplemented, unsafe, unrecognized, or unsupported capabilities fail explicitly; do not silently
    ignore options. No automatic model installation, face/identity recognition, arbitrary code execution, or provider
    credential provisioning. Video and image capture are optional by deployment but discoverable. No background data
    retention by default except explicitly requested recording/upload; user-requested monitor retention is configurable.
    All operations provide x-opal-cli.group and x-opal-cli.command metadata (Typer root: opal look). Resource verbs:
    add, remove, update, list, show; operational verbs: view, run, start, stop, stream, capture, validate, probe, etc.
    Source locators are redacted on GET and in exports, secrets are provided by secret_ref out of band; no secret bytes
    in exports. Strong ETag represents portable logical configuration; all mutations to sources, engines, models, pipelines,
    monitors, and settings require If-Match (or *), return 428 when missing and 412 when stale. Runtime activity does
    not change configuration ETags. Admissions for jobs and recordings accept Idempotency-Key, with matching replay returning
    original admission and mismatched body returning 409 (24h reservation). API resource paths are /api/v1, collection
    paths use a trailing slash; this is a breaking contract revision to existing /api/v1 paths and payloads; do not deploy over v1.4.0 without a coordinated migration. Binary endpoints and SSE return X-Opal
    correlation headers. X-Opal-Session-Id is the logical caller context; X-Opal-Transaction-Id is an end-to-end transaction;
    X-Opal-Request-Id is unique per HTTP hop; X-Opal-Causation-Id is immediate parent. All IDs supplied by clients are
    1..128 printable non-whitespace ASCII. Streaming GETs are explicit exceptions to no-work-on-GET: they allocate only
    bounded, connection-scoped work; disconnect releases it. Monitor SSE supports bounded Last-Event-ID replay; stale
    replay 409. Frame/image GETs never run inference. Presentation filters must never modify inference inputs or persisted
    observations. Motion detection requires a temporal baseline; unknown is not no motion, and gating never implies object
    absence. Tracks are ephemeral, not personal identities. Returned boxes use normalized coordinates on the source orientation-corrected
    frame. Broker emission defaults off, uses an allowlist and bounded queue, publishes opal-event envelope (data.metadata),
    never blocks inference, and offers no delivery/ordering/exactly-once guarantee. Non-loopback deployments require
    bearer auth and secure broker transport. Remote inference is disabled unless explicitly configured.'
servers:
- url: http://127.0.0.1:8080
  description: Local service (loopback default)
security:
- BearerAuth: []
tags:
- name: discovery
  description: Capabilities and runtime engine discovery
- name: engines
  description: Installed inference engines
- name: models
  description: Model registration; does not download or install models
- name: sources
  description: Camera, video and frame inputs
- name: pipelines
  description: Reusable processing, filters, inference and retention
- name: monitors
  description: Durable camera observation and conditions
- name: analyze
  description: One-off image or frame inference
- name: jobs
  description: Finite asynchronous video analysis or export
- name: observations
  description: Immutable visual inference metadata
- name: media
  description: Uploaded and generated image/video objects
- name: recordings
  description: Explicit continuous recording
- name: settings
  description: Portable service configuration
- name: configuration
  description: Import, export and validation
- name: operations
  description: Health, metrics and event diagnostics
paths:
  /api/v1/capabilities/:
    get:
      tags:
      - discovery
      operationId: capabilities_show
      summary: Discover supported tasks, inputs and limits
      x-opal-cli:
        group: capabilities
        command: show
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdHeader'
      - $ref: '#/components/parameters/OpalTransactionIdHeader'
      - $ref: '#/components/parameters/OpalRequestIdHeader'
      - $ref: '#/components/parameters/OpalCausationIdHeader'
      responses:
        '200':
          description: Success
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityCatalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '500':
          $ref: '#/components/responses/OperationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
