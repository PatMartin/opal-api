    get:
      tags:
      - sources
      operationId: sources_view
      summary: View ephemeral source MJPEG; optional analysis and overlays
      x-opal-cli:
        group: sources
        command: view
      description: Connection-scoped viewer; opening does not create a persistent session or monitor. Without pipeline_id,
        source-only view is raw and cheap. With pipeline_id, overlays default on unless annotations=false. Any pipeline
        inference is bounded to this connection. Closing the connection releases viewer-specific resources, never stops
        monitors/recordings. Processing/overlay choices are fixed at request start and changed by reconnect. Backpressure
        drops frames, never unbounded queues. Presentation filters never change inference or persisted observations.
        Server can share decode and inference but must isolate viewer settings.
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdHeader'
      - $ref: '#/components/parameters/OpalTransactionIdHeader'
      - $ref: '#/components/parameters/OpalRequestIdHeader'
      - $ref: '#/components/parameters/OpalCausationIdHeader'
      - $ref: '#/components/parameters/SourceId'
      - name: pipeline_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        description: Optional pipeline; omitted means raw frames, no inference.
      - name: annotations
        in: query
        required: false
        schema:
          type: boolean
        description: 'When omitted: true if a pipeline_id is selected, false for raw view. Explicit false disables overlays.'
      - name: classes
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated classes for presentation only.
      - name: min_confidence
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 1
        description: Presentation-only threshold.
      - name: target_fps
        in: query
        required: false
        schema:
          type: number
          minimum: 0.1
      - name: width
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: height
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: quality
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: show_boxes
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: show_labels
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: show_confidence
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: presentation_filter
        in: query
        required: false
        schema:
          type: string
        description: Compact URL-encoded JSON FilterSpec for one presentation-only filter.
      responses:
