          - $ref: '#/components/schemas/Id'
          - type: 'null'
        media_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        monitor_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        job_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        pipeline_id:
          $ref: '#/components/schemas/Id'
        pipeline_revision:
          type: string
        stage_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        engine_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        model_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        task:
