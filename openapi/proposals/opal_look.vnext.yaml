        media_types:
          type: array
          items:
            type: string
        stream_transports:
          type: array
          items:
            type: string
        export_formats:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        filters:
          type: array
          items:
            type: string
        visualization_modes:
          type: array
          items:
            type: string
        supports_raw_stream:
          type: boolean
        supports_motion_gate:
          type: boolean
        supports_recording:
          type: boolean
        supports_monitoring:
          type: boolean
        supports_finite_video_analysis:
          type: boolean
        supports_remote_inference:
          type: boolean
      required:
      - tasks
