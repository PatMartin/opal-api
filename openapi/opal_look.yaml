    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/sessions/:
    post:
      tags:
      - sessions
      summary: Start analysis session
      description: Resolve and snapshot configuration, check source/model/engine compatibility and admission capacity,
        and create a starting session. Returns 202 with Location pointing to session GET; runtime startup failure
        becomes failed and is observable through GET/SSE. One selected task/model. No automatic video recording.
        Optional Idempotency-Key protects admission retries as documented below.
      operationId: post_api_v1_sessions
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '202':
          description: Session admitted for asynchronous startup, including immediately terminal sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
          headers:
            Location:
              description: Relative URL /api/v1/sessions/{session_id}
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        description: Service-scoped retry key, retained durably for 24 hours from first successful admission. Same
          key and semantically identical submitted JSON returns original 202 admission response and Location without
          creating or restarting a session. Different submitted content returns 409 idempotency_conflict. Profile/default
          resolution occurs only on first admission. See global admission retry semantics.
    get:
      tags:
      - sessions
      summary: List sessions
      description: 'Return session records including terminal sessions. Terminal records are retained for result_retention_hours
        after finished_at, independently of result deletion; nonterminal sessions remain. List is newest-created
        first.

        Use cursor pagination, stable descending time-plus-ID ordering; filters are bound into the cursor. Invalid
        or mismatched cursors return 422. Response next_cursor is null at end.

        '
      operationId: get_api_v1_sessions
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionRead'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                required:
                - items
                - next_cursor
                - has_more
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
      parameters:
      - name: source_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - starting
          - running
          - reconnecting
          - stopping
          - stopped
          - completed
          - failed
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Maximum items per page.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque continuation token returned from the preceding page.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: Get session
      description: Return immutable resolved configuration, state, counters and latest failure. GET does not restart
        or advance a stopped session.
      operationId: get_api_v1_sessions_session_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    delete:
      tags:
      - sessions
      summary: Delete session record
      description: Only terminal sessions may be deleted; nonterminal returns 409. Results and retained snapshots
        remain queryable until independently deleted/expired. Deletion closes event streams; it never deletes source/model
        configuration.
      operationId: delete_api_v1_sessions_session_id
      responses:
        '204':
          description: Deleted/reset; no response body.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/sessions/{session_id}/stop:
    post:
      tags:
      - sessions
      summary: Stop session
      description: Request graceful stop; return current stopping/terminal state with 200. Repeated calls are idempotent.
        Frames already in flight may finish before stopped; no new captures start after stopping. EOF may race and
        produce completed. Stop is valid while starting, running or reconnecting.
      operationId: post_api_v1_sessions_session_id_stop
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/sessions/{session_id}/results/latest:
    get:
      tags:
      - results
      summary: Get latest session result
      description: Return latest successful result, even when persistent history is disabled. Latest is an ephemeral
        cache retained while session exists, subject to result-retention expiry; result-specific GET only accesses
        persistent history. No result yet returns 409 result_unavailable. A stale result during reconnect remains
        latest until replaced.
      operationId: get_api_v1_sessions_session_id_results_latest
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/sessions/{session_id}/events:
    get:
      tags:
      - results
      summary: Stream session events
      description: 'SSE stream, UTF-8, Cache-Control: no-cache, proxy buffering disabled. Frames: id: opaque token;
        event: result/state/error/end; data: one EventEnvelope JSON; blank line terminator. Fresh connection emits
        current state, then new events; it does not replay all stored history. A terminal session emits state then
        end and closes. Heartbeat comment at least every 15 seconds. Last-Event-ID resumes after that event within
        the bounded per-session replay window. Unknown/expired token returns 410 replay_expired before streaming;
        token for another session returns 422. Resume never reconstructs events from result history. After replay,
        if terminal and end was already acknowledged, close normally. Replay is bounded by sse_replay_seconds and
        sse_buffer_events. Slow consumers whose buffered events are evicted get error stream_overflow then disconnect;
        recover using result history/latest and open a fresh stream. Client disconnect never stops analysis. Each
        successful frame emits result, even an empty detection. Session state transitions emit state; failures emit
        error then terminal state and end. After HTTP 200, errors are in-band rather than HTTP statuses.'
      operationId: get_api_v1_sessions_session_id_events
      responses:
        '200':
          description: Successful response.
          content:
            text/event-stream:
              schema:
                type: string
                description: Wire-format SSE text. Each data record conforms to EventEnvelope.
              example: 'id: evt-0001

                event: end

                data: {"event_id":"evt-0001","session_id":"session-1","created_at":"2026-10-06T22:00:00Z","type":"end","data":{"state":"completed"}}


                '
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/sessions/{session_id}/preview:
    get:
      tags:
      - visuals
      summary: Stream session preview
      description: 'multipart/x-mixed-replace JPEG stream, boundary=frame. Each part has Content-Type: image/jpeg,
        Content-Length, X-Opal-Result-Id, X-Opal-Frame-Index; CRLF-delimited MIME headers and bytes. Display latest
        successfully analyzed frame, including frames with zero matches; no rerun or analysis of skipped frames.
        annotated=true overlays that exact result. Optional fps must not exceed max_preview_fps; unsupported rate
        returns 422. New parts appear only for new results, so source/analysis may yield less FPS. Preview may drop
        visual frames for slow clients; this never changes metadata results. No bytes retained. Reconnecting pauses
        parts, terminal sessions close stream after final available part. Unavailable frame cache before headers
        returns 409 frame_unavailable; errors after streaming begins close stream. Client disconnect does not stop
        session.'
      operationId: get_api_v1_sessions_session_id_preview
      responses:
        '200':
          description: Successful response.
          content:
            multipart/x-mixed-replace; boundary=frame:
              schema:
                type: string
                format: binary
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: annotated
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: fps
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/results/:
    get:
      tags:
      - results
      summary: Search result history
      description: 'Only stored, unexpired results. All filters combine with AND; task-incompatible class/text filters
        return 422. Source/model/session IDs are historical values, so filters remain valid after configuration
        deletion. from must precede to. Empty matches return 200 empty page. No image bytes included. All cursor-based
        inventory endpoints use opaque, filter-bound newest-first pagination; invalid cursor 422, expired cursor
        410.

        Use cursor pagination, stable descending time-plus-ID ordering; filters are bound into the cursor. Invalid
        or mismatched cursors return 422. Response next_cursor is null at end.

        '
      operationId: get_api_v1_results
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultQueryPage'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: source_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: model_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: task
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Task'
      - name: class_label
        in: query
        required: false
        schema:
          type: string
        description: Exact label present in task payload; OCR has no class label.
      - name: text
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive literal substring in OCR text only.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inclusive analyzed_at lower bound.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Exclusive analyzed_at upper bound.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Maximum items per page (suite max_limit 500). The configured
          max_result_query_limit bounds the total result set a query may scan, not the
          page size.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque continuation token returned from the preceding page.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/results/{result_id}:
    get:
      tags:
      - results
      summary: Get stored result
      description: Return persisted metadata, not frame bytes. A store_result=false result has no history item and
        returns 404 here. Expired but not yet purged result returns 410; purged/unknown/deleted returns 404.
      operationId: get_api_v1_results_result_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
    delete:
      tags:
      - results
      summary: Delete stored result
      description: Delete only metadata history. Does not delete retained snapshots or source media. Latest-session
        cache/replay must no longer expose the deleted result on new retrieval/replay requests; already delivered
        events cannot be recalled.
      operationId: delete_api_v1_results_result_id
      responses:
        '204':
          description: Deleted/reset; no response body.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: result_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/results/{result_id}/snapshot:
    post:
      tags:
      - visuals
      summary: Capture exact result snapshot
      description: Capture JPEG from the short-lived exact analyzed frame cache. Works for stored or ephemeral result
        IDs while the frame remains cached. It never reopens a video/live source to substitute another frame. Missing/evicted
        frame returns 409 frame_unavailable; unknown result returns 404. With retain=false, returns image/jpeg bytes;
        retain=true returns 201 SnapshotRead plus Location. Snapshot creation is explicit; existing retained snapshots
        are downloaded separately. No automatic capture and no video recording.
      operationId: post_api_v1_results_result_id_snapshot
      responses:
        '200':
          description: Successful response.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '201':
          description: Explicitly retained snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRead'
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/snapshots/{snapshot_id}
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotRequest'
    parameters:
    - name: result_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/snapshots/:
    get:
      tags:
      - visuals
      summary: List retained snapshots
      description: 'List unexpired explicitly retained snapshots, newest first; result_id filter remains valid after
        result history expires.

        Use cursor pagination, stable descending time-plus-ID ordering; filters are bound into the cursor. Invalid
        or mismatched cursors return 422. Response next_cursor is null at end.

        '
      operationId: get_api_v1_snapshots
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SnapshotRead'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                required:
                - items
                - next_cursor
                - has_more
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
      parameters:
      - name: result_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Maximum items per page.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque continuation token returned from the preceding page.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/snapshots/{snapshot_id}:
    get:
      tags:
