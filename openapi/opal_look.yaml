      - visuals
      summary: Capture exact result snapshot
      description: Capture JPEG from the short-lived exact analyzed frame cache. Works for stored or ephemeral
        result IDs while the frame remains cached. It never reopens a video/live source to substitute another 
        frame. Missing/evicted frame returns 409 frame_unavailable; unknown result returns 404. With 
        retain=false, returns image/jpeg bytes; retain=true returns 201 SnapshotRead plus Location. Snapshot 
        creation is explicit; existing retained snapshots are downloaded separately. This snapshot API never 
        captures video. Independent recordings and clips use /api/v1/recordings/.
      operationId: post_api_v1_results_result_id_snapshot
      responses:
        '200':
          description: Successful response.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
