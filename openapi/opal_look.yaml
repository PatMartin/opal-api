        source_id: *id009
        zone_id: *id010
        kind: *id011
        class_filters: *id012
        threshold: *id013
        minimum_duration_ms: *id014
        cooldown_ms: *id015
        enabled: *id016
        capture_on_match: *id017
        clip_on_match: *id018
      additionalProperties: false
    MonitorCreate:
      type: object
      properties:
        id: &id019
          type: string
