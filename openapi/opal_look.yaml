      description: Start asynchronous source recording independent of inference. Return 202 immediately with 
        Location; admission may fail with 429 capacity or 415 missing encoder. No automatic recording unless 
        configured by trigger clips.
      operationId: opal_look_15_recordings_start_recording
      responses:
        '202':
          description: Accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingRead'
