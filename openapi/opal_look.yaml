openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OPAL Look — Visual Observation API
  version: 1.4.0
  description: 'Clean-sheet, implementation-neutral visual perception API for OPAL 1.4.0. OpenAPI is normative for
    REST, generated CLI, and SPA clients. A source provides frames; a pipeline is an ordered acyclic graph of inference
    and processing stages; a stage produces immutable observations; sessions run live pipelines; jobs run finite
    work; monitors express durable desired state. A given frame can produce multiple typed observations from multiple
    stages, without repeated decode. Engine/model-specific options are validated against advertised capability schemas,
    never silently ignored. Optional tasks (segmentation, pose, OCR, caption, VQA, depth, embeddings, anomaly) use
    typed observation items and capability discovery; the base implementation must support image/video detection.
    No model download, training, provider provisioning, identity recognition, or arbitrary host shell execution
    is exposed by this contract.


    OPAL suite standard: X-Opal-Session-Id denotes logical context (distinct from Look session resource IDs); X-Opal-Transaction-Id
    is one end-to-end operation; X-Opal-Request-Id is per HTTP hop; X-Opal-Causation-Id identifies immediate parent.
    Correlation headers are returned for successes, failures, streams and binary responses; IDs are propagated in
    event data.metadata. Each client ID must be 1..128 printable non-whitespace ASCII bytes or 422. Request IDs
    are newly generated on each downstream HTTP hop. These IDs never grant access.


    Configuration: portable logical configuration has one strong ETag, returned on configuration GETs and successful
    writes; all configuration mutations require If-Match strong validator (or ''*''). Missing 428, stale 412, malformed
    422. Validation never mutates and returns valid=false with issues. Runtime state does not advance portable configuration
    revision; concurrent runtime jobs/sessions may block incompatible configuration mutation with 409. Write operations
    are atomic. Source locators are redacted in GET/exports; secrets are never exportable. Filesystem/provider resources
    are referenced, not installed/deleted by this API.


    Collection paths end with /. Creates return 201 with Location; async admissions return 202 with Location; delete
    returns 204. Cursor collections are newest-first then ID tie-breaker, filter-bound and expiry-limited; bounded
    catalogs are full arrays with documented caps. Settings allow atomic whole-map PATCH and individual leaf GET/PUT/DELETE,
    where DELETE resets the default. Runtime admissions can use Idempotency-Key; exact replay reuses original admission,
    differing payload returns 409, reservation lifetime 24 hours. Unsupported controls, source tasks, media types,
    schemas and pipeline topologies fail explicitly with 422. GET never starts inference.


    Live results use SSE (event IDs and bounded replay via Last-Event-ID; stale replay returns 409, not an inaccurate
    new stream); streams end on terminal session and send heartbeats. Binary endpoints send exact MIME and correlation
    headers; snapshot/exact-frame retrieval never silently substitutes a different frame. Normalized coordinates
    refer to original orientation-corrected image, with explicit metadata; confidence values are model-derived,
    not comparable across engines. Track identities are ephemeral within a track epoch, not identity recognition.


    Observations are metadata by default. Persisting observations, images, video, audio and clips is explicit and
    independent with retention caps. Uploaded inputs, results, captures, and generated artifacts have separate TTLs
    and quotas. Video recording and annotated export are capability-gated; recording is not implied by inference.
    Closed or expired media returns 404/410 policy consistently; runtime resource quota returns 429. Rule evaluation
    is limited to visual observation conditions, not shell actions. Event output is disabled by default, uses an
    allowlist and bounded queue, never blocks inference, and follows opal-event''s two-frame ZeroMQ protocol and
    BusEvent envelope (metadata under data.metadata, no extra top-level fields). Event publication is best effort
    and never promises delivery, ordering or exactly-once execution. Deployment binds loopback by default; non-loopback
    requires bearer auth and secure broker transport. Remote providers can receive image content only when explicitly
    enabled.


    P0 required: image/frame inference, class detection, source registration and health, discovery, model registration,
    video live sessions and finite jobs, standardized observations, SSE, snapshots and operational controls. P1
    optional-but-specified: tracking, zones, visual rules, monitors, recordings, annotated export, OCR, image classification
    and event publication. P2/P3 features are capability-advertised extensions and may be absent.


    CLI METADATA (normative): Every operation has x-opal-cli.group and x-opal-cli.command.

    Resource management uses add, remove, update, list, show as its five canonical verbs.

    Operational actions keep explicit verbs (start, stop, upload, download, stream, capture,

    probe, status, validate, cancel, reset, patch, etc.). Generated Typer CLI root is

    `opal look` and each command is `opal look <group> <command>`. Options use kebab-case.

    No implicit aliases (create/delete/get/set) are generated. CLI must call only public REST

    endpoints. Runtime operations retain their lifecycle verbs; settings reset corresponds

    to removal of an override, not deletion of the setting definition. CLI metadata does

    not change HTTP routing or payloads. operationId values intentionally use the

    canonical CLI vocabulary and may affect existing generated SDK clients.



    CAMERA VIEWING AND FILTERING EXTENSION (clean-sheet 1.4.0 revision):

    - Raw viewing uses GET /api/v1/sources/{source_id}/stream with MJPEG; no durable viewer resource. Optional pipeline_id
    invokes sessionless transient processing and optional annotation query parameters. A stream is an ephemeral
    viewer, not a session or a recording.

    - Pipeline stages support portable image processing, motion filtering and motion-gated downstream inference.
    Filter-only pipelines are valid, and all unsupported options are rejected. Motion gating skips inference but
    never implies object absence and never suppresses source display. Periodic sampling avoids permanent blind spots.

    - Presentation options are independent from inference settings and persisted observations. All source/session
    preview query parameters are fixed at stream start; clients reconnect to change them.

    - Source frame GET may apply optional processing as a fresh single frame. POST /analyze/image supports rendered
    JPEG via Accept negotiation, while JSON remains the default response.

    - Side-by-side viewing uses two existing stream requests in the SPA. Pipeline duplication is GET followed by
    POST with a new id, not a new HTTP operation. Pipeline dry run uses POST /analyze/image, or POST /analyze/ with
    an existing source.

    - Source/output FPS and resizing are bounded by advertised source/encoder capabilities. Preprocess transforms
    change inference coordinate space internally; returned observation coordinates always map to the original orientation-corrected
    frame.

    - A motion filter requires temporal input and is invalid for a single independent still unless the engine explicitly
    supports a specified baseline; validation rejects unsupported modes. Frame drops or reconnections cannot be
    interpreted as no motion.

    '
servers:
- url: http://127.0.0.1:8080
security:
- BearerAuth: []
tags:
- name: discovery
- name: engines
- name: models
- name: sources
- name: pipelines
- name: profiles
- name: analyze
- name: sessions
- name: jobs
- name: observations
- name: media
- name: captures
- name: artifacts
- name: zones
- name: rules
- name: monitors
- name: settings
- name: backup
- name: operations
components:
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
    Timestamp:
      type: string
      format: date-time
    OpalError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        transaction_id:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        causation_id:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      - transaction_id
    PageInfo:
      type: object
      properties:
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      additionalProperties: false
      required:
      - next_cursor
      - has_more
    CapabilityDescriptor:
      type: object
      properties:
        task:
          type: string
        supported_inputs:
          type: array
          items:
            type: string
        output_types:
          type: array
          items:
            type: string
        controls_schema:
          type: object
          additionalProperties: true
        supports_streaming:
          type: boolean
        supports_tracking:
          type: boolean
        supports_annotation:
          type: boolean
      additionalProperties: false
      required:
      - task
      - supported_inputs
      - output_types
      - supports_streaming
    Engine:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        state:
          type: string
          enum:
          - ready
          - unavailable
          - error
          - disabled
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityDescriptor'
        device_types:
          type: array
          items:
            type: string
        options_schema:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - id
      - name
      - enabled
      - state
      - tasks
    EnginePatch:
      type: object
      properties:
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties: true
      additionalProperties: false
    ModelCreate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        engine_id:
          type: string
          minLength: 1
          maxLength: 128
        resource_ref:
          type: string
          description: Host-controlled filesystem reference or provider-side identifier; never returned with embedded
            credentials.
        tasks:
          type: array
          items:
            type: string
        options:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - id
      - engine_id
      - resource_ref
      - tasks
    Model:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        engine_id:
          type: string
          minLength: 1
          maxLength: 128
        display_name:
          type: string
        tasks:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
          - registered
          - ready
          - unavailable
          - error
        resource_label:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - engine_id
      - tasks
      - state
      - created_at
    ModelPatch:
      type: object
      properties:
        display_name:
          type: string
        options:
          type: object
          additionalProperties: true
      additionalProperties: false
    SourceCreate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum:
          - usb
          - rtsp
          - http_mjpeg
          - file
          - media
          - adapter
        name:
          type: string
        locator:
          type: string
          description: Never return embedded credentials; use secret_ref for authentication.
        secret_ref:
          type: string
        options:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - locator
    Source:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        state:
          type: string
          enum:
          - unknown
          - ready
          - disconnected
          - error
          - disabled
        redacted_locator:
          type: string
        last_frame_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        capabilities:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - enabled
      - state
    SourcePatch:
      type: object
      properties:
        name:
          type: string
        locator:
          type: string
        secret_ref:
          type: string
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties: true
      additionalProperties: false
    PipelineStage:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum:
          - preprocess
          - inference
          - tracker
          - filter
          - transform
          - annotate
        model_id:
          type: string
          minLength: 1
          maxLength: 128
        task:
          type: string
        inputs:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        options:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        portable:
          $ref: '#/components/schemas/ProcessingStageOptions'
          description: Typed portable filter, gate, overlay and frame limits. Unknown parameters rejected.
        phase:
          type: string
          enum:
          - inference_input
          - presentation
          description: 'For filter/transform stages: whether processing affects inference input or presentation
            only. Motion detectors run on ordered source frames and must not use presentation-only frames.'
      additionalProperties: false
      required:
      - id
      - kind
      description: Ordered DAG node; inputs reference prior stage IDs only. Inference stage requires model_id and
        task. Filters can run without inference. An inference stage may specify a motion gate referencing a previous
        motion filter. Presentation filters must not mutate source frames or results; inference filters transform
        only inference inputs. Unsupported stages fail pipeline validation.
    PipelineCreate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
          minItems: 1
        description:
          type: string
      additionalProperties: false
      required:
      - id
      - name
      - stages
      description: Pipelines may consist solely of supported image-processing filters; no model required for such
        pipelines. Ordered stages and dependencies are validated before admission.
    Pipeline:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
        description:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - name
      - stages
      - created_at
    PipelinePatch:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
      additionalProperties: false
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        resolved_capabilities:
          type: array
          items:
            type: string
        estimated_resources:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - valid
      - issues
    ValidationIssue:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
        severity:
          type: string
          enum:
          - error
          - warning
      additionalProperties: false
      required:
      - code
      - message
      - severity
    ProfileCreate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
        pipeline_id:
          type: string
          minLength: 1
          maxLength: 128
        inference:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
      additionalProperties: false
      required:
      - id
      - name
      - pipeline_id
    Profile:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
        pipeline_id:
          type: string
          minLength: 1
          maxLength: 128
        inference:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
        active:
          type: boolean
      additionalProperties: false
      required:
      - id
      - name
      - pipeline_id
      - active
    ProfilePatch:
      type: object
      properties:
        name:
          type: string
        pipeline_id:
          type: string
          minLength: 1
          maxLength: 128
        inference:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
      additionalProperties: false
    InferenceOptions:
      type: object
      properties:
        target_fps:
          type: number
          minimum: 0.1
        max_frames:
          type: integer
          minimum: 1
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
        classes:
          type: array
          items:
            type: string
        roi:
          $ref: '#/components/schemas/NormalizedPolygon'
        engine_options:
          type: object
          additionalProperties: true
        video:
          $ref: '#/components/schemas/VideoProcessingOptions'
        annotations:
          $ref: '#/components/schemas/AnnotationOptions'
      additionalProperties: false
    RetentionOptions:
      type: object
      properties:
        persist_results:
          type: boolean
        save_raw_frames:
          type: boolean
        save_annotated_frames:
          type: boolean
        ttl_seconds:
          type: integer
          minimum: 0
      additionalProperties: false
      description: No video/image retention by default; applies only when explicitly opted in.
    Point:
      type: object
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
      required:
      - x
      - y
    NormalizedPolygon:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
          minItems: 3
      additionalProperties: false
      required:
      - points
    NormalizedBox:
      type: object
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0
          maximum: 1
        height:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
      required:
      - x
      - y
      - width
      - height
    ImageMetadata:
      type: object
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        orientation_applied:
          type: boolean
        mime_type:
          type: string
      additionalProperties: false
      required:
      - width
      - height
    ObservationItem:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
          - detection
          - classification
          - ocr
          - track
          - pose
          - instance_mask
          - semantic_mask
          - caption
          - answer
          - embedding
          - anomaly
          - depth
          - custom
        label:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        box:
          $ref: '#/components/schemas/NormalizedBox'
        polygon:
          $ref: '#/components/schemas/NormalizedPolygon'
        track_id:
          type: string
        track_epoch:
          type: string
        text:
          type: string
        attributes:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - id
      - type
      description: 'Task-specific result: payload schema is declared in engine capabilities; unknown item types
        are safely ignored by generic clients. No person identity implied by track ID.'
    Observation:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        created_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        source_id:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        session_id:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        job_id:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        pipeline_id:
          type: string
          minLength: 1
          maxLength: 128
        pipeline_revision:
          type: string
        stage_id:
          type: string
          minLength: 1
          maxLength: 128
        engine_id:
          type: string
          minLength: 1
          maxLength: 128
        model_id:
          type: string
          minLength: 1
          maxLength: 128
        task:
          type: string
        frame_index:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        media_time_ms:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        image:
          $ref: '#/components/schemas/ImageMetadata'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObservationItem'
        warnings:
          type: array
          items:
            type: string
        session_context_id:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        transaction_id:
          type: string
          minLength: 1
          maxLength: 128
        request_id:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
      required:
      - id
      - created_at
      - observed_at
      - pipeline_id
      - stage_id
      - engine_id
      - model_id
      - task
      - image
      - items
      - transaction_id
      - request_id
      description: Immutable atomic output from a processing stage. Multiple observations can arise from the same
        frame. Empty items means processed with no matching observations.
    ObservationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
    SourceInput:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        media_id:
          type: string
          minLength: 1
          maxLength: 128
        capture_id:
          type: string
          minLength: 1
          maxLength: 128
        frame_at_ms:
          type: integer
          minimum: 0
      additionalProperties: false
      description: Exactly one of source_id, media_id, capture_id is permitted; source_id may imply a current-frame
        read.
      oneOf:
      - required:
        - source_id
      - required:
        - media_id
      - required:
        - capture_id
    AnalyzeRequest:
      type: object
      properties:
        pipeline_id:
          type: string
          minLength: 1
          maxLength: 128
        profile_id:
          type: string
          minLength: 1
          maxLength: 128
        source:
          $ref: '#/components/schemas/SourceInput'
          additionalProperties: false
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
      additionalProperties: false
      required:
      - source
      description: Exactly one pipeline_id or profile_id, unless an active profile is configured. Synchronous single
        frame. Upload multipart images through /analyze/image.
    AnalyzeResponse:
      type: object
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        image:
          $ref: '#/components/schemas/ImageMetadata'
        processing_ms:
          type: number
          minimum: 0
      additionalProperties: false
      required:
      - observations
      - image
      - processing_ms
    SessionCreate:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        pipeline_id:
          type: string
          minLength: 1
          maxLength: 128
        profile_id:
          type: string
          minLength: 1
          maxLength: 128
        options:
          $ref: '#/components/schemas/InferenceOptions'
        retention:
          $ref: '#/components/schemas/RetentionOptions'
        auto_start:
          type: boolean
      additionalProperties: false
      required:
      - source_id
      description: Exactly one pipeline_id or profile_id unless active profile exists. Resolves configuration at
        admission and snapshots it for session lifetime.
    Session:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum:
          - queued
          - starting
          - running
          - stopping
          - stopped
          - completed
          - failed
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        pipeline_id:
          type: string
          minLength: 1
          maxLength: 128
        created_at:
          type: string
          format: date-time
        started_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        ended_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        processed_frames:
          type: integer
          minimum: 0
        dropped_frames:
          type: integer
          minimum: 0
        last_observation_at:
          oneOf:
          - type: string
            format: date-time
