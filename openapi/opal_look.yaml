      tags:
      - settings
      operationId: get_look_setting
      summary: Get one effective setting
      description: 'Address one editable scalar leaf declared by ServiceSettings. Native JSON values are used, never
        stringified integers/booleans. GET returns {key,value}; PUT body is {value:...}. Unknown paths return 404;
        invalid types, read-only keys, object/array paths and malformed paths return 422. Arrays such as event_topics_allowlist
        use bulk PATCH. PUT/DELETE require the complete configuration''s current strong If-Match: missing 428, stale
        412. Validate precondition and resulting complete settings before mutation; failure leaves overrides/effective
        settings/revision unchanged. DELETE clears the override, restores its documented default and returns 204,
        including repeated deletion of an already-defaulted known key. If no valid default exists or reset violates
        complete configuration invariants, return 409. GET returns effective defaults. Secrets are never exposed.
        Unknown keys cannot create extension fields implicitly.'
      responses:
        '200':
          description: Effective setting and full configuration ETag
