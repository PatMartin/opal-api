      description: GET opens an ephemeral MJPEG viewer connection. In absence of pipeline_id, streams decoded source
        frames only. When pipeline_id is provided, evaluates the configured pipeline for this connection, subject
        to bounded shared resources. Closing connection releases viewer-specific processing; does not stop independent
        sessions/monitors. Does not persist observations, captures, or recordings. Overlay and filters are chosen
        at request start; change URL to change settings. The server may share decoded frames and inference work
        but must isolate presentation settings. Stream termination after headers is by clean close; clients reconnect
        using their own policy. Backpressure drops frames instead of unlimited buffering. Unauthorized/unsupported
        network access forbidden. No claim of synchronized SSE overlays.
      parameters:
      - $ref: ./shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter
      - $ref: ./shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter
