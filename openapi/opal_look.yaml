components:
  securitySchemes:
    BearerAuth:
      $ref: './shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth'
  parameters:
    ModelId:
      name: model_id
      in: path
      required: true
      description: Model identifier.
      schema:
        type: string
        minLength: 1
    StreamId:
      name: stream_id
      in: path
      required: true
      description: Ephemeral stream identifier.
      schema:
        type: string
        minLength: 1
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Engine-local compute device identifier.
      schema:
        type: string
        minLength: 1
  schemas:
    EngineDiscovery:
      type: object
      required:
      - engines
      properties:
        engines:
          type: array
          items:
            $ref: './shared/opal_kernel.yaml#/components/schemas/OpalEngine'
        errors:
          type: array
          items:
            type: string
      description: 'Result of an adapter scan. An empty engines array is healthy
        and fully supported for video-only operation.'
    Model:
      type: object
      required:
      - model_id
      - engine_id
      - tasks
      - loaded
      properties:
        model_id:
          type: string
        engine_id:
          type: string
        tasks:
          type: array
          items:
            type: string
        loaded:
          type: boolean
        available:
          type: boolean
        weights_sha256:
          type: string
        metadata:
          type: object
          additionalProperties: true
    Hardware:
      type: object
      required:
      - device_id
      - type
      - available
      properties:
        device_id:
          type: string
        type:
          type: string
          enum:
          - cpu
          - gpu
          - accelerator
        available:
          type: boolean
        memory_mb:
          type: integer
          minimum: 0
        name:
          type: string
    ImageInfo:
      type: object
      required:
      - width
      - height
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Detection:
      type: object
      required:
      - class_id
      - class_name
      - confidence
      - box
      properties:
        class_id:
          type: integer
          minimum: 0
        class_name:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        box:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: xyxy pixel coordinates in original orientation-corrected frame (x1,y1,x2,y2).
    PredictRequest:
      type: object
      required:
      - engine_id
      - model_id
      - source
      properties:
        engine_id:
          type: string
          minLength: 1
          description: 'Engine adapter ID, e.g. yolo, rfdetr, rtdetr, dfine, or
            any engine returned by discovery.'
        model_id:
          type: string
        source:
          type: string
          description: 'Local image path (if accessible) or permitted URI. REST
            clients can use an accessible URI; image upload can be added later.'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.25
        device_id:
          type: string
          description: Engine-local execution device. Not a globally federated OPAL Device.
        engine_options:
          type: object
          additionalProperties: true
          description: Validate against selected engine options_schema; reject unknown options.
        include_native:
          type: boolean
          default: false
      description: 'Inference-only. The engine is required for predict;
        engine-free behavior applies to stream sessions.'
    PredictResult:
      type: object
      required:
      - engine_id
      - model_id
      - image
      - detections
      properties:
        engine_id:
          type: string
        model_id:
          type: string
        image:
          $ref: '#/components/schemas/ImageInfo'
        detections:
          type: array
          items:
            $ref: '#/components/schemas/Detection'
        native:
          type: object
          additionalProperties: true
          description: Optional sanitized native results when requested; never expose secrets.
        execution_id:
          type: string
    StreamStartRequest:
      type: object
      additionalProperties: false
      required:
      - source
      properties:
        source:
          type: string
          pattern: ^rtsps?://
          minLength: 8
          description: 'RTSP or RTSPS URI. Authenticate and authorize access;
            validate target network and redirects; never echo credentials.'
        engine_id:
          type:
          - string
          - 'null'
          default: null
          description: Absent or null means plain video mode. Never implicitly select an AI engine.
        model_id:
          type:
          - string
          - 'null'
          default: null
          description: Required with non-null engine_id; forbidden in video-only mode.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.25
        device_id:
          type: string
          description: Engine-local execution device, allowed only in inference mode. Not a globally federated OPAL Device.
        engine_options:
          type: object
          additionalProperties: true
          description: Allowed only in inference mode; validate against the selected engine's advertised option schema.
        annotate:
          type: boolean
          default: false
          description: 'Request bounding-box overlays; only valid with engine_id
            and annotation support; rejected with 422 otherwise.'
        buffer_policy:
          type: string
          enum:
          - drop-oldest
          - drop-newest
          - block
          default: drop-oldest
        buffer_size:
          type: integer
          minimum: 1
          maximum: 1024
          default: 5
      description: 'One ephemeral RTSP stream. Validation: engine_id absent/null
        and model_id absent/null => video; engine_id present => model_id
        required; model_id, device_id, or engine_options without engine_id, or
        annotate in video-only mode => 422. No engine auto-selection.'
      allOf:
      - if:
          required:
          - engine_id
          properties:
            engine_id:
              type: string
        then:
          required:
          - model_id
          properties:
            model_id:
              type: string
              minLength: 1
      - if:
          anyOf:
          - not:
              required:
              - engine_id
              properties:
                engine_id: {}
          - required:
            - engine_id
            properties:
              engine_id:
                type: 'null'
        then:
          not:
            anyOf:
            - required:
              - model_id
              properties:
                model_id:
                  type: string
            - required:
              - device_id
              properties:
                device_id: {}
            - required:
              - engine_options
              properties:
                engine_options: {}
            - required:
              - annotate
              properties:
                annotate:
                  const: true
    StreamStatus:
      type: object
      additionalProperties: false
      required:
      - stream_id
      - mode
      - engine_id
      - model_id
      - status
      - started_at
      - source_redacted
      - capabilities
      - supports_video
      properties:
        stream_id:
          type: string
          minLength: 1
        mode:
          type: string
          enum:
          - video
          - inference
        engine_id:
          type:
          - string
          - 'null'
        model_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - starting
          - running
          - stopping
          - stopped
          - failed
        started_at:
          type: string
          format: date-time
        last_frame_at:
          type:
          - string
          - 'null'
          format: date-time
        frames_received:
          type: integer
          minimum: 0
        frames_processed:
          type: integer
          minimum: 0
        error:
          anyOf:
          - $ref: './shared/opal_kernel.yaml#/components/schemas/OpalError'
          - type: 'null'
        supports_video:
          type: boolean
          const: true
          description: Video viewing via MJPEG is mandatory, including video-only streams.
        events_url:
          type: string
        video_url:
          type: string
          description: Required MJPEG viewing URL.
        source_redacted:
          type: string
          description: Never includes userinfo credentials, tokens, or sensitive query values.
        capabilities:
          type: array
          items:
            type: string
          description: 'Video-only: video, snapshot, metrics, stream_events.
            Inference adds detections, optionally annotations.'
    StreamMetrics:
      type: object
      additionalProperties: false
      required:
      - stream_id
      - mode
      - uptime_seconds
      - frames_received
      - frames_dropped
      - input_fps
      - output_fps
      - queue_depth
      properties:
        stream_id:
          type: string
        mode:
          type: string
          enum:
          - video
          - inference
        uptime_seconds:
          type: number
          minimum: 0
        frames_received:
          type: integer
          minimum: 0
        frames_processed:
          type: integer
          minimum: 0
        frames_dropped:
          type: integer
          minimum: 0
        input_fps:
          type: number
          minimum: 0
        output_fps:
          type: number
          minimum: 0
        queue_depth:
          type: integer
          minimum: 0
        queue_capacity:
          type: integer
          minimum: 1
        decode_latency_ms:
          type:
          - number
          - 'null'
          minimum: 0
        inference_latency_ms:
          type:
          - number
          - 'null'
          minimum: 0
          description: Null for video-only sessions.
