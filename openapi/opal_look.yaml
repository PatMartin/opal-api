  /api/v1/backup/import:
    post:
      tags:
      - backup
      summary: Import configuration
      description: Validate and atomically replace all logical configuration; this is replacement, not merge. 
        Reject with 409 while any session is nonterminal or one-shot analysis is in flight. Require unique 
        identifiers, valid references, installed engine IDs, and exactly one active profile if profiles exist.
        Missing host assets/credential/media references produce warnings and unavailable registrations, not 
        implicit downloads. Structural incompatibility returns 422. Failed import leaves existing 
        configuration unchanged. Does not modify result/media/snapshot history or secrets; disabling unused 
        installed engines is allowed. Persistent monitor definitions are restored atomically, but runtime sessions, observations and recorded media are not restored.
      operationId: post_api_v1_backup_import
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigImportResult'
          headers:
            ETag:
              description: Strong ETag of the complete logical configuration after the operation.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
