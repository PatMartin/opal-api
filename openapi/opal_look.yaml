      responses:
        '200':
          description: Successful response.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            X-Opal-Captured-At:
              schema:
                type: string
                format: date-time
            X-Opal-Source-Id:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: position_ms
        in: query
