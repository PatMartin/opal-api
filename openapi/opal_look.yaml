      - name: show_boxes
        in: query
        schema:
          type: boolean
          default: true
      - name: show_confidence
        in: query
        schema:
          type: boolean
          default: true
      - name: target_fps
        in: query
        schema:
          type: number
          minimum: 0.1
      - name: width
        in: query
        schema:
          type: integer
          minimum: 1
      - name: height
        in: query
        schema:
          type: integer
          minimum: 1
      - name: quality
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: presentation_filter
