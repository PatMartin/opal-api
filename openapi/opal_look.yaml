x-opal-context-standard:
  version: '1.4'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  pagination:
    history: none
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  streaming: 'HTTP context headers are sent before stream bytes. Stream SSE
    supports bounded replay via Last-Event-ID; stale replay returns 409. MJPEG
    video and snapshots are live-only with no replay guarantee. After headers
    are sent, failures appear as transport termination or a terminal SSE event.'
