          description: Successful response.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
