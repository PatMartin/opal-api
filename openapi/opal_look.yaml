    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/backup/create:
    post:
      tags:
      - backup
      summary: Create configuration backup
      description: Persist a logical ConfigExport snapshot as server-managed application/json; engine binaries,
        model assets, credentials, media, snapshots and history are excluded.
      operationId: post_api_v1_backup_create
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCreateResponse'
          headers:
            Location:
              description: URI of the created backup (/api/v1/backup/download/{filename}).
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '500':
          $ref: '#/components/responses/OperationFailed'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/backup/download/{filename}:
    get:
      tags:
      - backup
      summary: Download configuration backup
      description: Return saved ConfigExport JSON. Filename is opaque, without path separators; never an arbitrary
        host path.
      operationId: get_api_v1_backup_download_filename
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigExport'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: filename
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/backup/restore/{filename}:
    post:
      tags:
      - backup
      summary: Restore configuration backup
      description: Validate and atomically replace current configuration from backup under the same semantics as
        backup/import. Reject during active sessions/analysis. Does not restore media/history, secrets or runtime
        state.
      operationId: post_api_v1_backup_restore_filename
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
          headers:
            ETag:
              description: Opaque strong ETag for the current logical configuration revision.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '428':
          $ref: '#/components/responses/OpalError428'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '500':
          $ref: '#/components/responses/OperationFailed'
        '412':
          $ref: '#/components/responses/OpalError412'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Required strong ETag of the complete logical configuration, or '*' to bypass the check explicitly.
          Checked atomically against the current global revision; missing returns 428, stale or
          nonmatching returns 412, malformed returns 422. Obtain the revision from GET
          /api/v1/settings/, the relevant collection GET, or the resource GET.
    parameters:
    - name: filename
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/backup/{filename}:
    delete:
      tags:
      - backup
      summary: Delete configuration backup
      description: Delete server-managed backup only.
      operationId: delete_api_v1_backup_filename
      responses:
        '204':
          description: Deleted/reset; no response body.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: filename
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Check liveness
      description: Check HTTP process responsiveness only; never probe engines, cameras, storage or event transport.
      operationId: get_api_v1_health_live
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '503':
          description: Probe unavailable; status=unavailable and ready=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Check readiness
      description: Read-only vision readiness using HealthRead.ready. Return 200 when ready and 503 when unavailable;
        never start, repair or reconfigure resources. Optional event publication failure alone does not fail readiness.
      operationId: get_api_v1_health_ready
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '503':
          description: Probe unavailable; status=unavailable and ready=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/settings/{key}:
    parameters:
    - name: key
      in: path
      required: true
      description: Single leaf setting key from ServiceSettings (e.g., events_enabled).
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_-]*(\.[A-Za-z_][A-Za-z0-9_-]*)*$
        minLength: 1
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
    get:
      tags:
      - settings
      operationId: get_look_setting
      summary: Get one setting
      description: 'Access one editable setting using a key path, such as `events_enabled` or

        `event_queue_capacity`. A key path addresses one leaf setting, never an entire

        object or array; dots in individual setting names are reserved as separators.

        Keys must exist in the service''s settings schema or its explicitly documented

        extension namespace. Unknown keys return 404. This operation cannot access

        secrets; secret references may be configured but raw credentials are never read.

        The ETag represents the complete logical configuration, not a per-key revision.

        '
      responses:
        '200':
          description: Effective setting and full configuration ETag
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong ETag for the complete logical configuration after this operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalSingleSetting'
        '404': &id001
          description: Unknown setting path.
          $ref: '#/components/responses/NotFound'
        '422': &id002
          description: Invalid setting path, value, or conditional header.
          $ref: '#/components/responses/OpalError422'
    put:
      tags:
      - settings
      operationId: put_look_setting
      summary: Set or update one setting
      description: 'Access one editable setting using a key path, such as `events_enabled` or

        `event_queue_capacity`. A key path addresses one leaf setting, never an entire

        object or array; dots in individual setting names are reserved as separators.

        Keys must exist in the service''s settings schema or its explicitly documented

        extension namespace. Unknown keys return 404. This operation cannot access

        secrets; secret references may be configured but raw credentials are never read.

        The ETag represents the complete logical configuration, not a per-key revision.

        '
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Required strong ETag or '*' from GET /api/v1/settings/ or GET this setting; missing 428, stale 412, malformed 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpalSingleSettingPut'
      responses:
        '200':
          description: Effective setting and full configuration ETag
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong ETag for the complete logical configuration after this operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalSingleSetting'
        '404': *id001
        '409': &id003
          description: Setting cannot be reset or required configuration would be invalid.
          $ref: '#/components/responses/Conflict'
        '412': &id004
          description: Configuration revision does not match If-Match.
          $ref: '#/components/responses/OpalError412'
        '422': *id002
        '428': &id005
          description: If-Match required.
          $ref: '#/components/responses/OpalError428'
    delete:
      tags:
      - settings
      operationId: delete_look_setting
      summary: Remove one setting override
      description: 'Access one editable setting using a key path, such as `events_enabled` or

        `event_queue_capacity`. A key path addresses one leaf setting, never an entire

        object or array; dots in individual setting names are reserved as separators.

        Keys must exist in the service''s settings schema or its explicitly documented

        extension namespace. Unknown keys return 404. This operation cannot access

        secrets; secret references may be configured but raw credentials are never read.

        The ETag represents the complete logical configuration, not a per-key revision.

        Delete clears an explicit override and restores the documented default. If no valid default is available,
        return 409.'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Required strong ETag or '*' from GET /api/v1/settings/ or GET this setting; missing 428, stale 412, malformed 422.
      responses:
        '204':
          description: Override removed; default applies.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong ETag for the complete logical configuration after this operation.
              schema:
                type: string
        '404': *id001
        '409': *id003
        '412': *id004
        '422': *id002
        '428': *id005
components:
  responses:
    NotFound:
      description: Unknown or deleted resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Conflict:
      description: Resource is in use, duplicate ID, or incompatible current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    Gone:
      description: Known expired media or cursor/replay window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    PayloadTooLarge:
      description: Upload/body/decoded-image size exceeds configured limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    UnsupportedMediaType:
      description: Media/container/codec is unsupported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    CapacityExceeded:
      description: Session admission or resource capacity exceeded. Retry-After seconds may be supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    OperationFailed:
      description: Unexpected operation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    ServiceUnavailable:
      description: Engine, source, storage, or required service component unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    AnalysisTimeout:
      description: Single-image analysis exceeded configured timeout; no successful result was committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    OpalError412:
      description: OPAL standard error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    OpalError428:
      description: OPAL standard error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
    OpalError422:
      description: OPAL standard error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: '#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: '#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: '#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: '#/components/headers/OpalCausationIdHeader'
  schemas:
    Identifier:
      type: string
      description: Stable OPAL identifier; not an engine-native label or a filesystem path.
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    Task:
      type: string
      enum:
      - detection
      - classification
      - segmentation
      - pose
      - ocr
      description: One selected inference task per request/session. Tracking is an optional enhancement of detection,
        not a separate inference task. A model/engine need only implement its advertised tasks.
    EngineOptions:
      type: object
      additionalProperties: true
      description: Opaque adapter-specific options. Unknown or invalid options MUST be rejected with 422; options
        cannot override portable controls, task, source, or model. Not for secret values. Patch replaces this entire
        object; request options shallow-merge over profile options.
    ValidationResult:
      type: object
      additionalProperties: false
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        details:
          type: object
          additionalProperties: true
          description: Non-secret adapter diagnostics.
      required:
      - valid
      - errors
      - warnings
      - details
      description: A completed validation returns HTTP 200 even when valid=false. Validation may probe runtime,
        remote connectivity, and source access, but must not start a persistent session.
    OperationResult:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Additional operation information.
      required:
      - success
      - message
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          uniqueItems: true
          minItems: 1
        tracking:
          type: boolean
        source_types:
          type: array
          items:
            type: string
            enum:
            - camera
            - rtsp
            - http
            - host_video
            - media
          uniqueItems: true
        max_concurrent_sessions:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      required:
      - tasks
      - tracking
      - source_types
      description: Capabilities describe what the adapter supports, not a promise that every model or host can provide
        every task. Source types describe service/adapter integration. Null concurrency means no advertised fixed
        adapter limit; service admission limits still apply.
    EngineRead:
      type: object
      additionalProperties: false
      properties:
        engine_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        execution:
          type: string
          enum:
          - local
          - remote
        enabled:
          type: boolean
        available:
          type: boolean
        message:
          anyOf:
          - type: string
          - type: 'null'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        config:
          type: object
          additionalProperties: true
          description: Non-secret engine configuration. Remote endpoint and host resource options may appear here.
            Credentials use out-of-band credential_ref references.
        metadata:
          type: object
          additionalProperties: true
          description: Read-only runtime/version information; clients must not require engine-specific keys.
      required:
      - engine_id
      - name
      - execution
      - enabled
      - available
      - capabilities
      - config
      - metadata
    EngineUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: Replaces the complete non-secret config object. Secrets use references provisioned outside
            this API.
      description: Omitted fields remain unchanged. Disabling or changing an engine referenced by a nonterminal
        session returns 409. Engines are installed by the implementation; no engine create/delete API.
    ClassLabel:
      type: object
      additionalProperties: false
      properties:
        class_id:
          type: integer
          minimum: 0
        label:
          type: string
          minLength: 1
      required:
      - class_id
      - label
      description: Class IDs and labels are scoped to the model; no universal class taxonomy is assumed.
    KeypointDefinition:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        name:
          type: string
      required:
      - index
      - name
    ModelCreate:
      type: object
      additionalProperties: false
      properties:
        model_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
        engine_id:
          $ref: '#/components/schemas/Identifier'
        resource:
          type: object
          additionalProperties: true
          description: Adapter-specific locator to resources already on the host, or an existing remote model identifier.
            Never model weights, uploads, training instructions, or an automatic download request.
        enabled:
          type: boolean
          default: true
      required:
      - model_id
      - name
      - engine_id
      - resource
      example:
        model_id: yolo-detect
        name: Host YOLO detector
        engine_id: ultralytics
        resource:
          path: /opt/opal/models/detector.pt
        enabled: true
    ModelUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        engine_id:
          $ref: '#/components/schemas/Identifier'
        resource:
          type: object
          additionalProperties: true
          description: Adapter-specific locator to resources already on the host, or an existing remote model identifier.
            Never model weights, uploads, training instructions, or an automatic download request.
        enabled:
          type: boolean
          default: true
      description: Omitted fields remain unchanged; resource replaces the entire locator. Changing a model referenced
        by a nonterminal session returns 409.
    ModelRead:
      type: object
      additionalProperties: false
      properties:
        model_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
        engine_id:
          $ref: '#/components/schemas/Identifier'
        resource:
          type: object
          additionalProperties: true
          description: Adapter-specific locator to resources already on the host, or an existing remote model identifier.
            Never model weights, uploads, training instructions, or an automatic download request.
        enabled:
          type: boolean
          default: true
        available:
          type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          uniqueItems: true
          minItems: 1
        tracking:
          type: boolean
        classes:
          type: array
          items:
            $ref: '#/components/schemas/ClassLabel'
        keypoints:
          type: array
          items:
            $ref: '#/components/schemas/KeypointDefinition'
        skeleton:
          type: array
          items:
            type: array
            items:
              type: integer
              minimum: 0
            minItems: 2
            maxItems: 2
        metadata:
          type: object
          additionalProperties: true
          description: 'Adapter-reported metadata; for segmentation includes supported kinds: instance and/or semantic;
            for OCR may include supported languages.'
      required:
      - model_id
      - name
      - engine_id
      - resource
      - enabled
      - available
      - tasks
      - tracking
      - classes
      - keypoints
      - skeleton
      - metadata
      description: Tasks, classes, keypoints and skeleton are adapter-reported read-only metadata. OCR models may
        have no class labels. Keypoint coordinates use the index/name definitions; skeleton entries connect two
        indices. A registration does not install, modify, or delete model assets.
    CameraDevice:
      type: object
      additionalProperties: false
      properties:
        device_id:
          type: string
        name:
          type: string
        available:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
          description: Platform/adapter metadata such as camera type and capture formats.
      required:
      - device_id
      - name
      - available
      - metadata
      description: device_id is opaque and scoped to this host. Discovery does not guarantee access and does not
        require cameras to be registered as sources.
    SourceCreate:
      type: object
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - camera
          - rtsp
          - http
          - host_video
          - media
        locator:
          type: string
          description: 'camera: discovered device_id; rtsp/http: URL without inline credentials; host_video: existing
            host path; media: media_id for an uploaded video. A still image is analyzed directly via analyze. The
            source adapter handles decoding; HTTP covers supported progressive video and MJPEG feeds.'
          minLength: 1
        credential_ref:
          anyOf:
          - type: string
            description: Reference to credentials supplied outside the API; never a password/token.
          - type: 'null'
        enabled:
          type: boolean
          default: true
        source_options:
          type: object
          additionalProperties: true
          description: Opaque non-secret capture/decoder options. Must reject unknown options; credentials use credential_ref.
      required:
      - source_id
      - name
      - type
      - locator
      example:
        source_id: driveway
        name: Driveway camera
        type: rtsp
        locator: rtsp://192.168.1.50:554/stream1
        credential_ref: driveway-camera
        enabled: true
        source_options: {}
    SourceUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - camera
          - rtsp
          - http
          - host_video
          - media
        locator:
          type: string
          description: 'camera: discovered device_id; rtsp/http: URL without inline credentials; host_video: existing
            host path; media: media_id for an uploaded video. A still image is analyzed directly via analyze. The
            source adapter handles decoding; HTTP covers supported progressive video and MJPEG feeds.'
          minLength: 1
        credential_ref:
          anyOf:
          - type: string
            description: Reference to credentials supplied outside the API; never a password/token.
          - type: 'null'
        enabled:
          type: boolean
          default: true
        source_options:
          type: object
          additionalProperties: true
          description: Opaque non-secret capture/decoder options. Must reject unknown options; credentials use credential_ref.
      description: Omitted fields remain unchanged. Changing a source referenced by a nonterminal session returns
        409; locator/options replacement is atomic.
    SourceRead:
      type: object
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - camera
          - rtsp
          - http
          - host_video
          - media
        locator:
          type: string
          description: 'camera: discovered device_id; rtsp/http: URL without inline credentials; host_video: existing
            host path; media: media_id for an uploaded video. A still image is analyzed directly via analyze. The
            source adapter handles decoding; HTTP covers supported progressive video and MJPEG feeds.'
          minLength: 1
        credential_ref:
          anyOf:
          - type: string
            description: Reference to credentials supplied outside the API; never a password/token.
          - type: 'null'
        enabled:
          type: boolean
          default: true
        source_options:
          type: object
          additionalProperties: true
          description: Opaque non-secret capture/decoder options. Must reject unknown options; credentials use credential_ref.
        available:
          type: boolean
        live:
          type: boolean
          description: True for real-time capture/feeds; false for finite files. Reported by the service, not supplied
            by the client.
        width:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        height:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        fps:
          anyOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        message:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - source_id
      - name
      - type
      - locator
      - enabled
      - available
      - live
      description: 'Registration is configuration only: source resources are opened when probed/analyzed or when
        a session runs. Multiple sessions share capture where possible; return 409 if exclusive-device constraints
        prevent sharing. Host filesystem and remote URL accessibility remain implementation-enforced.'
    Point:
      type: object
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
      required:
      - x
      - y
      description: Normalized original-frame coordinate. Origin top-left; x increases right, y down.
    Region:
      type: object
      additionalProperties: false
      properties:
        region_id:
          $ref: '#/components/schemas/Identifier'
        polygon:
          type: array
          items:
            $ref: '#/components/schemas/Point'
          minItems: 3
      required:
      - region_id
      - polygon
      description: Simple non-self-intersecting polygon in original-frame normalized coordinates. Do not repeat
        the first vertex. Multiple regions form a union. Region filtering never changes returned frame coordinates.
    AnalysisSettings:
      type: object
      additionalProperties: false
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.25
          description: Minimum score for returned outputs. This is an engine/model score, not a calibrated probability.
            Adapters unable to supply required scores cannot advertise that task.
        class_labels:
          type: array
          items:
            type: string
          uniqueItems: true
          default: []
          description: Empty means all model classes. Labels must exactly match the model class list; duplicate
            labels are invalid. Nonempty filters on OCR are invalid.
        image_size:
          anyOf:
          - type: integer
            minimum: 32
            description: Target inference size, interpreted as longest edge with aspect ratio preserved. Adapter
              may pad internally. All returned coordinates map back to the original oriented frame. Unsupported
              explicit size is rejected.
          - type: 'null'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
          default: []
        max_fps:
          type: number
          exclusiveMinimum: 0
          default: 5
          description: 'Maximum analysis rate. Live: wall-clock ceiling, skip old frames. Finite files, sampled
            mode: media-time sampling ceiling. every_frame mode: optional wall-clock throttle; no frame skipping.'
        file_mode:
          type: string
          enum:
          - sampled
          - every_frame
          default: sampled
        tracking:
          type: boolean
          default: false
          description: Allowed only for detection sessions when engine and model advertise tracking. Invalid for
            single-image/frame requests. IDs are scoped to session and tracking_epoch.
        segmentation_kind:
          type: string
          enum:
          - instance
          - semantic
          default: instance
          description: Relevant only for segmentation. Unsupported requested kind returns 422; non-segmentation
            settings must omit this field.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      description: 'Portable controls. Profiles resolve unspecified controls to documented defaults. A request overrides
        only supplied fields, including complete array replacement and explicit null image_size. Regions: detection/instance
        segmentation/pose retain objects whose box center is in the union; OCR retains text whose polygon centroid
        is in the union; semantic segmentation marks outside pixels null; classification analyzes the union ROI
        bounding rectangle with pixels outside the union masked, and returns frame-level scores. Empty regions means
        the full image. Boxes remain in original-frame coordinates; instance masks outside regions are zero. Controls
        irrelevant to a task must be omitted except documented universal defaults.'
    ProfileCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        model_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/AnalysisSettings'
      required:
      - name
      - model_id
      - task
      description: Reusable analysis preset; engine is determined by model. At most one profile is active. Creating
        the first profile activates it; deleting the active profile returns 409 until another is activated. A profile
        must reference a registered enabled model and compatible task; runtime unavailability may be reported as
        a validation warning.
      example:
        name: Driveway detection
        model_id: yolo-detect
        task: detection
        settings:
          confidence: 0.35
          class_labels:
          - person
          - car
          max_fps: 5
          tracking: true
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        model_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/AnalysisSettings'
      description: Omitted fields remain unchanged. settings replaces the profile settings object, then defaults
        apply. Existing sessions use immutable snapshots and are unaffected by profile edits.
    ProfileRead:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        model_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/AnalysisSettings'
        profile_id:
          type: integer
          minimum: 1
        active:
          type: boolean
      required:
      - profile_id
      - name
      - model_id
      - task
      - settings
      - active
      description: settings contains resolved applicable defaults. For non-segmentation tasks omit segmentation_kind.
        Profiles are independent of sources.
    Selection:
      type: object
      additionalProperties: false
      properties:
        profile_id:
          type: integer
          minimum: 1
        model_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/AnalysisSettings'
      description: Resolve explicit profile, otherwise active profile, then apply explicit model_id/task/settings
        overrides. Without any profile, model_id and task are required. Selected model determines engine_id; incompatible
        requests are 422. Session creation snapshots resolved configuration; later profile activation/editing has
        no effect. Arrays replace, engine_options shallow-merge, other explicit settings replace corresponding profile
        fields.
    FrameInput:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          kind:
            const: media
            type: string
          media_id:
            $ref: '#/components/schemas/Identifier'
        required:
        - kind
        - media_id
        description: Uploaded still image. For an uploaded video, use a media-backed source with kind=source.
      - type: object
        additionalProperties: false
        properties:
          kind:
            const: source
            type: string
          source_id:
            $ref: '#/components/schemas/Identifier'
          position_ms:
            type: integer
            minimum: 0
        required:
        - kind
        - source_id
        description: Capture one frame from a registered source. position_ms applies only to finite video, defaults
          to 0, and selects the first decodable frame at/after this position; beyond EOF returns 422. Live sources
          capture the freshest frame, and position_ms must be omitted.
      discriminator:
        propertyName: kind
    AnalyzeRequest:
      type: object
      additionalProperties: false
      properties:
        profile_id:
          type: integer
          minimum: 1
        model_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/AnalysisSettings'
        input:
          $ref: '#/components/schemas/FrameInput'
        store_result:
          type: boolean
          default: true
      required:
      - input
      description: 'Synchronous single-image/frame analysis. No direct arbitrary URL/path input: register a source
        or upload media first. Tracking must be false. Stores metadata by default; never automatically retains image
        bytes. Unavailable sources/engines return 503. No active profile plus missing model/task returns 422.'
      example:
        input:
          kind: media
          media_id: image-1
        model_id: yolo-detect
        task: detection
        settings:
          tracking: false
        store_result: true
    ReconnectPolicy:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
        max_attempts:
          type: integer
          minimum: 0
          default: 10
          description: Number of retries following a live-source disconnect; zero means no retries. Attempts reset
            after the first successfully analyzed frame following reconnection.
        initial_delay_ms:
          type: integer
          minimum: 100
          default: 1000
        max_delay_ms:
          type: integer
          minimum: 100
          default: 30000
      description: Live sources only. Exponential backoff capped at max_delay_ms; max_delay_ms must be at least
        initial_delay_ms. Exhaustion transitions the session to failed. Finite files do not reconnect or loop.
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        profile_id:
          type: integer
          minimum: 1
        model_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/AnalysisSettings'
        source_id:
          $ref: '#/components/schemas/Identifier'
        store_results:
          type: boolean
          default: true
        start_position_ms:
          type: integer
          minimum: 0
          default: 0
        end_position_ms:
          type: integer
          minimum: 0
        reconnect:
          $ref: '#/components/schemas/ReconnectPolicy'
      required:
      - source_id
      description: Create and begin a background session. One model and one task per session; multiple sessions
        may share a source. Positions apply only to finite video; end must exceed start. end is exclusive. Explicit
        positions/reconnect on incompatible source types return 422. Live defaults prioritize fresh frames; finite
        files process according to file_mode. No pause/resume or mutation of a running session in v1; stop and create
        a new session to reconfigure.
      example:
        source_id: driveway
        profile_id: 1
        store_results: true
    SessionRead:
      type: object
      additionalProperties: false
      properties:
        session_id:
          $ref: '#/components/schemas/Identifier'
        source_id:
          $ref: '#/components/schemas/Identifier'
        profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        model_id:
          $ref: '#/components/schemas/Identifier'
        engine_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/AnalysisSettings'
        reconnect:
          anyOf:
          - $ref: '#/components/schemas/ReconnectPolicy'
          - type: 'null'
        store_results:
          type: boolean
        state:
          type: string
          enum:
          - starting
          - running
          - reconnecting
          - stopping
          - stopped
          - completed
          - failed
        created_at:
          type: string
          format: date-time
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        start_position_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        end_position_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        frames_analyzed:
          type: integer
          minimum: 0
        frames_dropped:
          type: integer
          minimum: 0
        tracking_epoch:
          type: integer
          minimum: 0
        last_result_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/OpalError'
          - type: 'null'
      required:
      - session_id
      - source_id
      - profile_id
      - model_id
      - engine_id
      - task
      - settings
      - reconnect
      - store_results
      - state
      - created_at
      - frames_analyzed
      - frames_dropped
      - tracking_epoch
      - last_result_id
      - error
      description: 'Immutable resolved configuration plus current state. Transitions: starting -> running or failed;
        running -> reconnecting/stopping/completed/failed; reconnecting -> running/stopping/failed; stopping ->
        stopped or failed. stopped/completed/failed are terminal and cannot restart. EOF/range end -> completed.
        Service restart marks interrupted nonterminal sessions failed with service_restarted; no automatic restart.
        tracking_epoch increments whenever continuity is lost, including reconnect. IDs must not be interpreted
        as identifying real people or persistent physical objects across epochs.'
    MediaRead:
      type: object
      additionalProperties: false
      properties:
        media_id:
          $ref: '#/components/schemas/Identifier'
        filename:
          type: string
          description: Sanitized display name; never used as a host path.
        kind:
          type: string
          enum:
          - image
          - video
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        width:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        height:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - media_id
      - filename
      - kind
      - content_type
      - size_bytes
      - created_at
      - expires_at
      description: Uploaded source bytes, decoded/validated before acceptance; expiration defaults to creation +
        24h. Registered sources do not extend retention. Active requests/sessions pin bytes until completion; new
        analysis after expiry returns 410 and available=false. Explicit delete while pinned returns 409. A source
        referencing deleted/expired media remains registered but unavailable. Completed metadata results remain
        queryable until their independent retention expires.
    BoundingBox:
      type: object
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1
      required:
      - x
      - y
      - width
      - height
      description: Normalized axis-aligned box on original oriented frame. x/y are top-left; x+width <=1 and y+height
        <=1. Coordinates never refer to resized/padded inference input.
    Detection:
      type: object
      additionalProperties: false
      properties:
        class_id:
          type: integer
          minimum: 0
        label:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        box:
          $ref: '#/components/schemas/BoundingBox'
        track_id:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - class_id
      - label
      - confidence
      - box
      - track_id
      description: track_id is null if tracking is disabled. If non-null, pair with result session_id and tracking_epoch.
        No face/individual identification.
    Classification:
      type: object
      additionalProperties: false
      properties:
        class_id:
          type: integer
          minimum: 0
        label:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required:
      - class_id
      - label
      - confidence
      description: Scores descending, ties by class_id. All classes above threshold/filter returned. Scores need
        not sum to 1 for multilabel models.
    Mask:
      type: object
      additionalProperties: false
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        encoding:
          type: string
          enum:
          - rle
        counts:
          type: array
          items:
            type: integer
            minimum: 0
          minItems: 1
      required:
      - width
      - height
      - encoding
      - counts
      description: 'Binary mask at original oriented frame dimensions. Uncompressed row-major RLE starting at top-left:
        alternating background/foreground run lengths, first run is background (may be 0); sum(counts)=width*height.
        No COCO column-major convention or compressed strings. Masks outside requested regions are zero.'
    Instance:
      type: object
      additionalProperties: false
      properties:
        class_id:
          type: integer
          minimum: 0
        label:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        box:
          $ref: '#/components/schemas/BoundingBox'
        mask:
          $ref: '#/components/schemas/Mask'
      required:
      - class_id
      - label
      - confidence
      - box
      - mask
    SemanticMap:
      type: object
      additionalProperties: false
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        encoding:
          type: string
          enum:
          - rle
        runs:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              class_id:
                anyOf:
                - type: integer
                  minimum: 0
                - type: 'null'
              count:
                type: integer
                minimum: 1
            required:
            - class_id
            - count
        classes:
          type: array
          items:
            $ref: '#/components/schemas/Classification'
      required:
      - width
      - height
      - encoding
      - runs
      - classes
      description: Original oriented-frame dimensions. Row-major class runs; sum(count)=width*height. Null class
        is excluded/unclassified pixel (including below threshold or outside ROI). classes reports present class
        labels and mean retained pixel confidence per class; scores are model-derived, not calibrated probabilities.
        Models without pixel confidence cannot advertise semantic segmentation support under this contract.
    Keypoint:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        x:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        y:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required:
      - index
      - x
      - y
      - confidence
      description: Original-frame normalized location. Missing/unlocalized keypoint has both x and y null and confidence
        0. Every keypoint uses the model keypoint definition index.
    Pose:
      type: object
      additionalProperties: false
      properties:
        class_id:
          type: integer
          minimum: 0
        label:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        box:
          $ref: '#/components/schemas/BoundingBox'
        keypoints:
          type: array
          items:
            $ref: '#/components/schemas/Keypoint'
      required:
      - class_id
      - label
      - confidence
      - box
      - keypoints
      description: One pose instance; class represents model instance class such as person. Return all model-defined
        keypoints ordered by index.
    TextRegion:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        polygon:
          type: array
          items:
            $ref: '#/components/schemas/Point'
          minItems: 3
        language:
          anyOf:
          - type: string
            description: BCP-47 language tag when reported by engine; otherwise null.
          - type: 'null'
      required:
      - text
      - confidence
      - polygon
      - language
      description: OCR polygon vertices in original-frame normalized coordinates; text regions returned in adapter
        reading order. No universal OCR word/line granularity; metadata identifies native granularity when necessary.
    ResultPayload:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          task:
            const: detection
            type: string
          objects:
            type: array
            items:
              $ref: '#/components/schemas/Detection'
        required:
        - task
        - objects
      - type: object
        additionalProperties: false
        properties:
          task:
            const: classification
            type: string
          classes:
            type: array
            items:
              $ref: '#/components/schemas/Classification'
        required:
        - task
        - classes
      - type: object
        additionalProperties: false
        properties:
          task:
            const: segmentation
            type: string
          kind:
            const: instance
            type: string
          instances:
            type: array
            items:
              $ref: '#/components/schemas/Instance'
        required:
        - task
        - kind
        - instances
      - type: object
        additionalProperties: false
        properties:
          task:
            const: segmentation
            type: string
          kind:
            const: semantic
            type: string
          map:
            $ref: '#/components/schemas/SemanticMap'
        required:
        - task
        - kind
        - map
      - type: object
        additionalProperties: false
        properties:
          task:
            const: pose
            type: string
          poses:
            type: array
            items:
              $ref: '#/components/schemas/Pose'
        required:
        - task
        - poses
      - type: object
        additionalProperties: false
        properties:
          task:
            const: ocr
            type: string
          regions:
            type: array
            items:
              $ref: '#/components/schemas/TextRegion'
        required:
        - task
        - regions
      description: Exactly one task-specific shape. Empty arrays are successful no-match results, not errors. Segmentation
        additionally discriminates by kind. Detection/pose/instances sorted descending confidence, then class_id,
        then x/y; classification sorted by score; OCR preserves reading order. Schema has no discriminator because
        segmentation has two variants with the same task value.
    AnalysisResult:
      type: object
      additionalProperties: false
      properties:
        result_id:
          $ref: '#/components/schemas/Identifier'
        session_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        source_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        media_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        model_id:
          $ref: '#/components/schemas/Identifier'
        engine_id:
          $ref: '#/components/schemas/Identifier'
        task:
          $ref: '#/components/schemas/Task'
        frame_index:
          type: integer
          minimum: 0
        tracking_epoch:
          type: integer
          minimum: 0
        captured_at:
          type: string
          format: date-time
        analyzed_at:
          type: string
          format: date-time
        position_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        duration_ms:
          type: number
          minimum: 0
        stored:
          type: boolean
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        payload:
          $ref: '#/components/schemas/ResultPayload'
        engine_metadata:
          type: object
          additionalProperties: true
          description: Optional non-secret task-specific metadata; portable consumers may ignore it.
      required:
      - result_id
      - session_id
      - source_id
      - media_id
      - model_id
      - engine_id
      - task
      - frame_index
      - tracking_epoch
      - captured_at
      - analyzed_at
      - position_ms
      - width
      - height
      - duration_ms
      - stored
      - expires_at
      - payload
      - engine_metadata
      description: One result per successfully analyzed frame. task must match payload.task. All coordinates/dimensions
        refer to decoded orientation-corrected original frame. frame_index is monotonically increasing within session
        and may have gaps when frames are skipped. One-shot frame_index=0; session_id=null. captured_at is host
        UTC capture/decode time; position_ms is media timestamp for finite video or null for live/still input. analyzed_at
        is completion UTC. duration_ms is analysis elapsed time, excluding waiting for next frame. stored=true means
        committed to metadata history before emission; expires_at is analyzed_at + resolved result_retention_hours.
        Empty output is retained like other results. No source image/video bytes are embedded.
      example:
        result_id: result-1
        session_id: session-1
        source_id: driveway
        media_id: null
        model_id: yolo-detect
        engine_id: ultralytics
        task: detection
        frame_index: 42
        tracking_epoch: 0
        captured_at: '2026-10-06T22:00:00Z'
        analyzed_at: '2026-10-06T22:00:00.050Z'
        position_ms: null
        width: 1920
        height: 1080
        duration_ms: 50
        stored: true
        expires_at: '2026-10-13T22:00:00.050Z'
        payload:
          task: detection
          objects:
          - class_id: 0
            label: person
            confidence: 0.94
            box:
              x: 0.2
              y: 0.1
              width: 0.15
              height: 0.7
            track_id: '17'
        engine_metadata: {}
    ResultQueryPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisResult'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
      description: Newest first, ties by result_id descending. Opaque cursor binds all filters and the initial query
        upper bound; concurrent new writes do not enter later pages. Retention/deletion may remove entries during
        paging; no long-lived snapshot is promised. Invalid cursor is 422; expired cursor is 410.
    SnapshotRequest:
      type: object
      additionalProperties: false
      properties:
        annotated:
          type: boolean
          default: false
        retain:
          type: boolean
          default: false
      description: Capture a JPEG from the exact analyzed frame. Annotated overlays the corresponding result (boxes/labels,
        masks, keypoints, or OCR as appropriate). retain=true stores separate snapshot bytes, expiring under snapshot
        retention; false returns an ephemeral snapshot. Never rerun analysis to fabricate a missing exact frame.
    SnapshotRead:
      type: object
      additionalProperties: false
      properties:
        snapshot_id:
          $ref: '#/components/schemas/Identifier'
        result_id:
          $ref: '#/components/schemas/Identifier'
        annotated:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        content_type:
          type: string
          const: image/jpeg
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      required:
      - snapshot_id
      - result_id
      - annotated
      - created_at
      - expires_at
      - content_type
      - width
      - height
      description: 'Explicitly retained JPEG. Independent of metadata/source-media retention: may outlive its result.
        Snapshot metadata preserves result_id even when result history has expired.'
    ServiceSettings:
      type: object
      additionalProperties: false
      properties:
        result_retention_hours:
          type: integer
          minimum: 1
          default: 168
        media_retention_hours:
          type: integer
          minimum: 1
          default: 24
        snapshot_retention_hours:
          type: integer
          minimum: 1
          default: 168
        frame_cache_seconds:
          type: integer
          minimum: 1
          default: 30
        sse_replay_seconds:
          type: integer
          minimum: 1
          default: 60
        sse_buffer_events:
          type: integer
          minimum: 1
          default: 256
        max_concurrent_sessions:
          type: integer
          minimum: 1
          default: 4
        max_upload_bytes:
          type: integer
          minimum: 1
          default: 1073741824
        max_image_pixels:
          type: integer
          minimum: 1
          default: 50000000
        max_analysis_timeout_seconds:
          type: integer
          minimum: 1
          default: 60
        max_preview_fps:
          type: number
          exclusiveMinimum: 0
          default: 5
        max_result_query_limit:
          type: integer
          minimum: 1
          description: Server-side cap on the total stored results a single query scans or returns. Independent of
            the per-request limit page size, which stays capped at the documented maximum (500); lowering this
            setting does not change the 500 request schema bound, and raising it cannot exceed it.
          default: 1000
        events_enabled:
          type: boolean
          default: false
        event_topics_allowlist:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: &id006
            - opal.look.session.started
            - opal.look.session.completed
            - opal.look.session.failed
            - opal.look.analysis.completed
          default:
          - opal.look.session.started
          - opal.look.session.completed
          - opal.look.session.failed
          - opal.look.analysis.completed
        max_analysis_events_per_second:
          type: number
          exclusiveMinimum: 0
          default: 5
        event_queue_capacity:
          type: integer
          minimum: 1
          default: 256
      description: Portable settings and proposed defaults. Retention changes affect newly created records only;
        records preserve assigned expires_at. Expired records are inaccessible immediately; physical cleanup may
        be delayed while pinned. Cache uses bounded host memory and may evict frames earlier under pressure; clients
        must handle frame_unavailable. Replay is bounded by both age and event count. Lowering session capacity
        does not terminate existing sessions. Decoder/network limits may additionally be implementation-enforced.
        No automatic video recording or snapshots.
    HealthRead:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        ready:
          type: boolean
        engines:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              engine_id:
                $ref: '#/components/schemas/Identifier'
              enabled:
                type: boolean
              available:
                type: boolean
              message:
                anyOf:
                - type: string
                - type: 'null'
            required:
            - engine_id
            - enabled
            - available
            - message
        active_sessions:
          type: integer
          minimum: 0
        details:
          type: object
          additionalProperties: true
          description: Non-secret readiness diagnostics including decoder/storage availability.
        media_capabilities:
          $ref: '#/components/schemas/MediaCapabilities'
        event_publication:
          $ref: '#/components/schemas/EventPublicationHealth'
      required:
      - status
      - ready
      - engines
      - active_sessions
      - details
      - media_capabilities
      - event_publication
      description: Ready means storage/capture infrastructure is usable and at least one enabled registered model
        with an available engine can serve an analysis task. A missing optional engine degrades status but need
        not make ready false.
    ServiceInfo:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          example: opal-look-svc
        version:
          type: string
          description: Deployed application release version.
          example: 2.3.0
        api_version:
          type: string
          description: REST contract version (this document's info.version).
          example: 1.4.0
        description:
          type: string
      required:
      - name
      - version
      - api_version
    LivenessRead:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
      required:
      - status
    MediaCapabilities:
      type: object
      additionalProperties: false
      properties:
        image_content_types:
          type: array
          items:
            type: string
          minItems: 1
        video_content_types:
          type: array
          items:
            type: string
        video_codecs:
          type: array
          items:
            type: string
        max_upload_bytes:
          type: integer
          minimum: 1
        max_image_pixels:
          type: integer
          minimum: 1
      required:
      - image_content_types
      - video_content_types
      - video_codecs
      - max_upload_bytes
      - max_image_pixels
      description: Current installed decoder capabilities and effective acceptance limits. image_content_types includes
        image/jpeg and image/png. video_content_types lists container MIME types; video_codecs lists codec names
        such as h264. A supported container does not imply every codec inside it is supported.
    ConfigExport:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - 1.0.0
          - 1.1.0
          description: New exports use 1.1.0. Imports/validation accept 1.0.0; missing newly introduced event settings
            resolve to documented defaults, including events_enabled=false.
        exported_at:
          type: string
          format: date-time
        engines:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              engine_id:
                $ref: '#/components/schemas/Identifier'
              enabled:
                type: boolean
              config:
                type: object
                additionalProperties: true
                description: Replaces the complete non-secret config object. Secrets use references provisioned
                  outside this API.
            required:
            - engine_id
            - enabled
            - config
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelCreate'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceCreate'
        profiles:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              model_id:
                $ref: '#/components/schemas/Identifier'
              task:
                $ref: '#/components/schemas/Task'
              settings:
                $ref: '#/components/schemas/AnalysisSettings'
              profile_id:
                type: integer
                minimum: 1
              active:
                type: boolean
            required:
            - profile_id
            - name
            - model_id
            - task
            - settings
            - active
        settings:
          $ref: '#/components/schemas/ServiceSettings'
      required:
      - version
      - exported_at
      - engines
      - models
      - sources
      - profiles
      - settings
      description: Logical configuration only. No model/media/snapshot bytes, credentials, result history, runtime
        sessions, or caches. Paths/credential references may require adjustment on another host. Media-backed sources
        are exported as references and may become unavailable after restore. Engine IDs must match installed adapters.
        Export never reveals inline secrets.
    ConfigImportResult:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        validation:
          $ref: '#/components/schemas/ValidationResult'
        message:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - success
      - validation
      - message
    BackupRead:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        created_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          minimum: 1
      required:
      - filename
      - created_at
      - size_bytes
      description: Server-managed configuration backup. Format is application/json containing ConfigExport, excluding
        all bytes/history/runtime state. Filename is opaque and contains no directory separators.
    BackupCreateResponse:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
        message:
          type: string
      required:
      - filename
      - message
    EventEnvelope:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: Opaque SSE replay identifier, independent of result_id.
        session_id:
          $ref: '#/components/schemas/Identifier'
        created_at:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - result
          - state
          - error
          - end
        data:
          oneOf:
          - $ref: '#/components/schemas/AnalysisResult'
          - $ref: '#/components/schemas/SessionRead'
          - $ref: '#/components/schemas/OpalError'
          - type: object
            additionalProperties: false
            properties:
              state:
                type: string
                enum:
                - stopped
                - completed
                - failed
            required:
            - state
      required:
      - event_id
      - session_id
      - created_at
      - type
      - data
      description: 'SSE data JSON: type=result uses AnalysisResult; state uses SessionRead; error uses OpalError;
        end uses terminal-state object. These type/data correspondences are normative. Every persistent event has
        an id and event name matching type. Heartbeats are SSE comments, not envelopes.'
    ServiceSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        result_retention_hours:
          type: integer
          minimum: 1
        media_retention_hours:
          type: integer
          minimum: 1
        snapshot_retention_hours:
          type: integer
          minimum: 1
        frame_cache_seconds:
          type: integer
          minimum: 1
        sse_replay_seconds:
          type: integer
          minimum: 1
        sse_buffer_events:
          type: integer
          minimum: 1
        max_concurrent_sessions:
          type: integer
          minimum: 1
        max_upload_bytes:
          type: integer
          minimum: 1
        max_image_pixels:
          type: integer
          minimum: 1
        max_analysis_timeout_seconds:
          type: integer
          minimum: 1
        max_preview_fps:
          type: number
          exclusiveMinimum: 0
        max_result_query_limit:
          type: integer
          minimum: 1
          description: Server-side cap on the total stored results a single query scans or returns. Independent of
            the per-request limit page size, which stays capped at the documented maximum (500); lowering this
            setting does not change the 500 request schema bound, and raising it cannot exceed it.
        events_enabled:
          type: boolean
        event_topics_allowlist:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - opal.look.session.started
            - opal.look.session.completed
            - opal.look.session.failed
            - opal.look.analysis.completed
        max_analysis_events_per_second:
          type: number
          exclusiveMinimum: 0
        event_queue_capacity:
          type: integer
          minimum: 1
      description: Partial typed update. Omitted fields remain unchanged; arrays replace entirely. Validate every
        supplied field before applying any change. Changes activate atomically; unsupported/unknown fields return
        422. Event enablement requires provisioned transport; invalid configuration returns 422 without mutation.
        Disabling publication drops queued unpublished notifications. Retention changes affect new records only.
        Empty patches are rejected.
    BusEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
          enum: *id006
        source:
          type: string
          const: opal-look
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          properties:
            metadata:
              type: object
              additionalProperties: false
              required:
              - schema_version
              properties:
                schema_version:
                  type: string
                  const: '1.0'
                session_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                transaction_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                request_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                causation_id:
                  type: string
                  minLength: 1
                  maxLength: 128
          description: Identifier-only/redacted notification summary as defined in the event publication section;
            no image bytes, full results, OCR text, paths or secrets. Optional metadata carries the OPAL correlation
            context per the shared data.metadata convention; unknown metadata fields MUST be ignored.
      required:
      - id
      - topic
      - source
      - timestamp
      - data
      description: Non-HTTP publication envelope compatible with opal-event EventInput. SSE EventEnvelope is separate.
      example:
        id: 2b6b48f4-7b87-49e8-bb35-ef0fa777c778
        topic: opal.look.session.started
        source: opal-look
        timestamp: '2026-10-09T03:32:00Z'
        data:
          session_id: session-1
          source_id: camera-1
          model_id: yolo-detect
          task: detection
          state: running
          metadata:
            schema_version: '1.0'
            session_id: session-1
    EventPublicationHealth:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum:
          - disabled
          - ok
          - degraded
        published:
          type: integer
          minimum: 0
        dropped:
          type: integer
          minimum: 0
        rate_limited:
          type: integer
          minimum: 0
        queue_depth:
          type: integer
          minimum: 0
        message:
          type:
          - string
          - 'null'
      required:
      - enabled
      - status
      - published
      - dropped
      - rate_limited
      - queue_depth
      - message
      description: Counters since process start. published counts successful local transport sends, not consumer
        acknowledgements. dropped includes rate-limited, queue-overflow and failed-send notifications; rate_limited
        is a subset. Diagnostics are redacted.
    OpalError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          - transaction_id
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            request_id:
              type: string
            transaction_id:
              type: string
            session_id:
              type:
              - string
              - 'null'
            causation_id:
              type:
              - string
              - 'null'
    OpalCursorPageMetadata:
      type: object
      required:
      - next_cursor
      - has_more
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    OpalHealthProbe:
      type: object
      required:
      - status
      - ready
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        ready:
          type: boolean
        details:
          type: object
          additionalProperties: true
    OpalSingleSetting:
      type: object
      additionalProperties: false
      required:
      - key
      - value
      properties:
        key:
          type: string
          minLength: 1
        value:
          description: Effective JSON value; constrained by service setting schema.
    OpalSingleSettingPut:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          description: Native JSON value validated against the leaf setting schema.
  parameters:
    OpalSessionIdHeader:
      name: X-Opal-Session-Id
      in: header
      required: false
      schema:
