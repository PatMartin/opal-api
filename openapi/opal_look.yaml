x-opal-mvp-rules:
  engine_free_core: All non-inference stream operations MUST work with zero installed engines; /engine/ returns 200 with []
    and service health remains good.
  video_mode: No engine or model provided implies unannotated video mode. No implicit AI engine selection.
  source_security: No raw RTSP credentials in responses, logs, SSE or error details. Validate SSRF and network policy; require
    auth beyond loopback.
  decoding: Decode a source once per stream and fan frames out to consumers; viewing must not establish a new RTSP connection.
  bounded_resources: Bound frame queues and stream admission; stopping releases resources; stale replays fail explicitly.
  scope: No opal-devices, recording, pipelines, tracking, jobs, personas, event bus, training, or model downloads in MVP Plus.
