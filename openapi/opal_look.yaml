      description: Search durable, unexpired rule firings, newest first by created_at and observation_id. 
        Cursor binds filters and expires; 410 if cursor expired. Used to reconcile lost best-effort event-bus 
        notifications; consumer should persist last seen observation ID/time and periodically backfill.
      operationId: opal_look_15_observations_search_observations
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObservationRead'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                required:
                - items
                - next_cursor
                - has_more
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
