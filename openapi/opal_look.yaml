        source_kinds:
          type: array
          items:
            type: string
        media_types:
          type: array
          items:
            type: string
        stream_transports:
          type: array
          items:
            type: string
        export_formats:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        filters:
          type: array
          items:
            type: string
          description: Available portable filter types.
        visualization_modes:
          type: array
          items:
            type: string
          description: Supported motion overlay modes.
        supports_raw_stream:
          type: boolean
        supports_motion_gate:
          type: boolean
      additionalProperties: false
      required:
      - tasks
      - source_kinds
      - media_types
      - stream_transports
      - export_formats
      - limits
    RecordingCreate:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        include_audio:
          type: boolean
        max_duration_seconds:
          type: integer
          minimum: 1
        output:
          $ref: '#/components/schemas/ExportOptions'
      additionalProperties: false
      required:
      - source_id
    Recording:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum:
          - starting
          - recording
          - stopping
          - completed
          - failed
        created_at:
          type: string
          format: date-time
        started_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        finished_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        artifact_id:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - source_id
      - state
      - created_at
    RecordingPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recording'
        next_cursor:
          oneOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
    VideoProcessingOptions:
      type: object
      additionalProperties: false
      description: Limits for source stream and preview. Values are requests subject to service and source capability
        limits; unsupported parameters yield 422, never silently ignored.
      properties:
        target_fps:
          type: number
          description: Maximum output FPS; never accelerate source.
          minimum: 0.1
        width:
          type: integer
          description: Requested output width (preserve aspect ratio if height omitted).
          minimum: 1
        height:
          type: integer
          description: Requested output height (preserve aspect ratio if width omitted).
          minimum: 1
        quality:
          type: integer
          description: JPEG quality 1..100.
          minimum: 1
          maximum: 100
    AnnotationOptions:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
        show_boxes:
          type: boolean
          default: true
        show_labels:
          type: boolean
          default: true
        show_confidence:
          type: boolean
          default: true
        show_track_ids:
          type: boolean
          default: false
        classes:
          type: array
          items:
            type: string
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
        show_zones:
          type: boolean
          default: false
      description: 'Presentation-only options: they must never change underlying inference or persisted results.
        Class names are validated against pipeline/model capability.'
    FilterSpec:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - grayscale
          - brightness_contrast
          - blur
          - sharpen
          - threshold
          - edges
          - rotate
          - flip
          - crop
          - resize
          - motion
        parameters:
          type: object
          additionalProperties: true
          description: Validated against the selected filter type. See x-opal-filter-catalog for required keys and
            ranges.
      description: Portable filter type and parameter object. Unknown types/parameters and unsupported implementations
        yield 422.
    MotionGateOptions:
      type: object
      additionalProperties: false
      required:
      - motion_stage_id
      properties:
        motion_stage_id:
          type: string
          minLength: 1
        when:
          type: string
          const: motion_present
        periodic_sample_frames:
          type: integer
          minimum: 1
          default: 30
        on_unknown:
          type: string
          enum:
          - run
          - skip
          default: run
      description: Gates expensive downstream inference only. Frames and previews continue. Periodic samples count
        incoming frames; no fake negative detections on skipped frames. Motion stage must be prior to gated node.
    ProcessingStageOptions:
      type: object
      additionalProperties: false
      properties:
        filter:
          $ref: '#/components/schemas/FilterSpec'
        gate:
          $ref: '#/components/schemas/MotionGateOptions'
        annotation:
          $ref: '#/components/schemas/AnnotationOptions'
        video:
          $ref: '#/components/schemas/VideoProcessingOptions'
      description: Portable stage controls. Stage kind determines which keys are valid; the generic options object
        on PipelineStage remains for existing engine-specific options.
    PersonaCreate:
      type: object
      additionalProperties: false
      required:
      - persona_id
      - name
      properties:
        persona_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*
          description: Globally unique OPAL persona identifier.
          example: amy
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable persona name.
          example: Amy
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional human-readable description or character notes.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Optional OPAL Say voice identifier associated with this persona.
          example: en-gb-alan-low
        enabled:
          type: boolean
          default: true
          description: Whether this persona may be selected.
      example:
        persona_id: amy
        name: Amy
        voice_id: en-gb-alan-low
        enabled: true
    PersonaUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Partial update to a persona.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Rebind the persona to a different OPAL Say voice identifier.
        enabled:
          type: boolean
    PersonaRead:
      type: object
      required:
      - persona_id
      - name
      - enabled
      - created_at
      - updated_at
      properties:
        persona_id:
          type: string
          description: Globally unique OPAL persona identifier.
          example: amy
        name:
          type: string
          example: Amy
        description:
          anyOf:
          - type: string
          - type: 'null'
        voice_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional OPAL Say voice identifier associated with this persona.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  parameters:
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Globally unique OPAL persona identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      example: amy
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 1–128 characters; persist key/fingerprint for 24 hours. Retry with changed body yields 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    RangeNotSatisfiable:
      description: RangeNotSatisfiable
      content:
        application/json:
          schema:
            $ref: ./shared/opal_kernel.yaml#/components/schemas/OpalError
      headers:
        X-Opal-Session-Id: &id027
          $ref: ./shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader
        X-Opal-Transaction-Id: &id028
          $ref: ./shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader
        X-Opal-Request-Id: &id029
          $ref: ./shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader
        X-Opal-Causation-Id: &id030
          $ref: ./shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader
    CapacityExceeded:
      description: CapacityExceeded
      content:
        application/json:
          schema:
            $ref: ./shared/opal_kernel.yaml#/components/schemas/OpalError
      headers:
        X-Opal-Session-Id: *id027
        X-Opal-Transaction-Id: *id028
        X-Opal-Request-Id: *id029
        X-Opal-Causation-Id: *id030
  securitySchemes:
    BearerAuth:
      $ref: ./shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth
paths:
  /api/v1/capabilities/:
    get:
      tags:
      - discovery
      summary: Discover runtime feature/task/format support
      operationId: show_capabilities
      description: ''
      parameters:
      - &id031
        $ref: ./shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter
      - &id032
        $ref: ./shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter
      - &id033
        $ref: ./shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter
      - &id034
        $ref: ./shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter
      responses:
        '401':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Forbidden
        '200':
          description: OK
          headers:
            X-Opal-Session-Id: *id027
            X-Opal-Transaction-Id: *id028
            X-Opal-Request-Id: *id029
            X-Opal-Causation-Id: *id030
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityCatalog'
        '422':
          $ref: ./shared/opal_kernel.yaml#/components/responses/UnprocessableEntity
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '404':
          $ref: ./shared/opal_kernel.yaml#/components/responses/NotFound
        '503':
          $ref: ./shared/opal_kernel.yaml#/components/responses/ServiceUnavailable
        '409':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Conflict
      x-opal-cli:
        group: capabilities
        command: show
  /api/v1/engine/:
    $ref: ./shared/opal_kernel.yaml#/components/pathItems/engines_collection
    x-opal-cli:
      get:
        group: engine
        command: list
  /api/v1/engine/{engine_id}:
    $ref: ./shared/opal_kernel.yaml#/components/pathItems/engine_item
    x-opal-cli:
      get:
        group: engine
        command: show
      patch:
        group: engine
        command: update
  /api/v1/model/:
    get:
      tags:
      - models
      summary: List models
      operationId: list_models
      description: ''
      parameters:
      - *id031
      - *id032
      - *id033
      - *id034
      responses:
        '401':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Forbidden
        '200':
          description: OK
          headers:
            X-Opal-Session-Id: *id027
            X-Opal-Transaction-Id: *id028
            X-Opal-Request-Id: *id029
            X-Opal-Causation-Id: *id030
            ETag:
              $ref: ./shared/opal_kernel.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '422':
          $ref: ./shared/opal_kernel.yaml#/components/responses/UnprocessableEntity
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '404':
          $ref: ./shared/opal_kernel.yaml#/components/responses/NotFound
        '503':
          $ref: ./shared/opal_kernel.yaml#/components/responses/ServiceUnavailable
        '409':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Conflict
      x-opal-cli:
        group: model
        command: list
    post:
      tags:
      - models
      summary: Register model
      operationId: add_models
      description: ''
      parameters:
      - *id031
      - *id032
      - *id033
      - *id034
      - $ref: ./shared/opal_kernel.yaml#/components/parameters/IfMatch
      responses:
        '401':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Forbidden
        '201':
          description: Created
          headers:
            X-Opal-Session-Id: *id027
            X-Opal-Transaction-Id: *id028
            X-Opal-Request-Id: *id029
            X-Opal-Causation-Id: *id030
            Location:
              $ref: ./shared/opal_kernel.yaml#/components/headers/Location
            ETag:
              $ref: ./shared/opal_kernel.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '422':
          $ref: ./shared/opal_kernel.yaml#/components/responses/UnprocessableEntity
        '428':
          $ref: ./shared/opal_kernel.yaml#/components/responses/PreconditionRequired
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '404':
          $ref: ./shared/opal_kernel.yaml#/components/responses/NotFound
        '503':
          $ref: ./shared/opal_kernel.yaml#/components/responses/ServiceUnavailable
        '409':
          $ref: ./shared/opal_kernel.yaml#/components/responses/Conflict
        '412':
          $ref: ./shared/opal_kernel.yaml#/components/responses/PreconditionFailed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      x-opal-cli:
        group: model
        command: add
  /api/v1/model/{model_id}:
    get:
      tags:
