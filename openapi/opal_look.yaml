  /api/v1/backup/import:
    post:
      tags:
      - backup
      summary: Import configuration
      description: Validate and atomically replace all logical configuration; this is replacement, not merge. Reject
        with 409 while any session is nonterminal or one-shot analysis is in flight. Require unique identifiers,
        valid references, installed engine IDs, and exactly one active profile if profiles exist. Missing host assets/credential/media
        references produce warnings and unavailable registrations, not implicit downloads. Structural incompatibility
        returns 422. Failed import leaves existing configuration unchanged. Does not modify result/media/snapshot
        history or secrets; disabling unused installed engines is allowed.
      operationId: post_api_v1_backup_import
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigImportResult'
          headers:
            ETag:
              description: Opaque strong ETag for the current logical configuration revision.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '428':
          $ref: '#/components/responses/OpalError428'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '500':
          $ref: '#/components/responses/OperationFailed'
        '412':
          $ref: '#/components/responses/OpalError412'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigExport'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Required strong ETag of the complete logical configuration, or '*' to bypass the check explicitly.
          Checked atomically against the current global revision; missing returns 428, stale or
          nonmatching returns 412, malformed returns 422. Obtain the revision from GET
          /api/v1/settings/, the relevant collection GET, or the resource GET.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/backup/validate:
    get:
      tags:
      - backup
      summary: Validate current configuration
      description: Validate logical references, installed engines, model resources, source access and profile compatibility;
        no mutation and no persistent sessions.
      operationId: get_api_v1_backup_validate
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '422':
          $ref: '#/components/responses/OpalError422'
    post:
      tags:
      - backup
      summary: Validate supplied configuration backup
      description: Validate supplied ConfigExport using the same structural, reference, installed-engine and compatibility
        rules as import, without mutation or persistent sessions. Completed checks return 200 with valid=false for
        invalid backup content. Malformed JSON or schema-invalid request returns 422. Missing host/media/credential
        resources produce the same warnings as import. No assets are downloaded and no events are published. Revision
        remains unchanged.
      operationId: post_api_v1_backup_validate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigExport'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
