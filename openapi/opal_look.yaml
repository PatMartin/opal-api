    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/settings/:
    get:
      tags:
      - settings
      summary: List settings
      description: Return effective portable settings with all documented defaults materialized. Unknown engine-specific
        configuration belongs to engine config, not this resource.
      operationId: get_api_v1_settings
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSettings'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    patch:
      tags:
      - settings
      summary: Update portable settings atomically
      description: Partial typed update. Omitted fields remain unchanged; arrays replace entirely. Validate every
        supplied field before applying any change. Changes activate atomically; unsupported/unknown fields return
        422. Event enablement requires provisioned transport; invalid configuration returns 422 without mutation.
        Disabling publication drops queued unpublished notifications. Retention changes affect new records only.
        Empty patches are rejected.
      operationId: patch_api_v1_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceSettingsPatch'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSettings'
          headers:
            ETag:
              description: Opaque strong ETag for the current logical configuration revision.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
        '412':
          $ref: '#/components/responses/OpalError412'
        '428':
          $ref: '#/components/responses/OpalError428'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Required strong ETag of the complete logical configuration, or '*' to bypass the check explicitly.
          Checked atomically against the current global revision; missing returns 428, stale or
          nonmatching returns 412, malformed returns 422. Obtain the revision from GET
          /api/v1/settings/, the relevant collection GET, or the resource GET.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
