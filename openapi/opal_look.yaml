          minimum: 0
        drops:
          type: integer
          minimum: 0
        transport_status:
          type: string
      additionalProperties: false
      required:
      - enabled
      - topics
      - queue_capacity
      - drops
      - transport_status
    CapabilityCatalog:
      type: object
      properties:
        tasks:
          type: array
