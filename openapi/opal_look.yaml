      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalCausationIdHeader:
      description: X-Opal-Causation-Id correlation token; opaque 1..128 printable non-whitespace ASCII characters.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ETag:
      description: Strong revision of the portable logical configuration.
      schema:
        type: string
    Location:
      description: Canonical path of created resource.
      schema:
        type: string
  parameters:
    OpalSessionIdHeader:
      name: X-Opal-Session-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalTransactionIdHeader:
      name: X-Opal-Transaction-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalRequestIdHeader:
      name: X-Opal-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalCausationIdHeader:
      name: X-Opal-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One strong quoted ETag or *. Missing=428, stale=412, malformed=422.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 1–128 characters; persist key/fingerprint for 24 hours. Retry with changed body yields 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque filter-bound cursor. Invalid/expired=422.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
      description: Maximum page size, server caps apply.
