      - $ref: ./shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter
      - name: annotations
        in: query
        schema:
          type: boolean
          default: false
        description: Source-only stream is unannotated by default. For annotated streaming, supply pipeline_id;
          no new inference session is created explicitly by the caller.
      - name: pipeline_id
        in: query
        schema:
          type: string
      - name: classes
        in: query
