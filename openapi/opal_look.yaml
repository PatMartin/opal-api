        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: media_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/media/{media_id}/content:
    get:
      tags:
      - media
      summary: Download media
      description: Download original uploaded bytes. Content-Type is the accepted media MIME; no transcoding. 
        Expired media is inaccessible even if pinned by an existing session.
      operationId: get_api_v1_media_media_id_content
      responses:
