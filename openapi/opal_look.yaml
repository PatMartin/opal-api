              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
    get:
      tags:
      - media
      summary: List uploaded media
      description: 'List unexpired uploaded media newest first. This inventory does not list retained snapshots
        or host files.

        Use cursor pagination, stable descending time-plus-ID ordering; filters are bound into the cursor. Invalid
        or mismatched cursors return 422. Response next_cursor is null at end.

        '
      operationId: get_api_v1_media
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaRead'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                    description: True iff next_cursor is non-null.
                required:
                - items
                - next_cursor
                - has_more
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Maximum items per page.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque continuation token returned from the preceding page.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/media/{media_id}:
    get:
      tags:
      - media
      summary: Get media
      description: Get uploaded media metadata. Expired but not yet purged IDs return 410; 
        unknown/purged/deleted IDs return 404.
      operationId: get_api_v1_media_media_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
    delete:
      tags:
      - media
      summary: Delete uploaded media
      description: Delete original uploaded bytes and registration. Pinned by an active session/analysis 
        returns 409. Source references remain registered but become unavailable. Result/snapshot retention is 
        independent. Uploaded bytes pinned by a queued/running/cancelling export return 409.
      operationId: delete_api_v1_media_media_id
      responses:
