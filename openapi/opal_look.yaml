openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OPAL Look API
  version: 1.4.0
  description: 'Implementation-neutral vision service for the OPAL suite, complementary to OPAL Listen and OPAL
    Talk. This OpenAPI contract is the public source of truth for REST, CLI and SPA behavior. No particular vision
    library, decoder, camera API, model layout or remote provider is required by clients. Ultralytics YOLO is an
    example adapter, not a mandatory public abstraction.


    Version 1 scope:

    * Class-level detection, image classification, instance/semantic segmentation, pose estimation and OCR. Optional
    detection tracking supplies temporary session/epoch identities, never recognition of particular people or objects.

    * Engines are installed/discovered by the implementation and may execute locally or through remote services.
    Each advertises capabilities; an engine/model need not support every task. Unknown or unsupported controls MUST
    be rejected, never silently ignored.

    * Models register already-present host resources or existing remote model references. No downloads, training,
    model uploads, installations or deletion of host assets.

    * Sources describe host cameras (including USB/Pi adapters), RTSP, HTTP/MJPEG feeds, host videos and uploaded
    video media. Uploaded still images go directly to analyze. Client devices are not server cameras; browser capture
    must upload stills or use an explicitly configured supported source.

    * One-shot analysis is synchronous. Continuous/video analysis uses independent sessions with one model and one
    task per session. Multiple concurrent sessions may share sources subject to device/runtime capacity. Only detection
    sessions may enable tracking.

    * Reusable profiles are source-independent. At most one is active. Explicit request overrides resolve over explicit/active
    profile, then defaults. Sessions snapshot resolved settings at creation.

    * Structured results stream through SSE and optionally persist in searchable history (default on). Retention
    is seven days for results, 24 hours for uploaded media, seven days for explicitly retained snapshots. Expiration
    clocks are independent. No automatic recording or image retention. frame cache and SSE replay are bounded ephemeral
    caches, not durable storage.

    * Raw/annotated JPEG snapshots and an annotated MJPEG preview are available. Historical metadata does not guarantee
    source-frame bytes remain available. A request for an evicted exact frame fails rather than substituting a newly
    captured frame.

    * Coordinates are normalized against the original decoded, orientation-corrected frame, never inference resizing/padding.
    Masks are at original dimensions and use explicitly specified row-major RLE. Scores are model-derived and not
    generally comparable across engines/models.

    * Settings, health and backup/import/export follow the OPAL suite operational pattern. Configuration backup
    excludes secrets, model/media/snapshot bytes, result history and runtime sessions.

    * Internal service, no built-in authentication in this contract. Secrets are provisioned out of band and referenced.
    Bind locally by default; deployment controls access, host-path permissions and remote-source restrictions. Remote
    adapters may transmit source frames to the configured provider.

    * Zones, line-crossing rules, object-count events, downstream actions, identity recognition and automatic video
    recording are consumer concerns outside v1. ROI controls select inference/filter regions; they are not event
    rules.


    Workflow: discover engines -> register models -> register a source or upload media -> create a compatible profile
    -> POST analyze or POST sessions -> consume SSE/preview/history -> stop a live session -> delete terminal session/media
    when desired. Uploaded videos become media-backed sources. Discovery/validation never performs implicit installation
    or downloads.


    HTTP conventions: collections end in / to match OPAL sister contracts; clients use exactly the listed routes
    rather than relying on redirects. Configuration POST returns 201; session admission returns 202 with Location.
    Delete returns 204. Validation operations return 200 with valid=false for completed checks. Invalid requests
    all errors use the OpalError envelope. GET results never triggers inference. Mutations
    are atomic. Session creation supports optional Idempotency-Key; other non-idempotent POST retries may create
    duplicates. Responses may gain additive fields in future versions; clients should tolerate them, while requests
    reject unknown portable fields.


    Version 1.1 changes: typed atomic settings PATCH; optional configuration revision preconditions; versioned live/ready
    probes; supplied-backup validation; creation Location headers; asynchronous session admission returns 202; retry-safe
    session admission; optional opal-event publication; operational request IDs. Collection shapes and internal
    authentication conventions remain as previously specified.


    CONFIGURATION REVISIONS

    All logical configuration shares one opaque strong ETag revision (engines, models, sources, profiles, portable
    settings). GET configuration resources, collections, and backup/export return this ETag. Successful configuration
    writes return the new ETag, including 204 responses. Optional If-Match on configuration writes, import and restore
    compares against that revision atomically with mutation. A stale or otherwise nonmatching valid precondition
    returns 412 precondition_failed; malformed headers return 422. If-Match accepts a single strong quoted ETag
    or *; weak tags and lists are rejected. * matches the existing logical configuration. Omission preserves unconditional
    behavior. No-op writes may retain the revision. Any external configuration edit must participate in the same
    revision and atomic activation rules. Runtime frames/results/session transitions do not advance the configuration
    revision. Restore/import must never restore an old revision value.


    EVENT BUS PUBLICATION (non-HTTP, optional)

    Disabled by default. The service is an opal-event producer, not a broker, rule evaluator, or action executor.
    Transport addresses, CURVE identities and credentials are provisioned outside portable REST settings and excluded
    from backups. Publication uses exactly two ZeroMQ frames: UTF-8 topic followed by UTF-8 JSON BusEvent. No extra
    top-level fields, including metadata, are permitted; optional OPAL correlation metadata travels inside
    data.metadata per the shared convention. Both frames together must fit opal-event''s 1 MiB serialized
    limit. Topic frame MUST equal envelope.topic; source is opal-look; id is a generated UUID; timestamp is UTC
    RFC3339. Topics: opal.look.session.started (first transition to running), opal.look.session.completed (completed
    or stopped), opal.look.session.failed (failed), and opal.look.analysis.completed (successful one-shot/session
    inference). Lifecycle data includes session_id, source_id, model_id, task, state and redacted error code where
    applicable. Analysis data includes result_id, session_id (nullable), source_id (nullable), model_id, task and
    analyzed_at; it excludes full task payloads, OCR text, images, paths, URLs and secrets. Consumers retrieve authorized
    results via REST; an ephemeral/expired result may be unavailable. Session-started is emitted at most once per
    session, not on reconnection. Enabling publication never replays old events. Topics must be explicitly allowlisted
    and known. Analysis notifications have a service-wide rate cap; excess notifications are dropped with counters,
    not queued indefinitely. Lifecycle notifications use an independently bounded queue. Publication is best effort
    and may drop, duplicate or reorder; it is not a durable work queue. Broker failure/overflow never changes inference
    success or session state. Event diagnostics and drop counters appear in health; event-bus outage degrades health
    but does not make vision readiness false. SSE remains independent, with its existing replay and disconnect semantics.
    Event settings are portable and included in configuration export; transport bindings and secrets are not.

    Release 1.4.0 contract alignment notes:

    * Error envelopes are the suite OpalError shape (error.{code,message,request_id,transaction_id,...}); legacy
      ErrorResponse/HTTPValidationError bodies were removed. This is a breaking change for consumers of the old
      flat error bodies.
    * All logical-configuration mutations require a strong If-Match (missing 428, stale 412, malformed 422);
      creates, activates, settings and backup import/restore included. Unconditional mutation now requires the
      explicit ''*'' precondition.
    * Individual settings keys address the flat ServiceSettings leaf names (events_enabled, event_queue_capacity,
      ...); typed JSON values, no stringification. DELETE clears an override and restores the documented default.
    * ZeroMQ BusEvent keeps OPAL correlation metadata optional inside data.metadata; no required top-level
      metadata field. Wire protocol unchanged: two frames, topic equals envelope.topic.
    * Cursor pagination (items/next_cursor/has_more, newest-first + ID tie-break, filter-bound) on sessions,
      results, media and snapshots; max_result_query_limit bounds total scans, not page size.
    * Deferred: recording/capture APIs, pause/resume, async one-shot analysis, per-tenant quotas, and broader
      observability endpoints remain out of scope.


    SESSION ADMISSION RETRIES

    Idempotency-Key is optional and applies only to POST /api/v1/sessions/. Validate header syntax with 422. Scope
    is this service instance''s durable store. Fingerprint submitted JSON by object-key-independent canonical JSON,
    preserving array order and distinguishing omitted fields from explicit defaults/null. Key reservation and session
    admission are atomic, concurrent identical retries converge on one session, and records survive restart. Do
    not reserve keys for rejected admission. Same key plus different submitted JSON returns 409 idempotency_conflict,
    even if resolved settings might coincide. Identical retries within 24 hours return the original 202 body and
    Location (an admission snapshot, not current state); GET the session for current state. Keys are held until
    expiry even if a session becomes terminal. If the original session was explicitly deleted, return 409 idempotency_resource_deleted
    without re-creation. Expired keys may be used for new admission. Replay does not re-resolve profiles/defaults,
    consume capacity, revalidate engine readiness, or publish duplicate admission/lifecycle events. Session records
    and retry records have independent retention. Other POST operations do not gain retry guarantees.



    OPAL SUITE STANDARD v1.2 (normative)

    X-Opal-Session-Id is an optional logical context identifier; it does not create a server-managed session or
    grant authorization. Entry-point services generate one when absent where a workflow requires it, and propagate
    it unchanged. A preexisting service-local session resource has a separate lifecycle. X-Opal-Transaction-Id is
    a single logical end-to-end operation and is not an atomic distributed transaction. X-Opal-Request-Id identifies
    one inbound HTTP exchange and is regenerated for each downstream HTTP hop (the incoming one can be used for
    diagnostics); X-Opal-Causation-Id names the immediate parent event/request, where applicable. For inbound requests,
    if a transaction ID is absent the service assigns one; all response types (including errors, streamed headers,
    and binary bodies) return session ID if known and transaction/request IDs. Never trust these values for access
    control. Propagate them into derived ZeroMQ envelope metadata. All identifiers are opaque 1..128-character printable
    ASCII tokens with no control/whitespace characters; client-supplied invalid values yield 422.

    Standard health routes: /api/v1/health/, /api/v1/health/live, /api/v1/health/ready. Settings: GET and PATCH
    /api/v1/settings/ exclusively; PATCH is atomic. Mutable configuration uses strong ETags and mandatory If-Match
    with 428 missing, 412 stale. For bounded configuration catalogs return full arrays (subject to explicit deployment
    caps); for growing histories use cursor pagination with stable deterministic ordering, opaque next_cursor and
    has_more. Cursors are scoped to the exact filter set and invalidate on mismatch (422); cursor values expire
    explicitly. Standard HTTP creation 201 Location, async admission 202, empty deletion 204. Streaming keeps media-specific
    transports but exposes correlation headers, defined failure behavior, and no unsupported replay guarantee. Configuration
    export/import/validation excludes secrets and history.



    Single-setting operations: GET/PUT/DELETE /api/v1/settings/{key}.'
servers:
- url: http://localhost:8000
  description: Example internal development base URL; deployment chooses the port.
security: []
tags:
- name: engines
  description: Installed local/remote adapters and their capabilities.
- name: models
  description: Host/remote model registrations and metadata.
- name: sources
  description: Camera, feed and finite-video source registrations.
- name: profiles
  description: Reusable analysis presets and active-default selection.
- name: media
  description: Managed uploaded source imagery and video.
- name: analyze
  description: Synchronous image/frame inference.
- name: sessions
  description: Background analysis lifecycle and immutable resolved configuration.
- name: results
  description: Live SSE and retained searchable task outputs.
- name: visuals
  description: Exact-frame snapshots and live MJPEG previews.
- name: settings
  description: Portable service settings.
- name: health
  description: Service info, liveness and readiness.
- name: backup
  description: Configuration backup, validation, export and atomic replacement.
paths:
  /api/v1/engines/:
    get:
      tags:
      - engines
      summary: List engines
      description: 'Return current registered/configured resources. Read-only availability is current observed status
        and may change; list does not force network/device probes.

        Return the complete bounded configuration collection; pagination is not supported. An implementation may
        reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      operationId: get_api_v1_engines
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
      parameters: []
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/engines/{engine_id}:
    get:
      tags:
      - engines
      summary: Get engine
      description: Return one resource and current configuration.
      operationId: get_api_v1_engines_engine_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    patch:
      tags:
      - engines
      summary: Update engine
      description: Apply documented partial update atomically. Omitted fields remain unchanged; nested opaque objects
        replace rather than merge. Referenced resources must exist.
      operationId: patch_api_v1_engines_engine_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineRead'
          headers:
            ETag:
              description: Opaque strong ETag for the current logical configuration revision.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '412':
          $ref: '#/components/responses/OpalError412'
        '428':
          $ref: '#/components/responses/OpalError428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineUpdate'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Required strong ETag of the complete logical configuration, or '*' to bypass the check explicitly.
          Checked atomically against the current global revision; missing returns 428, stale or
          nonmatching returns 412, malformed returns 422. Obtain the revision from GET
          /api/v1/settings/, the relevant collection GET, or the resource GET.
    parameters:
    - name: engine_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/engines/{engine_id}/validate:
    post:
      tags:
      - engines
      summary: Validate engine
      description: Validate resolved configuration and current usability. The operation completed normally even
        if valid=false. Profile validation checks model task/settings. No persistent session starts.
      operationId: post_api_v1_engines_engine_id_validate
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: engine_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/models/:
    get:
      tags:
      - models
      summary: List models
      description: 'Return current registered/configured resources. Read-only availability is current observed status
        and may change; list does not force network/device probes.

        Return the complete bounded configuration collection; pagination is not supported. An implementation may
        reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      operationId: get_api_v1_models
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
      parameters:
      - name: engine_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: task
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Task'
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
    post:
      tags:
      - models
      summary: Register model
      description: Create configuration and preserve stable identifier; validate structural and referenced-resource
        compatibility. Registration never uploads/downloads model or source files.
      operationId: post_api_v1_models
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRead'
          headers:
            ETag:
              description: Opaque strong ETag for the current logical configuration revision.
              schema:
                type: string
            Location:
              description: Resource URL
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '428':
          $ref: '#/components/responses/OpalError428'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '412':
          $ref: '#/components/responses/OpalError412'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Required strong ETag of the complete logical configuration, or '*' to bypass the check explicitly.
          Checked atomically against the current global revision; missing returns 428, stale or
          nonmatching returns 412, malformed returns 422. Obtain the revision from GET
          /api/v1/settings/, the relevant collection GET, or the resource GET.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/models/{model_id}:
    get:
      tags:
      - models
      summary: Get model
      description: Return one resource and current configuration.
      operationId: get_api_v1_models_model_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    patch:
      tags:
      - models
      summary: Update model
      description: Apply documented partial update atomically. Omitted fields remain unchanged; nested opaque objects
        replace rather than merge. Referenced resources must exist.
      operationId: patch_api_v1_models_model_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRead'
          headers:
            ETag:
              description: Opaque strong ETag for the current logical configuration revision.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/OpalError422'
        '412':
          $ref: '#/components/responses/OpalError412'
        '428':
          $ref: '#/components/responses/OpalError428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdate'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Required strong ETag of the complete logical configuration, or '*' to bypass the check explicitly.
          Checked atomically against the current global revision; missing returns 428, stale or
          nonmatching returns 412, malformed returns 422. Obtain the revision from GET
          /api/v1/settings/, the relevant collection GET, or the resource GET.
    delete:
      tags:
      - models
      summary: Delete model
      description: Delete registration/configuration only. Return 409 for nonterminal-session references, model
        references from profiles, source/media dependencies, or active-profile deletion. Historical results preserve
        original identifiers. Never delete underlying host model/source files.
      operationId: delete_api_v1_models_model_id
      responses:
        '204':
          description: Deleted/reset; no response body.
          headers:
            ETag:
              description: Opaque strong ETag for the current logical configuration revision.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/OpalError412'
        '422':
          $ref: '#/components/responses/OpalError422'
        '428':
          $ref: '#/components/responses/OpalError428'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Required strong ETag of the complete logical configuration, or '*' to bypass the check explicitly.
          Checked atomically against the current global revision; missing returns 428, stale or
          nonmatching returns 412, malformed returns 422. Obtain the revision from GET
          /api/v1/settings/, the relevant collection GET, or the resource GET.
    parameters:
    - name: model_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/models/{model_id}/validate:
    post:
      tags:
      - models
      summary: Validate model
      description: Validate resolved configuration and current usability. The operation completed normally even
        if valid=false. Profile validation checks model task/settings. No persistent session starts.
      operationId: post_api_v1_models_model_id_validate
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
