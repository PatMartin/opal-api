  /api/v1/analyze:
    post:
      tags:
      - analyze
      summary: Analyze image or frame
      description: Resolve request/profile defaults, decode one input, perform the selected task, normalize outputs,
        and return synchronously. Metadata is persisted before return when store_result=true. No automatic snapshot/video
        retention. Per-request wall-clock timeout includes source access and inference. Cannot track a single frame.
      operationId: post_api_v1_analyze
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
