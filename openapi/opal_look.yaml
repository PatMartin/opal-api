      description: X-Opal-Session-Id correlation token; opaque 1..128 printable non-whitespace ASCII characters.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalTransactionIdHeader:
      description: X-Opal-Transaction-Id correlation token; opaque 1..128 printable non-whitespace ASCII characters.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpalRequestIdHeader:
