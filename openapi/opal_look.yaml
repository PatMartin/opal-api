        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/OpalError422'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/AnalysisTimeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
