x-opal-filter-catalog:
  portable_filters:
    grayscale: No parameters
    brightness_contrast: brightness [-1,1], contrast [0,4]
    blur: kernel_size odd integer [3,31]
    sharpen: amount [0,3]
    threshold: threshold [0,255]
    edges: low_threshold [0,255], high_threshold [0,255] with low<=high
    rotate: degrees one of 0,90,180,270
    flip: axis horizontal or vertical
    crop: roi normalized rectangle
    resize: width and/or height positive
    motion: MotionFilterParameters; supported modes none, highlight, mask
  scope: Runtime validates concrete parameters and rejects unknown or unsupported keys with 422. These definitions
    are normative; filters are applied in stage order. Motion resets on source discontinuity and lighting-change
    behavior is implementation-specific and disclosed via capabilities.
x-opal-event-contract:
  envelope: OPAL suite BusEvent versioned envelope; topic frame + JSON body with data.metadata and correlation IDs.
  example_topics:
  - opal.look.observation
  - opal.look.condition.matched
  - opal.look.monitor.failed
  rules: Disabled by default, explicitly allowlisted, bounded drop-newest queue; never blocks source or inference;
    best effort only.
x-opal-context-standard:
  version: '1.3'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  id_format: opaque-printable-ascii-1-to-128
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  pagination:
    configuration: none
    history: cursor
    ordering: newest-first-then-id-tiebreak
  session_mode: context-only
  streaming: HTTP context headers precede bytes; SSE streams carry monotonic per-session event IDs and
    Last-Event-ID resume from a bounded cache (expired cursor returns 409); backpressure drops frames
    instead of unbounded buffering; no unlimited replay.
