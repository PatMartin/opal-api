openapi: 3.1.0
info:
  title: OPAL Look — MVP Plus Visual Observation API
  version: 1.7.1
  description: |
    Clean-cut replacement contract for OPAL Look. Video-only RTSP streams work
    with no AI engine installed; YOLO, RF-DETR, RT-DETR and D-FINE are optional
    discoverable adapters. Single-image prediction requires a selected engine.
    SSE stream metadata and plain MJPEG viewing are required; annotated overlays
    are optional. Retains OPAL Suite Kernel conventions for errors, auth,
    correlation and HTTP semantics. No opal-devices dependency. This is a
    CONTRACT, not a running service.

    OPAL suite conventions:
    - /api/v1 namespace, trailing slash on collection roots, 201+Location for
      creation, 202+Location for async admission, 204 for empty deletion.
    - X-Opal-Session-Id is a logical context identifier, not a server-managed
      session or an authorization grant. X-Opal-Transaction-Id traces one
      logical operation; X-Opal-Request-Id is per HTTP hop;
      X-Opal-Causation-Id names the immediate causal parent. Missing
      transaction/request IDs are generated server-side and returned on every
      response, including errors and stream preambles. IDs are opaque
      printable ASCII tokens of 1..128 chars; invalid client values yield 422.
    - Single-setting GET/PUT/DELETE and collection GET/PATCH use strong
      portable-configuration ETags with mandatory If-Match on mutation:
      428 if missing, 412 if stale.
    - Bounded configuration catalogs return full arrays; no pagination.
    - Stream SSE supports bounded replay via Last-Event-ID; stale replay
      returns 409. MJPEG video and snapshots are live-only with no replay.
    - Credentials are configured as references; RTSP source URIs are never
      echoed back with userinfo in responses, events, or error details.
      Non-loopback bindings require REST authentication.
  license:
    name: Internal use
servers:
- url: http://127.0.0.1:8082
  description: Illustrative local endpoint; actual bind address and port are configurable.
tags:
- name: engines
  description: Optional inference engine discovery and enablement. Engines are installed on the host, never created through this API.
- name: models
  description: Engine-owned model lifecycle (list, show, load, unload).
- name: predict
  description: Static single-image inference; requires a selected engine and model.
- name: hardware
  description: Engine-local compute devices (cpu, gpu, accelerator).
- name: streams
  description: Ephemeral RTSP video-only or inference sessions with SSE metadata, MJPEG viewing, snapshots and metrics.
- name: settings
  description: Service settings with per-key management.
- name: profiles
  description: Reusable configuration profiles; exactly one may be active.
- name: backup
  description: Backup, restore, import, export, and validate service configuration.
- name: info
  description: Service identity, version and liveness probes.
- name: health
  description: Service readiness and health information.
- name: service
  description: Service process lifecycle (start, stop, log tail).
security:
- BearerAuth: []
paths:
  /api/v1/engine/:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/engines_collection'
    x-opal-cli:
      get:
        group: engine
        command: list
  /api/v1/engine/{engine_id}:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/engine_item'
    x-opal-cli:
      get:
        group: engine
        command: show
      patch:
        parent: config
        group: engine
        command: update
  /api/v1/engine/discover:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - engines
      summary: Discover installed engine adapters
      description: 'Scan the host for installed inference adapters and report which
        are usable. An empty engine catalog is healthy: video-only streams work
        with zero installed engines. Discovery never installs, downloads, or
        removes engines.'
      operationId: discover_engines
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Engine discovery result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineDiscovery'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      x-opal-cli:
        group: engine
        command: discover
  /api/v1/engine/{engine_id}/capabilities:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/EngineId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - engines
      summary: Engine capabilities
      description: 'Return the selected engine''s advertised capability schema:
        supported tasks, accepted engine_options keys, and device types.'
      operationId: show_engine_capabilities
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Engine capability description.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: engine
        command: capabilities
  /api/v1/model/:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - models
      summary: List available models
      description: 'List models owned by discovered engines. The catalog is bounded
        and returned in full; filter optionally by engine_id.'
      operationId: list_models
      parameters:
      - name: engine_id
        in: query
        required: false
        description: If supplied, return only models owned by this engine.
        schema:
          type: string
          minLength: 1
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: model
        command: list
  /api/v1/model/{model_id}:
    parameters:
    - $ref: '#/components/parameters/ModelId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - models
      summary: Show model
      description: Return one model registration.
      operationId: show_model
      parameters:
      - name: engine_id
        in: query
        required: false
        description: Disambiguate when model_id is not unique across engines.
        schema:
          type: string
          minLength: 1
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Model details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: model
        command: show
  /api/v1/model/{model_id}/load:
    parameters:
    - $ref: '#/components/parameters/ModelId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - models
      summary: Load model
      description: 'Load model weights into the owning engine so the model can serve
        predict and stream inference requests. Idempotent: loading an already
        loaded model returns its current state.'
      operationId: load_model
      parameters:
      - name: engine_id
        in: query
        required: false
        description: Disambiguate when model_id is not unique across engines.
        schema:
          type: string
          minLength: 1
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Model state after load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      x-opal-cli:
        group: model
        command: load
  /api/v1/model/{model_id}/unload:
    parameters:
    - $ref: '#/components/parameters/ModelId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - models
      summary: Unload model
      description: 'Release model weights from the owning engine. Returns 409 when
        the model is in use by an active stream.'
      operationId: unload_model
      parameters:
      - name: engine_id
        in: query
        required: false
        description: Disambiguate when model_id is not unique across engines.
        schema:
          type: string
          minLength: 1
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Model state after unload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      x-opal-cli:
        group: model
        command: unload
  /api/v1/predict:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - predict
      summary: Run single-image detection
      description: 'Run one inference pass over a single image. Inference-only:
        engine_id and model_id are required; engine-free operation applies to
        stream sessions, not predict.'
      operationId: predict_image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Detection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResult'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '413':
          $ref: './shared/opal_kernel.yaml#/components/responses/PayloadTooLarge'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: './shared/opal_kernel.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      x-opal-cli:
        group: predict
        command: image
  /api/v1/hardware/:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - hardware
      summary: List engine-local compute devices
      description: 'List compute devices usable by engines on this host. These are
        engine-local execution targets, not globally federated OPAL Devices.'
      operationId: list_hardware
      parameters:
      - name: engine_id
        in: query
        required: false
        description: If supplied, return only devices usable by this engine.
        schema:
          type: string
          minLength: 1
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Engine-local compute devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hardware'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: hardware
        command: list
  /api/v1/hardware/{device_id}:
    parameters:
    - $ref: '#/components/parameters/DeviceId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - hardware
      summary: Show engine-local hardware
      description: Return one engine-local compute device.
      operationId: show_hardware
      parameters:
      - name: engine_id
        in: query
        required: false
        description: Disambiguate when device_id is reported per engine.
        schema:
          type: string
          minLength: 1
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Device details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hardware'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: hardware
        command: show
  /api/v1/stream/:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - streams
      summary: Start an ephemeral video-only or inference RTSP session
      description: 'A missing or null engine_id creates a normal video-only
        session. A specified engine_id requires model_id. Admission returns 202
        with Location. Never starts a second decode just for viewers.'
      operationId: start_stream
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamStartRequest'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '202':
          description: Stream accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStatus'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            Location:
              $ref: './shared/opal_kernel.yaml#/components/headers/Location'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: './shared/opal_kernel.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      x-opal-cli:
        group: stream
        command: start
    get:
      tags:
      - streams
      summary: List active RTSP streams
      description: 'List active ephemeral streams, video-only and inference. The
        collection is bounded by stream admission limits and returned in full.'
      operationId: list_streams
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Active streams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamStatus'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: stream
        command: list
  /api/v1/stream/{stream_id}:
    parameters:
    - $ref: '#/components/parameters/StreamId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - streams
      summary: Show stream status
      description: Return the current status record of one stream.
      operationId: show_stream
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Stream status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStatus'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: stream
        command: show
  /api/v1/stream/{stream_id}/stop:
    parameters:
    - $ref: '#/components/parameters/StreamId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - streams
      summary: Stop RTSP stream
      description: 'Stop a stream and release its decode and inference resources.
        Returns 409 when the stream is already stopped or stopping. Stopping
        emits a terminal SSE event to active watchers.'
      operationId: stop_stream
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Stream status after stop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStatus'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: stream
        command: stop
  /api/v1/stream/{stream_id}/events:
    parameters:
    - $ref: '#/components/parameters/StreamId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - streams
      summary: Watch live detection events (SSE)
      description: 'Required Server-Sent Events carrying typed StreamEvent JSON.
        Video mode emits frame/status/terminal metadata without detections;
        inference mode additionally emits detection events. IDs monotonically
        increase within a stream; Last-Event-ID supports bounded replay, stale
        replay returns 409; heartbeat comments; terminal event on stop. A
        watcher disconnect does not stop the stream.'
      operationId: watch_stream
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Server-Sent Events containing typed StreamEvent JSON.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Each `data:` frame is one JSON-serialized
                  stream event object with `event_type` (frame |
                  detection | status | heartbeat | terminal) plus
                  type-specific fields such as `frame`, `detections`,
                  `dropped_frames`, `processing_ms`, and `status`.'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: stream
        command: watch
  /api/v1/stream/{stream_id}/video:
    parameters:
    - $ref: '#/components/parameters/StreamId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - streams
      summary: Watch plain or optionally annotated MJPEG video
      description: 'Required multipart/x-mixed-replace MJPEG in both modes:
        plain frames in video-only sessions, optional annotated frames in
        inference sessions. This GET never starts processing. Requesting an
        annotation the active session does not support yields 422, never a
        failure of basic viewing.'
      operationId: watch_stream_video
      parameters:
      - name: annotated
        in: query
        required: false
        description: 'Request bounding-box overlays; only valid in inference
          sessions whose engine supports annotation.'
        schema:
          type: boolean
          default: false
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Plain or annotated MJPEG video.
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: stream
        command: watch-video
  /api/v1/stream/{stream_id}/snapshot:
    parameters:
    - $ref: '#/components/parameters/StreamId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - streams
      summary: Get latest available frame without creating inference
      description: 'Read-only frame snapshot; returns the exact available frame
        or 404/409. No side-effectful capture or source connection. Unannotated
        in video-only mode; annotation can be requested only if supported by the
        active inference session. No RTSP credentials in metadata.'
      operationId: get_stream_snapshot
      parameters:
      - name: annotated
        in: query
        required: false
        description: Request an annotated frame; only valid in inference sessions whose engine supports annotation.
        schema:
          type: boolean
          default: false
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: JPEG of latest available decoded frame.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: stream
        command: snapshot
  /api/v1/stream/{stream_id}/metrics:
    parameters:
    - $ref: '#/components/parameters/StreamId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - streams
      summary: Read current stream performance metrics
      description: 'Read-only metrics. In video-only mode inference_latency_ms
        is null. GET never initiates decode or AI work.'
      operationId: get_stream_metrics
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Stream metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamMetrics'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: stream
        command: metrics
