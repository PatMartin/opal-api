  /api/v1/media/:
    post:
      tags:
      - media
      summary: Upload image or video
      description: Multipart field file contains one image/video. Required baseline image formats JPEG and 
        PNG; required baseline video container MP4 with H.264 when decoder is installed. Supported 
        containers/codecs and effective limits are advertised in health.media_capabilities. Validate actual 
        bytes and decoded limits, not just filename/MIME. Reject corrupt or undecodable media with 422. Video 
        is stored completely before 201; no progressive upload analysis. Body size limit defaults to 1 GiB. 
        EXIF orientation is applied before analysis.
      operationId: post_api_v1_media
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRead'
          headers:
            Location:
              description: Resource URL
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          multipart/form-data:
