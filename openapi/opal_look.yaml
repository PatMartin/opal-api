            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong ETag for the complete logical configuration after this operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalSingleSetting'
