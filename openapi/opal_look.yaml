          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/OpalError422'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: rule_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: monitor_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: source_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: session_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
