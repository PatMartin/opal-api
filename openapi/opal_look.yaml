    CaptureRead:
      type: object
      additionalProperties: false
      properties:
        capture_id:
          $ref: '#/components/schemas/Identifier'
        source_id:
          $ref: '#/components/schemas/Identifier'
        captured_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        content_type:
          type: string
          const: image/jpeg
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        size_bytes:
          type: integer
          minimum: 1
        position_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - capture_id
      - source_id
      - captured_at
      - created_at
      - expires_at
      - content_type
      - width
      - height
      - size_bytes
      - position_ms
      description: Retained camera frame; not linked to an inference result. Source capture retention is 
        independent of result metadata and uploaded media.
    CaptureFrameInput:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: capture
        capture_id:
          $ref: '#/components/schemas/Identifier'
      required:
      - kind
      - capture_id
      description: Analyze a previously retained camera capture without re-accessing the source.
    MonitorRestartPolicy:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: true
        initial_delay_ms:
          type: integer
          minimum: 100
          default: 1000
        max_delay_ms:
          type: integer
          minimum: 100
          default: 60000
        max_attempts:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        reset_after_seconds:
          type: integer
          minimum: 1
          default: 300
      description: Crash/reconnect restart policy for persistent monitors. max_attempts=null means unlimited 
        retries with exponential backoff. Zero means no attempts. max_delay_ms >= initial_delay_ms. Backoff 
        resets after a run stable for reset_after_seconds. Never retry finite EOF/completion automatically. 
        Repeated invalid configuration leaves monitor degraded, not a tight restart loop.
    MonitorCreate:
      type: object
      additionalProperties: false
      properties:
        monitor_id: &id008
          $ref: '#/components/schemas/Identifier'
        name: &id001
          type: string
          minLength: 1
        source_id: &id002
          $ref: '#/components/schemas/Identifier'
        profile_id: &id003
          type: integer
          minimum: 1
        enabled: &id004
          type: boolean
          default: true
        desired_state: &id005
          type: string
          enum:
          - running
          - stopped
          default: running
        restart: &id006
          $ref: '#/components/schemas/MonitorRestartPolicy'
        prebuffer_seconds: &id007
          type: integer
          minimum: 0
          default: 0
      required:
      - monitor_id
      - name
      - source_id
      - profile_id
      description: Durable desired work. Only live sources are allowed for always-on monitors. Profile must 
        remain compatible with source. prebuffer_seconds enables bounded per-source rolling encoded-video 
        buffer for clip extraction, independent of active recording; 0 disables it. Do not silently activate 
        an engine or download models.
    MonitorUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id001
        source_id: *id002
        profile_id: *id003
        enabled: *id004
        desired_state: *id005
        restart: *id006
        prebuffer_seconds: *id007
      description: Atomic config patch; omitted fields unchanged. Updates affect future sessions; a running 
        session keeps its immutable resolved settings. For immediate change, stop then start. All writes 
        require global If-Match.
    MonitorRead:
      type: object
      additionalProperties: false
      properties:
        monitor_id: *id008
        name: *id001
        source_id: *id002
        profile_id: *id003
        enabled: *id004
        desired_state:
          type: string
          enum:
          - running
          - stopped
        restart: *id006
        prebuffer_seconds: *id007
        state:
          type: string
          enum:
          - stopped
          - starting
          - running
          - degraded
          - backoff
        current_session_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        last_session_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        last_error:
          anyOf:
          - $ref: '#/components/schemas/OpalError'
          - type: 'null'
        next_retry_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        restart_attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
      required:
      - monitor_id
      - name
      - source_id
      - profile_id
      - enabled
      - restart
      - prebuffer_seconds
      - desired_state
      - state
      - current_session_id
      - last_session_id
      - last_error
      - next_retry_at
      - restart_attempts
      - created_at
      description: A persistent supervisor reconciles desired_state with actual sessions after restart. A 
        monitor-created analysis session has normal v1.4 SessionRead lifecycle; interrupted session itself is 
        marked failed and never resurrected. New session_id is assigned on restart. Runtime state updates do 
        not advance global ETag.
    ZoneCreate:
      type: object
      additionalProperties: false
      properties:
        zone_id: &id013
          $ref: '#/components/schemas/Identifier'
        source_id: &id009
          $ref: '#/components/schemas/Identifier'
        name: &id010
          type: string
          minLength: 1
        polygon: &id011
          type: array
          items:
            $ref: '#/components/schemas/Point'
          minItems: 3
        enabled: &id012
          type: boolean
          default: true
      required:
      - zone_id
      - source_id
      - name
      - polygon
      description: Polygon normalized to oriented source frame (min 3 non-self-intersecting points; first 
        vertex not repeated). Direction-independent. Geometry edits do not alter historical observations. 
        Validate polygon winding, self-intersections and nonzero area at service layer.
    ZoneUpdate:
      type: object
      additionalProperties: false
      properties:
        source_id: *id009
        name: *id010
        polygon: *id011
        enabled: *id012
      description: Partial zone update; cannot change source_id while referenced by a rule. Omitted values 
        unchanged.
    ZoneRead:
      type: object
      additionalProperties: false
      properties:
        zone_id: *id013
        source_id: *id009
        name: *id010
        polygon: *id011
        enabled: *id012
        created_at:
          type: string
          format: date-time
      required:
      - zone_id
      - source_id
      - name
      - polygon
      - enabled
      - created_at
    LineCreate:
      type: object
      additionalProperties: false
      properties:
        line_id: &id019
          $ref: '#/components/schemas/Identifier'
        source_id: &id014
          $ref: '#/components/schemas/Identifier'
        name: &id015
          type: string
          minLength: 1
        a: &id016
          $ref: '#/components/schemas/Point'
        b: &id017
          $ref: '#/components/schemas/Point'
        enabled: &id018
          type: boolean
          default: true
      required:
      - line_id
      - source_id
      - name
      - a
      - b
      description: Oriented line segment in normalized original coordinates; a != b. a_to_b means crossing 
        from left side of directed vector a->b to right, using signed cross-product; b_to_a is reverse. 
        Endpoints define finite segment; crossing outside segment does not trigger. Coordinates follow 
        oriented source frame.
    LineUpdate:
      type: object
      additionalProperties: false
      properties:
        source_id: *id014
        name: *id015
        a: *id016
        b: *id017
        enabled: *id018
    LineRead:
      type: object
      additionalProperties: false
      properties:
        line_id: *id019
        source_id: *id014
        name: *id015
        a: *id016
        b: *id017
        enabled: *id018
        created_at:
          type: string
          format: date-time
      required:
      - line_id
      - source_id
      - name
      - a
      - b
      - enabled
      - created_at
    ObservationCondition:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - presence
          - count_at_least
          - enter
          - exit
          - line_cross
          - occupancy_changed
        zone_id:
          $ref: '#/components/schemas/Identifier'
        line_id:
          $ref: '#/components/schemas/Identifier'
        min_count:
          type: integer
          minimum: 1
          default: 1
        direction:
          type: string
          enum:
          - either
          - a_to_b
          - b_to_a
          default: either
      required:
      - kind
      description: presence/count_at_least may optionally scope to zone_id and do not require tracking. 
        enter/exit require zone_id and tracking. line_cross requires line_id and tracking. occupancy_changed 
        requires zone_id and tracking; it means change in estimated concurrently present tracked-object count,
        NOT cumulative unique people or accurate physical occupancy across resets. Reject irrelevant fields 
        (422); geometry source must match monitor source. Per-epoch reset clears track history, and no 
        synthetic enter/exit/line crossing may be inferred after a discontinuity.
    TriggerClipPolicy:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          default: false
        before_seconds:
          type: integer
          minimum: 0
          default: 10
        after_seconds:
          type: integer
          minimum: 0
          default: 20
      description: When rule fires, optionally request a bounded clip from source rolling buffer. Requires 
        monitor.prebuffer_seconds >= before_seconds and enough active buffer history. Failures to create clip 
        are recorded as clip_error, not silently ignored. Clip generation is asynchronous; availability 
        depends on source continuity.
    ObservationRuleCreate:
      type: object
      additionalProperties: false
      properties:
        rule_id: &id029
          $ref: '#/components/schemas/Identifier'
        name: &id020
          type: string
          minLength: 1
        monitor_id: &id021
          $ref: '#/components/schemas/Identifier'
        condition: &id022
          $ref: '#/components/schemas/ObservationCondition'
        class_labels: &id023
          type: array
          items:
            type: string
          uniqueItems: true
          default: []
        min_confidence: &id024
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        min_consecutive_frames: &id025
          type: integer
          minimum: 1
          default: 1
        cooldown_ms: &id026
          type: integer
          minimum: 0
          default: 1000
        clip: &id027
          $ref: '#/components/schemas/TriggerClipPolicy'
        enabled: &id028
          type: boolean
          default: true
      required:
      - rule_id
      - name
      - monitor_id
      - condition
      description: Rule evaluation only on successfully analyzed frames from a detection monitor; class_labels
        empty means all labels. Count/transition outputs stored to durable observations independent of ZeroMQ 
        delivery. No device actions or scripts. Per-rule cooldown; a new tracking epoch clears transitional 
        state and continuity counters. Rules remain configured if the monitor is offline.
    ObservationRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id020
        monitor_id: *id021
        condition: *id022
        class_labels: *id023
        min_confidence: *id024
        min_consecutive_frames: *id025
        cooldown_ms: *id026
        clip: *id027
        enabled: *id028
    ObservationRuleRead:
      type: object
      additionalProperties: false
      properties:
        rule_id: *id029
        name: *id020
        monitor_id: *id021
        condition: *id022
        class_labels: *id023
        min_confidence: *id024
        min_consecutive_frames: *id025
        cooldown_ms: *id026
        clip: *id027
        enabled: *id028
        created_at:
          type: string
          format: date-time
      required:
      - rule_id
      - name
      - monitor_id
      - condition
      - enabled
      - min_confidence
      - min_consecutive_frames
      - cooldown_ms
      - clip
      - created_at
    ObservationRead:
      type: object
      additionalProperties: false
      properties:
        observation_id:
          $ref: '#/components/schemas/Identifier'
        rule_id:
          $ref: '#/components/schemas/Identifier'
        monitor_id:
          $ref: '#/components/schemas/Identifier'
        session_id:
          $ref: '#/components/schemas/Identifier'
        source_id:
          $ref: '#/components/schemas/Identifier'
        result_id:
          $ref: '#/components/schemas/Identifier'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        tracking_epoch:
          type: integer
          minimum: 0
        condition_kind:
          type: string
        class_label:
          anyOf:
          - type: string
          - type: 'null'
        confidence:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        count:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        zone_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        line_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        track_id:
          anyOf:
          - type: string
          - type: 'null'
        direction:
          anyOf:
          - type: string
          - type: 'null'
        clip_recording_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        clip_error:
          anyOf:
          - type: string
          - type: 'null'
        config_revision:
          type: string
      required:
      - observation_id
      - rule_id
      - monitor_id
      - session_id
      - source_id
      - result_id
      - created_at
      - expires_at
      - tracking_epoch
      - condition_kind
      - class_label
      - confidence
      - count
      - zone_id
      - line_id
      - track_id
      - direction
      - clip_recording_id
      - clip_error
      - config_revision
      description: Durable normalized observation suitable for history backfill when best-effort ZeroMQ 
        notifications are lost. Contains no raw frame, path, credentials, OCR text or personal identification.
        Track ID only valid within session_id and tracking_epoch. 1:1 rule firing, no promise that every 
        source frame was analyzed. clip_recording_id may become available later; clip_error reports failed 
        trigger clip requests.
    RecordingCreate:
      type: object
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/Identifier'
        duration_seconds:
          type: integer
          minimum: 1
        include_audio:
          type: boolean
          default: false
        name:
          type: string
          minLength: 1
      required:
      - source_id
      description: 'Begin manual independent source recording. Source can be live or finite; no vision session/model
        needed. duration_seconds omitted means until explicit stop, bounded by max_recording_seconds setting. Video
        codec/container from installed media capabilities; fail with 415 if no supported encoder. No silent audio
        capture: include_audio=false default; true requires explicit capability and source permission.'
    ClipCreate:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - recording_range
          - buffer_window
        recording_id:
          $ref: '#/components/schemas/Identifier'
        start_position_ms:
          type: integer
          minimum: 0
        end_position_ms:
          type: integer
          minimum: 1
        source_id:
          $ref: '#/components/schemas/Identifier'
        center_at:
          type: string
          format: date-time
        before_seconds:
          type: integer
          minimum: 0
          default: 10
        after_seconds:
          type: integer
          minimum: 0
          default: 20
        name:
          type: string
          minLength: 1
      required:
      - kind
      description: For kind=recording_range require recording_id/start_position_ms/end_position_ms, with 
        end>start and <= existing completed recording length. For kind=buffer_window require 
        source_id/center_at and enough active rolling buffer; allow future after_seconds to finish 
        asynchronously. Reject incompatible fields (422). Both create independent retained recordings 
        (kind=clip), do not mutate original. A clip requested from missing/expired buffer returns 409 
        buffer_unavailable and MUST NOT substitute new frames. Clock is UTC; frame timestamps come from 
        capture timestamps, with tolerated encoding keyframe adjustments reported as effective bounds.
    RecordingRead:
      type: object
      additionalProperties: false
      properties:
        recording_id:
          $ref: '#/components/schemas/Identifier'
        kind:
          type: string
          enum:
          - manual
          - clip
        source_id:
          $ref: '#/components/schemas/Identifier'
        parent_recording_id:
          anyOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
        state:
          type: string
          enum:
          - starting
          - recording
          - waiting_postbuffer
          - finalizing
          - completed
          - failed
        created_at:
          type: string
          format: date-time
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expires_at:
          type: string
          format: date-time
        content_type:
          type: string
          const: video/mp4
        size_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        requested_start_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        requested_end_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        effective_start_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        effective_end_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/OpalError'
          - type: 'null'
        has_audio:
          type: boolean
          default: false
      required:
      - recording_id
      - kind
      - source_id
      - parent_recording_id
      - name
      - state
      - created_at
      - started_at
      - finished_at
      - expires_at
      - content_type
      - size_bytes
      - duration_ms
      - requested_start_at
      - requested_end_at
      - effective_start_at
      - effective_end_at
      - error
      - has_audio
      description: Only completed recordings have downloadable bytes; 409 during other states and 410 after 
        expiry. Explicit stop finishes/finalizes manual recordings; a failed recording remains inspectable 
        until retention. Separate TTL from uploaded media/results. Successful trigger clips are retained 
        independently and indexed by originating observation when applicable.
  parameters:
    OpalSessionIdHeader:
      name: X-Opal-Session-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalTransactionIdHeader:
      name: X-Opal-Transaction-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalRequestIdHeader:
      name: X-Opal-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalCausationIdHeader:
      name: X-Opal-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalLookIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong global configuration ETag or explicit '*'. Missing=428, invalid=422, stale=412. 
        Checks and mutations atomic.
      schema:
        type: string
        minLength: 1
  headers:
    OpalSessionIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
    OpalTransactionIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
    OpalRequestIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
    OpalCausationIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
x-opal-context-standard:
  version: 1.4.0
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only headers; independent background analysis-session resources
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    propagate:
    - session_id
    - transaction_id
    - request_id
    - causation_id
    zero_mq_frames: 2
    context_location: data.metadata
  pagination:
    history: cursor
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  streaming: Include HTTP context headers before bytes; after headers are sent, failures are represented by 
    transport-specific terminal events or stream termination; no invented resumability.
