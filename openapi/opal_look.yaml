  /api/v1/sources/{source_id}/stream:
    parameters:
    - name: source_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    get:
      tags:
      - sources
      summary: View live source feed without requiring a model or analysis session
      operationId: stream_sources
      x-opal-cli:
        group: sources
        command: stream
      description: GET opens an ephemeral MJPEG viewer connection. In absence of pipeline_id, streams decoded source
        frames only. When pipeline_id is provided, evaluates the configured pipeline for this connection, subject
        to bounded shared resources. Closing connection releases viewer-specific processing; does not stop independent
        sessions/monitors. Does not persist observations, captures, or recordings. Overlay and filters are chosen
        at request start; change URL to change settings. The server may share decoded frames and inference work
        but must isolate presentation settings. Stream termination after headers is by clean close; clients reconnect
        using their own policy. Backpressure drops frames instead of unlimited buffering. Unauthorized/unsupported
        network access forbidden. No claim of synchronized SSE overlays.
      parameters:
      - $ref: '#/components/parameters/OpalSessionIdHeader'
      - $ref: '#/components/parameters/OpalTransactionIdHeader'
      - $ref: '#/components/parameters/OpalRequestIdHeader'
      - $ref: '#/components/parameters/OpalCausationIdHeader'
      - name: annotations
        in: query
        schema:
          type: boolean
          default: false
        description: Source-only stream is unannotated by default. For annotated streaming, supply pipeline_id;
          no new inference session is created explicitly by the caller.
      - name: pipeline_id
        in: query
        schema:
          type: string
      - name: classes
        in: query
        description: Comma-separated class names to display (presentation only).
        schema:
          type: string
      - name: min_confidence
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: show_labels
        in: query
        schema:
          type: boolean
          default: true
      - name: show_boxes
        in: query
        schema:
          type: boolean
          default: true
      - name: show_confidence
        in: query
        schema:
          type: boolean
          default: true
      - name: target_fps
        in: query
        schema:
          type: number
          minimum: 0.1
      - name: width
        in: query
        schema:
          type: integer
          minimum: 1
      - name: height
        in: query
        schema:
          type: integer
          minimum: 1
      - name: quality
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: presentation_filter
        in: query
        description: One portable presentation filter encoded as compact JSON FilterSpec. Multiple filters belong
          in a pipeline.
        schema:
          type: string
      responses:
        '200':
          description: Multipart motion JPEG; stream remains open until disconnect, EOS or error.
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
x-opal-filter-catalog:
  portable_filters:
    grayscale: No parameters
    brightness_contrast: brightness [-1,1], contrast [0,4]
    blur: kernel_size odd integer [3,31]
    sharpen: amount [0,3]
    threshold: threshold [0,255]
    edges: low_threshold [0,255], high_threshold [0,255] with low<=high
    rotate: degrees one of 0,90,180,270
    flip: axis horizontal or vertical
    crop: roi normalized rectangle
    resize: width and/or height positive
    motion: MotionFilterParameters; supported modes none, highlight, mask
  scope: Runtime validates concrete parameters and rejects unknown or unsupported keys with 422. These definitions
    are normative; filters are applied in stage order. Motion resets on source discontinuity and lighting-change
    behavior is implementation-specific and disclosed via capabilities.
