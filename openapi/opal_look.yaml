openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OPAL Look API
  version: 1.4.0
  description: 'Implementation-neutral vision service for the OPAL suite, complementary to OPAL Listen and OPAL
    Talk. This OpenAPI contract is the public source of truth for REST, CLI and SPA behavior. No particular vision
    library, decoder, camera API, model layout or remote provider is required by clients. Ultralytics YOLO is an
    example adapter, not a mandatory public abstraction.


    Version 1 scope:

    * Class-level detection, image classification, instance/semantic segmentation, pose estimation and OCR. Optional
    detection tracking supplies temporary session/epoch identities, never recognition of particular people or objects.

    * Engines are installed/discovered by the implementation and may execute locally or through remote services.
    Each advertises capabilities; an engine/model need not support every task. Unknown or unsupported controls MUST
    be rejected, never silently ignored.

    * Models register already-present host resources or existing remote model references. No downloads, training,
    model uploads, installations or deletion of host assets.

    * Sources describe host cameras (including USB/Pi adapters), RTSP, HTTP/MJPEG feeds, host videos and uploaded
    video media. Uploaded still images go directly to analyze. Client devices are not server cameras; browser capture
    must upload stills or use an explicitly configured supported source.

    * One-shot analysis is synchronous. Continuous/video analysis uses independent sessions with one model and one
    task per session. Multiple concurrent sessions may share sources subject to device/runtime capacity. Only detection
    sessions may enable tracking.

    * Reusable profiles are source-independent. At most one is active. Explicit request overrides resolve over explicit/active
    profile, then defaults. Sessions snapshot resolved settings at creation.

    * Structured results stream through SSE and optionally persist in searchable history (default on). Retention
    is seven days for results, 24 hours for uploaded media, seven days for explicitly retained snapshots. Expiration
    clocks are independent. No recording or image retention from analysis itself; v1.4 supports explicit recording
    and opt-in rule-triggered clips. frame cache and SSE replay are bounded ephemeral caches, not durable storage.

    * Raw/annotated JPEG snapshots and an annotated MJPEG preview are available. Historical metadata does not guarantee
    source-frame bytes remain available. A request for an evicted exact frame fails rather than substituting a newly
    captured frame.

    * Coordinates are normalized against the original decoded, orientation-corrected frame, never inference resizing/padding.
    Masks are at original dimensions and use explicitly specified row-major RLE. Scores are model-derived and not
    generally comparable across engines/models.

    * Settings, health and backup/import/export follow the OPAL suite operational pattern. Configuration backup
    excludes secrets, model/media/snapshot bytes, result history and runtime sessions.

    * Internal service, no built-in authentication in this contract. Secrets are provisioned out of band and referenced.
    Bind locally by default; deployment controls access, host-path permissions and remote-source restrictions. Remote
    adapters may transmit source frames to the configured provider.

    * In v1.4, Look supports zones, line-crossing, object observation rules and recording; downstream actions and
    identity recognition remain external.


    Workflow: discover engines -> register models -> register a source or upload media -> create a compatible profile
    -> POST analyze or POST sessions -> consume SSE/preview/history -> stop a live session -> delete terminal session/media
    when desired. Uploaded videos become media-backed sources. Discovery/validation never performs implicit installation
    or downloads.


    HTTP conventions: collections end in / to match OPAL sister contracts; clients use exactly the listed routes
    rather than relying on redirects. Configuration POST returns 201; session admission returns 202 with Location.
    Delete returns 204. Validation operations return 200 with valid=false for completed checks. All HTTP errors
    use the shared OpalError envelope; validation failures use 422 with field diagnostics under error.details.detail.
    GET results never triggers inference. Mutations are atomic. Session creation supports optional Idempotency-Key;
    other non-idempotent POST retries may create duplicates. Responses may gain additive fields in future versions;
    clients should tolerate them, while requests reject unknown portable fields.



    RECONCILED OPAL 1.4.0 — NORMATIVE

    This release aligns with opal_listen_v1.3.0.yaml (the listener service) and opal_event_v1.3.0.yaml from the
    current suite bundle. It resolves conflicting older prose/schema overlays instead of simply retagging their
    versions. Existing vision functionality, retention defaults, engine-specific options and task payloads remain
    unchanged. OpenAPI version, configuration format and example service version are 1.4.0. /api/v1 remains the
    HTTP base. Transport-specific behavior and internal no-built-in-auth deployment remain as agreed; access controls
    belong to deployment. The event v2 review fragment is not part of this active wire profile.


    CORRELATION

    Optional X-Opal-Session-Id carries workflow context and does NOT create/identify a background analysis session.
    Explicit session resource identifiers retain their own independent lifecycle. X-Opal-Transaction-Id denotes
    one logical end-to-end operation, not an atomic distributed transaction. Missing transaction context is generated.
    X-Opal-Request-Id identifies the HTTP exchange; a service generates a fresh local ID for each hop and may preserve
    the inbound identifier for diagnostics/causation. X-Opal-Causation-Id identifies the immediate originating request/event
    where known. All are opaque 1..128 printable non-whitespace ASCII tokens; invalid inbound values return 422.
    All responses, including errors, binary bodies and stream headers, return effective transaction/request IDs,
    plus session/causation IDs when known. Entry-point analysis may generate logical session context where a workflow
    needs it. Logical correlation context is independent of the persistent analysis-session lifecycle. SSE
    subscribers use their own HTTP request headers; published events use optional data.metadata.
    Idempotent admission replay returns the original snapshot/body but fresh retry-exchange correlation headers.
    Context values never confer privileges.


    ERRORS

    Every HTTP operational and validation error uses {error:{code,message,request_id,transaction_id,session_id?,causation_id?,details?}}.
    The request/transaction fields match effective X-Opal headers; validation field locations use error.details.detail
    arrays of loc/msg/type. Do not expose secrets or raw model/media content in diagnostics. SSE error data uses
    the same OpalError shape with originating execution context; after stream headers, failures are in-band and
    do not change HTTP status. Health probe 503 is deliberately a probe-status body rather than an operational error.
    All public errors directly reference OpalError; unused legacy error/setting definitions were removed.


    SETTINGS AND REVISIONS

    GET/PATCH /api/v1/settings/ returns/patches typed portable settings atomically. GET/PUT/DELETE /api/v1/settings/{key}
    acts on a scalar leaf; PUT uses native JSON {value:...}, GET returns {key,value}, DELETE removes an override
    and falls back to its documented default (204), or 409 if required effective configuration would become invalid.
    Unknown keys return 404. Bulk PATCH manages array settings; unknown fields/types return 422. Configuration catalogs
    are unpaginated arrays; histories use items/next_cursor/has_more. has_more is exactly next_cursor != null. History
    cursors bind to exact filters, use deterministic newest-first ordering with a stable identifier tie-break, expire
    explicitly (410) and reject filter mismatch (422).

    All logical configuration (engines/models/sources/profiles/settings) shares an opaque strong ETag. GET resources/catalogs/settings/backup-export
    returns it; successful writes return the new revision, including empty 204. Configuration create/update/delete,
    profile activation, settings changes, imports and restores require If-Match: missing 428; nonmatching 412; malformed,
    weak, wildcard or multi-tag values 422. Check and mutation are atomic, including external file edits. Revision
    failure performs no mutation. Reads/validation, uploads, inference, session admission/stop and result/snapshot
    history deletion are not configuration edits and do not require If-Match. Import/restore never restore an old
    revision. Runtime transitions do not advance revision; no-op writes may retain it. Atomic import retains the
    existing safety prohibition on in-flight analysis/nonterminal sessions. Configuration exports contain no history,
    runtime context, secret values or media/model/snapshot bytes. Configuration export v1.2.0 includes durable monitors,
    geometry, and observation rules; imports accept supported older formats.


    HEALTH AND STREAMING

    Canonical probes are GET /api/v1/health/live and /api/v1/health/ready (200 when usable, 503 when unavailable);
    detailed GET /api/v1/health/ returns diagnostic readiness. Existing root health/info remain compatibility routes.
    Optional publisher outage may degrade diagnostic health without failing core vision readiness. SSE uses text/event-stream,
    bounded Last-Event-ID replay and 410 on expired replay. Disconnecting preview/events never stops a background
    session. MJPEG/binary responses carry correlation headers; historical metadata does not imply retained imagery.
    Exact-frame snapshot and cache semantics remain unchanged.


    EVENT PUBLICATION — ACTIVE OPAL-EVENT COMPATIBILITY

    Disabled by default; existing portable events_enabled, event_topics_allowlist, max_analysis_events_per_second
    and event_queue_capacity controls are retained. Exactly two ZeroMQ frames: UTF-8 topic and UTF-8 JSON BusEvent,
    together at most 1,048,576 bytes. Topic frame equals envelope.topic; id is a UUID; timestamp UTC RFC3339; source
    opal-look. Events follow the existing two-frame ZeroMQ BusEvent contract. Optional OPAL correlation metadata
    travels in data.metadata; no top-level metadata is permitted.


    SESSION ADMISSION RETRIES

    POST /api/v1/sessions/ returns 202 + Location, including immediately terminal admitted work. Optional service-scoped
    Idempotency-Key is durably retained 24 hours from successful admission. Fingerprint canonical submitted JSON
    independent of object key order, preserving array order and distinguishing omitted defaults/null. Reservation
    and admission are atomic; concurrent identical retries create one session. Rejected admission does not reserve
    a key. Same key plus different content returns 409 idempotency_conflict. Identical retry returns the original
    admission snapshot and Location, not current session state; use GET for current state. Profile/default resolution
    happens once. Deleted original session yields 409 idempotency_resource_deleted without recreation. Expired keys
    may be reused. Replay never re-resolves defaults, consumes capacity or publishes duplicate lifecycle notifications.
    Session records and retry records have independent retention. Other POST operations do not gain this guarantee.


    VERSION 1.4.0 — ANNOTATED EXPORTS AND ARTIFACTS

    Selected review changes: OpenAPI hygiene; corrected session transition races; precise single-setting/bulk PATCH
    rules; finite annotated-video export jobs; independent generated artifacts. Other review proposals (settings
    request/resolved schema split, new identity policy, event-v2 migration, camera sharing guarantees, browser SSE
    redesign) are not adopted.

    Export pipeline: registered finite source -> independent decoder -> per-frame inference -> task overlay -> MP4/H.264
    encoder -> atomic artifact publication. Original decoded orientation and dimensions are preserved; yuv420p-compatible
    odd dimensions may use explicitly reported one-pixel right/bottom padding (never rescale original coordinates).
    Decode every frame; rebase presentation timestamps to zero while preserving original inter-frame timing and
    selected-range duration. Variable-frame-rate inputs require encoder support advertised by health.exports; unsupported
    timing returns 422 rather than silently converting to constant FPS. Audio is omitted. Every-frame exports use
    a separate decoder/seek position and never alter a running preview/session. No saved result history is required
    or silently created, so export size does not multiply result retention. Existing MJPEG previews remain ephemeral
    analyzed-frame streams, distinct from downloadable MP4 artifacts.

    Decoder/engine/model/encoder capabilities are checked at admission; runtime loss produces a failed job. Changed/unreadable
    host file, decoder corruption, output byte ceiling and unsupported runtime encoding fail with explicit machine-readable
    code. Duration ceiling from admission includes queued time; expiry becomes timed_out. Encoding failure/cancellation
    discards temporary files. Publish complete bytes and artifact metadata atomically before succeeded; if metadata
    publication fails, mark failed and clean private output. No artifact is exposed while still encoding. Export
    success preserves the completed artifact independently of input expiry or job deletion. Source media pins last
    from admission until terminal; pins prevent physical cleanup but do not make expired media available for new
    jobs. Nonterminal exports block incompatible source/model/engine mutations and bulk import/restore; they do
    not require If-Match themselves because they are runtime work, not configuration writes. Admission snapshots
    retention and capacity/time/byte limits; lowering settings never interrupts admitted jobs. Existing deployments
    may have exports.available=false when the optional encoder is absent; normal vision readiness is unaffected.
    New output dependencies never install codecs or models implicitly.

    New defaults: one simultaneous export, eight queued exports, 3600-second admission-to-terminal deadline, 2 GiB
    artifact ceiling, seven-day terminal-job retention and seven-day completed-artifact retention. Queue overflow
    rejects admission with 429 and does not create a dropped job. Share underlying engine capacity with analysis
    sessions; never exceed service/engine resource limits. Download supports a single HTTP byte range (206), otherwise
    full content (200); invalid range yields 416. Artifact TTL starts at publication; job TTL starts at terminal
    transition. Historical source/model/export identifiers remain filterable after configuration/job deletion. No
    live recording, audio preservation, multiple models per export or automatic re-export in this release.




    OPAL LOOK v1.4.0 ADDITIONS (normative):

    - Capture without inference: GET source frame returns nonretained JPEG. POST source captures with retain=false
    returns JPEG 200; retain=true creates CaptureRead 201. Captures have independent retention and may be inputs
    to /api/v1/analyze. No source access or decoder success is implied by registration.

    - Recording is independent of analysis. Manual recording and clip extraction are distinct from transient MJPEG
    previews and exact-result snapshots. Manual recording starts explicitly; clips may be requested from completed
    recordings or bounded rolling per-source capture buffers. Never invent absent pre-event footage. Creation is
    async (202); download exists only after completion. An observation rule can opt in to a clip; this is the only
    automatic clip creation, and no audio is captured unless explicitly requested and supported. Recording retention
    is independent of result, media, capture and snapshot lifetimes.

    - Durable monitors define desired always-on analysis. They reconcile by creating ordinary immutable analysis
    sessions; an interrupted session is still failed on service restart. New session IDs are assigned after recovery.
    Live-source monitors only; finite-video analysis remains an explicit session. Monitor failures/backoff are observable
    and do not repeatedly retry structurally invalid config. No guaranteed unbroken monitoring during outages.

    - Zones are source-oriented normalized polygons; lines are directed segments. Observation rules evaluate detection
    results from a monitor. Tracking-dependent enter/exit/crossing/occupancy-change rules require tracking capability
    and reset state on tracking epoch loss. Presence/count rules work without tracking. Look computes observations
    but never runs user actions, commands or downstream workflows; OPAL Event or another consumer owns actions.
    Revisions of geometry/rules do not alter stored historical observations.

    - Each rule firing creates a durable ObservationRead before best-effort ZeroMQ publication. Even observation
    events may be dropped; event consumers must query /observations/ for backfill if losing an observation is unacceptable.
    No durable outbox/delivery acknowledgement is promised, and frames skipped before inference cannot yield observations.
    Source outages do not mean absence detections.

    - New event topics: opal.look.observation.triggered, opal.look.monitor.started, opal.look.monitor.failed, opal.look.recording.completed.
    Publication retains existing two-frame ZeroMQ BusEvent wire form, optional data.metadata correlation, bounded
    queues and explicit allowlist. Observation event data includes observation_id, rule_id, monitor_id, source_id,
    result_id and created_at; no frames, OCR text, URLs, paths, credentials or person recognition. Recording completion
    includes recording_id, source_id, state, and time; never raw video bytes. Monitor lifecycle includes monitor_id,
    source_id, session_id (if any), and state. All are best effort and publishing errors cannot fail inference/capture/recording.

    - All zone, line, observation-rule and monitor configuration writes participate in the same strong global ETag
    revision and mandatory If-Match semantics as v1.4 configuration. Read catalog GETs carry that ETag. Runtime
    monitor status, observations, captures, recordings and buffers do not advance the configuration revision. Config
    backups/export include zones, lines, observation rules and monitors, not recordings/captures/observations/session
    state/rolling buffers or credentials. Export format 1.2.0 includes those arrays. Older import formats 1.0.0/1.1.0
    default them to empty. Import validation checks all cross-references/limits atomically. Restore does not auto-start
    runtime sessions until configuration is committed and normal reconciliation begins.

    - Resource limits and safety: enforce source network/path restrictions, decoder resource limits, bounded rolling
    capture buffers, max recording durations, concurrent recording quotas, retention expiry and delete-while-pinned
    conflict rules. Runtime capacity and codec availability must be disclosed; unsupported media/encoder and unsupported
    tracking-dependent rules MUST fail explicitly, never silently fall back.

    '
servers:
- url: http://127.0.0.1:8000
  description: Example internal development base URL; deployment chooses the port.
security: []
tags:
- name: engines
  description: Installed local/remote adapters and their capabilities.
- name: models
  description: Host/remote model registrations and metadata.
- name: sources
  description: Camera, feed and finite-video source registrations.
- name: profiles
  description: Reusable analysis presets and active-default selection.
- name: media
  description: Managed uploaded source imagery and video.
- name: analyze
  description: Synchronous image/frame inference.
- name: sessions
  description: Background analysis lifecycle and immutable resolved configuration.
- name: results
  description: Live SSE and retained searchable task outputs.
- name: visuals
  description: Exact-frame snapshots and live MJPEG previews.
- name: settings
  description: Portable service settings.
- name: health
  description: Service info, liveness and readiness.
- name: backup
  description: Configuration backup, validation, export and atomic replacement.
- name: exports
  description: Asynchronous finite annotated-video export jobs.
- name: artifacts
  description: Independent completed output files and retention.
- name: capture
  description: Raw frame capture independent of inference and retained captures.
- name: recordings
  description: Independent video recording and exact-window clips.
- name: monitors
  description: Persistent desired analysis sessions and automatic reconciliation.
- name: zones
  description: Source-relative polygon regions.
- name: lines
  description: Directed source-relative line segments.
- name: observations
  description: Configurable detection-derived observations and durable observation history.
paths:
  /api/v1/engines/:
    get:
      tags:
      - engines
      summary: List engines
      description: 'Return current registered/configured resources. Read-only availability is current observed status
        and may change; list does not force network/device probes.

        Return the complete bounded configuration collection; pagination is not supported. An implementation may
        reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      operationId: get_api_v1_engines
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
      parameters: []
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/engines/{engine_id}:
    get:
      tags:
      - engines
      summary: Get engine
      description: Return one resource and current configuration.
      operationId: get_api_v1_engines_engine_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OpalError422'
    patch:
      tags:
      - engines
      summary: Update engine
      description: Apply documented partial update atomically. Omitted fields remain unchanged; nested opaque 
        objects replace rather than merge. Referenced resources must exist. Queued/running/cancelling exports 
        also protect referenced configuration; incompatible mutation returns 409.
      operationId: patch_api_v1_engines_engine_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineRead'
          headers:
            ETag:
              description: Strong ETag of the complete logical configuration after the operation.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '412':
          $ref: '#/components/responses/OpalError412'
        '428':
          $ref: '#/components/responses/OpalError428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineUpdate'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Required current strong ETag of the complete logical configuration. Missing returns 428, 
          stale returns 412. One exact strong quoted tag required; weak tags, lists and * are rejected with 
          422.
    parameters:
    - name: engine_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/engines/{engine_id}/validate:
    post:
      tags:
      - engines
      summary: Validate engine
      description: Validate resolved configuration and current usability. The operation completed normally 
        even if valid=false. Profile validation checks model task/settings. No persistent session starts.
      operationId: post_api_v1_engines_engine_id_validate
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - name: engine_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/models/:
    get:
      tags:
      - models
      summary: List models
      description: 'Return current registered/configured resources. Read-only availability is current observed status
        and may change; list does not force network/device probes.

        Return the complete bounded configuration collection; pagination is not supported. An implementation may
        reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      operationId: get_api_v1_models
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
      parameters:
      - name: engine_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: task
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Task'
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
    post:
      tags:
      - models
      summary: Register model
      description: Create configuration and preserve stable identifier; validate structural and 
        referenced-resource compatibility. Registration never uploads/downloads model or source files.
      operationId: post_api_v1_models
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRead'
          headers:
            ETag:
              description: Strong ETag of the complete logical configuration after the operation.
              schema:
                type: string
            Location:
              description: Resource URL
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '412':
          $ref: '#/components/responses/OpalError412'
        '428':
          $ref: '#/components/responses/OpalError428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Required current strong ETag of the complete logical configuration. Missing returns 428, 
          stale returns 412. One exact strong quoted tag required; weak tags, lists and * are rejected with 
          422.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/models/{model_id}:
    get:
      tags:
      - models
      summary: Get model
      description: Return one resource and current configuration.
      operationId: get_api_v1_models_model_id
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRead'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
