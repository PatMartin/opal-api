  /api/v1/settings/:
    get:
      tags:
      - settings
      summary: List settings
      description: Return effective portable settings with all documented defaults materialized. Unknown 
        engine-specific configuration belongs to engine config, not this resource.
      operationId: get_api_v1_settings
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSettings'
          headers:
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    patch:
      tags:
      - settings
      summary: Update portable settings atomically
      description: Atomically patch declared portable settings using native JSON. Empty patches, unknown 
        fields and invalid types return 422. Omitted fields remain unchanged; arrays replace in full, never 
        merge. Validate all values and resulting complete configuration before persisting/activating any 
        change. Failure leaves overrides, effective settings and revision unchanged. Requires current strong 
        If-Match (428 missing, 412 stale). Retention changes affect newly created records only. Lower capacity
        never terminates existing work. Event enablement requires provisioned transport; disabling publication
        drops queued unpublished notifications. Scalar PUT/DELETE and bulk PATCH use the same validation, 
        defaults and revision rules.
      operationId: patch_api_v1_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceSettingsPatch'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSettings'
          headers:
            ETag:
              description: Strong ETag of the complete logical configuration after the operation.
              schema:
                type: string
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '412':
          $ref: '#/components/responses/OpalError412'
        '428':
          $ref: '#/components/responses/OpalError428'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Required current strong ETag of the complete logical configuration. Missing returns 428, 
          stale returns 412. One exact strong quoted tag required; weak tags, lists and * are rejected with 
          422.
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
