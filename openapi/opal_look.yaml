              $ref: '#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '412':
          $ref: '#/components/responses/OpalError412'
        '428':
          $ref: '#/components/responses/OpalError428'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Required current strong ETag of the complete logical configuration. Missing returns 428, 
          stale returns 412. One exact strong quoted tag required; weak tags, lists and * are rejected with 
          422.
    parameters:
    - name: profile_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/devices/cameras/:
    get:
      tags:
      - sources
      summary: List local cameras
      description: Discover USB, Pi/native, and other installed capture-adapter cameras on the server host. 
        Enumeration may be incomplete; no network scanning is implied. Local availability is independent of 
        remote inference engines.
      operationId: get_api_v1_devices_cameras
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
