openapi: 3.1.0
info:
  title: OPAL Think API
  version: 1.7.0
  description: |
    OPAL-THINK is a model-neutral, guarded reasoning service. The OpenAPI contract is authoritative; CLI and SPA only call REST.

    Architecture decisions (ratified):
    - A Task is the universal unit of intelligent work; CLI `ask` and `chat` are convenience clients of Task creation.
    - Sessions are optional and must be explicitly created; no implicit session on stateless Task creation.
    - Task creation is asynchronous (HTTP 202 + Location); watch via SSE or show the final Task record.
    - No independent tool registry, approvals subsystem, workflow engine, or ZeroMQ subscriber in THINK.
    - THINK discovers enabled registered OPAL-EVENT actions and invokes them via REST; it checks /executions/{id} until terminal. EVENT owns action definitions, dispatch, limits and execution records.
    - THINK has EVENT permissions to list/show actions, execute enabled actions, and read their execution results; no permission to administer actions, rules, settings or credentials. EVENT must enforce this with an execute-only principal (existing EVENT 1.4.0 needs finer-grained authorization).
    - EVENT triggers THINK through registered HTTP actions targeting POST /api/v1/tasks/. The input must be transformed to TaskCreate and may carry untrusted event context; EVENT HTTP 202 signifies task admission, not eventual success.
    - Tools are invoked only through EVENT. THINK must never execute arbitrary model-generated shell code, URLs, or Python directly.
    - Constrain all tasks with server-enforced step/time/concurrency ceilings and forbid model-issued privilege changes. Allow all enabled registered EVENT actions within EVENT's permissions; do not add a second approval system.
    - Prevent recursive EVENT→THINK→EVENT feedback by bounding causation depth and rejecting repeated triggering chains; apply these controls across tasks, not only within a task's max_steps. Required infrastructure behavior can be implemented by EVENT and THINK using existing OPAL correlation metadata.
    - EVENT is authoritative for action execution status: 202 means admission; queued/running/dropped/failed/timed_out/succeeded must be interpreted. No automatic retries, ordering, exactly-once delivery, or rollback of side effects are promised.
    - The assistant's readable decisions are short summaries and action references, never hidden chain-of-thought or secrets.
    - Evaluation readiness: optional caller metadata is preserved on Task records; action steps report sanitized action_input. No evalset management API is introduced.

    OPAL suite conventions:
    - /api/v1 namespace, trailing slash on collection roots, 201+Location for session creation, 202+Location for async task admission, 204 deletion.
    - X-Opal-Session-Id identifies a logical trace, not a server-created Session; TaskCreate.session_id identifies an actual Session resource. If both are present, propagate the resource session ID as the canonical context header. Do not treat these identifiers as authorization.
    - X-Opal-Transaction-Id is logical workflow tracing, not a distributed atomic transaction; X-Opal-Request-Id is per HTTP hop, and X-Opal-Causation-Id identifies immediate causal parent when known. Generate transaction/request IDs when absent and return known IDs on success/error and initial stream headers. Outbound REST requests regenerate request ID, preserve transaction/context and set causation.
    - IDs are printable, non-whitespace ASCII tokens of 1..128 chars. Invalid client-provided context IDs return 422.
    - Growing task and session histories use cursor pagination (filter-scoped, deterministic, expiring); model catalogs are bounded and not paginated.
    - Single-setting GET/PUT/DELETE and collection GET/PATCH use strong portable-configuration ETags, mandatory If-Match on mutation, 428 if missing, 412 if stale.
    - Credentials are configured as references; never return raw secret material. On non-loopback bindings require REST authentication.
    - TASK stream is live SSE, no guaranteed replay. Final Task snapshot remains source of truth.
    - No task deletion: cancellation affects active work; retention controls cleanup. Session removal deletes session context and its retained linked tasks, but never EVENT execution history.

    Recommended initial setting keys (registered keys are discoverable through GET settings):
    `models.default_id`, `providers.<id>.type`, `providers.<id>.base_url`, `providers.<id>.enabled`, `providers.<id>.credential_ref`, `event.base_url`, `event.credential_ref`, `task.default_max_steps`, `task.max_steps_limit`, `task.default_timeout_seconds`, `task.timeout_limit_seconds`, `task.max_concurrent`, `task.retention_days`, `session.retention_days`.
    Provider adapters can extend settings without changing the core REST schema. Input schema and natural-language descriptions for EVENT actions are recommended EVENT-side enhancements and not new THINK APIs.
  license:
    name: Internal use
servers:
- url: http://127.0.0.1:8080
  description: Illustrative local endpoint; actual bind address and port are configurable.
tags:
- name: tasks
  description: Universal reasoning and autonomous work unit.
- name: sessions
  description: Optional persistent conversational context.
- name: models
  description: Read-only model discovery.
- name: settings
  description: Service settings with per-key management.
- name: health
  description: Health, liveness, and readiness.
- name: persona
  description: Manage named persona identities adopting the shared OPAL persona identifiers introduced by OPAL Say v1.6.0.
- name: info
  description: Service identity, version and liveness probes.
- name: service
  description: Service process lifecycle (start, stop, log tail).
security:
- BearerAuth: []
paths:
  /api/v1/task/:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - tasks
      operationId: create_task
      summary: Create task
      description: Submit one unit of intelligent work. Returns 202 immediately with durable task ID; not a completed
        answer. This is also the endpoint for EVENT HTTP actions. session_id is optional; an existing managed session
        serializes active tasks (409 if busy). Idempotency-Key can safely repeat admission but does not guarantee
        exactly-once action side effects. All context is untrusted. No separate chat REST endpoint.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '202':
          description: Accepted for task execution, not completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            Location:
              $ref: './shared/opal_kernel.yaml#/components/headers/Location'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: './shared/opal_kernel.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      x-opal-cli:
        group: task
        command: create
        aliases:
        - ask
        - chat
    get:
      tags:
      - tasks
      operationId: list_tasks
      summary: List retained tasks
      description: Newest-first deterministic pagination by (created_at,id). Cursors bind to filters and expire.
        Includes standalone and session-linked tasks. Retention settings remove old task records automatically;
        no task DELETE operation.
      parameters:
      - $ref: '#/components/parameters/TaskStatus'
      - $ref: '#/components/parameters/TaskSessionFilter'
      - $ref: './shared/opal_kernel.yaml#/components/parameters/Limit'
      - $ref: './shared/opal_kernel.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Task page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: task
        command: list
  /api/v1/task/{task_id}:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - tasks
      operationId: show_task
      summary: Show task
      description: Authoritative snapshot of status, user-visible answer and bounded step summaries. A completed
        task retains its answer even if a live stream was missed. Do not expose private model chain-of-thought,
        raw secrets, or unrestricted EVENT logs.
      responses:
        '200':
          description: Task snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: task
        command: show
  /api/v1/task/{task_id}/stream:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - tasks
      operationId: watch_task
      summary: Watch task output and progress
      description: 'Live Server-Sent Events (SSE), Content-Type: text/event-stream, JSON data frames. Event names:
        task.started, task.progress, task.output, task.action, task.completed, task.failed, task.cancelled, task.timed_out.
        task.output contains incremental user-facing text only when the model supports streaming; progress events
        contain concise summaries and EVENT action IDs/execution IDs. Every event data object carries task_id, timestamp,
        type and data. No token or event replay guarantee; connecting after task termination delivers its current
        terminal snapshot then closes. Clients MUST GET the Task for authoritative final output and after interruptions.
        Stream errors after headers are sent use an SSE task.failed event or abrupt disconnect, never a new HTTP
        status.'
      responses:
        '200':
          description: Live SSE stream, ending on a terminal task status.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames with `event:` and JSON `data:` lines.
              example: |+
                event: task.progress
                data: {"task_id":"task_123","timestamp":"2026-11-01T16:00:01Z","type":"task.progress","data":{"summary":"Inspecting GPU"}}

                event: task.completed
                data: {"task_id":"task_123","timestamp":"2026-11-01T16:00:04Z","type":"task.completed","data":{"status":"completed"}}

          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: task
        command: watch
  /api/v1/task/{task_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - tasks
      operationId: cancel_task
      summary: Request task cancellation
      description: Request cooperative termination. Accepted cancellation stops new reasoning/action dispatch; an
        EVENT action already running may still complete, and its side effects are not undone. Repeated cancellation
        of an in-progress task is idempotent. Terminal task returns 409. Cancellation takes effect asynchronously;
        poll/show or watch for cancelled or another terminal status.
      responses:
        '202':
          description: Cancellation requested, not guaranteed instantaneous.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: task
        command: cancel
  /api/v1/session/:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - sessions
      operationId: add_session
      summary: Add session
      description: Create an optional durable context container. Without a Session, Tasks are independent. Starting
        interactive CLI chat without --session-id creates a Session via this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            Location:
              $ref: './shared/opal_kernel.yaml#/components/headers/Location'
        '400':
          $ref: './shared/opal_kernel.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: './shared/opal_kernel.yaml#/components/responses/TooManyRequests'
      x-opal-cli:
        group: session
        command: add
    get:
      tags:
      - sessions
      operationId: list_sessions
      summary: List sessions
      description: Newest updated first, deterministically ordered by (updated_at,id); opaque cursors expire. For
        turns in a conversation, list tasks filtered by session_id.
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/Limit'
      - $ref: './shared/opal_kernel.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Session page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: session
        command: list
  /api/v1/session/{session_id}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - sessions
      operationId: show_session
      summary: Show session
      description: Session metadata; list its tasks using GET /api/v1/tasks/?session_id=...
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: session
        command: show
    delete:
      tags:
      - sessions
      operationId: remove_session
      summary: Remove session
      description: Delete session context AND its retained linked task history. Reject with 409 if any task belonging
        to this session remains queued/running; cancel tasks first. Irreversible from API. Independently retained
        EVENT execution records are outside this deletion and remain subject to EVENT retention settings.
      responses:
        '204':
          description: Session and linked task records removed.
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: session
        command: remove
  /api/v1/model/:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - models
      operationId: list_models
      summary: List available and known models
      description: Discover all configured model providers and their models. Stable opaque model IDs; unavailable
        models may be listed with available=false. Bounded catalog; no model installation or deletion is exposed.
        Provider endpoints/secret refs are service settings.
      responses:
        '200':
          description: Complete model catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
      x-opal-cli:
        group: model
        command: list
  /api/v1/model/{model_id}:
    parameters:
    - $ref: '#/components/parameters/ModelId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - models
      operationId: show_model
      summary: Show model
      description: Return discovered model capabilities. Model IDs are opaque; do not infer provider behavior from
        names.
      responses:
        '200':
          description: Model description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
      x-opal-cli:
        group: model
        command: show
  /api/v1/profile/:
