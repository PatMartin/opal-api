          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'

        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IfMatch'
      x-opal-cli:
        parent: config
        group: persona
        command: remove
components:
  securitySchemes:
    BearerAuth: {$ref: './shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth'}
  parameters:
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Globally unique OPAL persona identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      example: amy
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: URL-encode opaque ID.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional caller-scoped deduplication for task creation. Same key+body returns the same task;
        conflicting body returns 409.
    TaskStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskStatus'
    TaskSessionFilter:
      name: session_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
  schemas:
    TaskStatus:
      type: string
      description: Terminal states are completed, failed, cancelled and timed_out.
      enum:
      - queued
      - running
      - completed
      - failed
      - cancelled
      - timed_out
    TaskCreate:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          description: User objective or question. Treat external-event text and context as untrusted data.
          minLength: 1
          maxLength: 32768
          example: Diagnose my NVIDIA GPU
        session_id:
          type: string
          description: Optional existing managed Session ID. Omit for a stateless task.
          minLength: 1
          maxLength: 128
        model_id:
          type: string
          description: Optional model override; omit to use configured default.
          minLength: 1
          maxLength: 200
        context:
          type: object
          additionalProperties: true
          properties: {}
          description: Optional application-supplied JSON context, such as event facts or references. Untrusted;
            never an authorization source.
        max_steps:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum reasoning/tool iterations, capped by server policy.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Task deadline, capped by server policy. Includes time waiting for EVENT executions.
        metadata:
          type: object
          maxProperties: 32
          additionalProperties: true
          description: >-
            Optional caller-supplied tracking metadata, such as evalset and case_id.
            Data only: never sent to the model as context, interpreted as instructions,
            or used for authorization. Implementations must bound JSON size and depth,
            reject sensitive content, and persist it with the Task for later retrieval.
      required:
      - prompt
      description: Universal entry point for ask, chat, autonomous tasks and EVENT-triggered work. Omission of session_id
        does not create a session.
    TaskStep:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 1
        kind:
          type: string
          description: Summarized step category, not internal chain-of-thought.
          enum:
          - reasoning
          - action
          - result
        summary:
          type: string
          description: User-safe status description. No raw hidden reasoning or secrets.
        action_id:
          type:
          - string
          - 'null'
        execution_id:
          type:
          - string
          - 'null'
        action_input:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: >-
            Sanitized input actually submitted to the OPAL-EVENT action execute
            endpoint, including the event payload when applicable. Omitted on
            non-action steps; null when no safe representation exists. Never
            expose secrets, credentials, or hidden reasoning; diagnostic only.
        status:
          type: string
          enum:
          - started
          - succeeded
          - failed
          - timed_out
          - dropped
          - cancelled
        at:
          type: string
          format: date-time
      required:
      - index
      - kind
      - summary
      - status
      - at
      description: Bounded, redacted task activity summary. EVENT is authoritative for action execution details.
    Task:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/TaskStatus'
        prompt:
          type: string
        metadata:
          type: object
          maxProperties: 32
          additionalProperties: true
          description: >-
            Caller-supplied tracking metadata from TaskCreate, redacted if needed.
            Empty object when omitted. Never influences reasoning or authorization.
        session_id:
          type:
          - string
          - 'null'
        model_id:
          type: string
          description: Resolved model ID actually used.
        max_steps:
          type: integer
          minimum: 1
        timeout_seconds:
          type: integer
          minimum: 1
        steps_completed:
          type: integer
          minimum: 0
        cancel_requested:
          type: boolean
        answer:
          type:
          - string
          - 'null'
          description: Current or final user-facing response; authoritative after completed.
        error:
          oneOf:
          - $ref: '#/components/schemas/TaskFailure'
          - type: 'null'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TaskStep'
          description: Bounded summaries, refreshed on GET; use stream for live events.
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - status
      - prompt
      - session_id
      - model_id
      - max_steps
      - timeout_seconds
      - steps_completed
      - cancel_requested
      - answer
      - error
      - steps
      - created_at
      - started_at
      - finished_at
    TaskFailure:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: model_unavailable
        message:
          type: string
      required:
      - code
      - message
    TaskPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          description: Optional human-readable label.
          minLength: 1
          maxLength: 200
      description: Create an optional conversation context; does not start a task.
    Session:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        task_count:
          type: integer
          minimum: 0
      required:
      - id
      - title
      - created_at
      - updated_at
      - task_count
    SessionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
    Model:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque model ID; use unchanged in task.model_id.
          example: ollama:llama3.2
        provider:
          type: string
          example: ollama
        name:
          type: string
          example: llama3.2
        available:
          type: boolean
          description: Available for inference now.
        capabilities:
          type: object
          additionalProperties: false
          properties:
            streaming:
              type: boolean
            tool_calling:
              type: boolean
            structured_output:
              type: boolean
            vision:
              type: boolean
          required:
          - streaming
          - tool_calling
          - structured_output
          - vision
          description: Measured/declared capabilities; unsupported features must not be assumed.
        context_window:
          type:
          - integer
          - 'null'
          minimum: 1
        description:
          type:
          - string
          - 'null'
      required:
      - id
      - provider
      - name
      - available
      - capabilities
      - context_window
      - description
      description: Models are discovered from configured provider adapters, not installed or deleted via this REST
        API.
    PersonaCreate:
      type: object
      additionalProperties: false
      required:
      - persona_id
      - name
      properties:
        persona_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*
          description: Globally unique OPAL persona identifier.
          example: amy
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable persona name.
          example: Amy
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
