openapi: 3.1.0
info:
  title: OPAL Say API
  version: 1.5.0
  description: "Implementation-neutral text-to-speech (TTS) service for the OPAL suite.\n\nOPAL Say provides\
    \ a stable REST contract over one or more host-installed TTS\nengines such as Piper or Kokoro. Clients\
    \ interact with OPAL concepts—engines,\nvoices, profiles, generation settings, and audio output—without\
    \ depending on a\nspecific engine's command line, model layout, Python API, or native output format.\n\n\
    Design principles:\n\n* The OpenAPI contract is the public source of truth for service behavior.\n* Engines\
    \ are installed and discovered by the implementation; they are not created\n  or deleted through this API.\n\
    * Voices are registrations that point at voice/model resources already available\n  on the host. The API\
    \ never uploads or deletes model files.\n* A voice has a globally unique OPAL `voice_id` and normally determines\
    \ which\n  engine is used.\n* Requests may optionally specify an `engine_id` override for testing or advanced\n\
    \  routing. The selected engine must be compatible with the registered voice.\n* The portable controls\
    \ are voice, speed, volume, output format, and optionally\n  sample rate. Engine-specific features are\
    \ carried in an opaque `engine_options`\n  object.\n* Supported completed-audio formats are WAV and raw\
    \ PCM.\n* Raw PCM is always signed 16-bit little-endian (`s16le`), mono. Its sample rate\n  is returned\
    \ in the `X-Opal-Sample-Rate` response header.\n* Streaming generation is synchronous from the caller's\
    \ perspective and returns a\n  progressive raw PCM byte stream. Streaming never returns a WAV container.\n\
    * Long input is internally chunked by the service. Internal chunk boundaries are\n  not visible in the\
    \ generated audio contract.\n* Audio playback, audio-device control, synthesis history, request logging,\n\
    \  performance history, and asynchronous job management are intentionally outside\n  this API.\n* Configuration\
    \ backup/import/export follows the same operational model as the\n  sister OPAL Listen service.\n\n\nOPAL\
    \ SUITE STANDARD v1.2 (normative)\nX-Opal-Session-Id is an optional logical context identifier; it does\
    \ not create a server-managed session or grant authorization. Entry-point services generate one when absent\
    \ where a workflow requires it, and propagate it unchanged. A preexisting service-local session resource\
    \ has a separate lifecycle. X-Opal-Transaction-Id is a single logical end-to-end operation and is not an\
    \ atomic distributed transaction. X-Opal-Request-Id identifies one inbound HTTP exchange and is regenerated\
    \ for each downstream HTTP hop (the incoming one can be used for diagnostics); X-Opal-Causation-Id names\
    \ the immediate parent event/request, where applicable. For inbound requests, if a transaction ID is absent\
    \ the service assigns one; all response types (including errors, streamed headers, and binary bodies) return\
    \ session ID if known and transaction/request IDs. Never trust these values for access control. Propagate\
    \ them into derived ZeroMQ envelope metadata. All identifiers are opaque 1..128-character printable ASCII\
    \ tokens with no control/whitespace characters; client-supplied invalid values yield 422.\nStandard health\
    \ routes: /api/v1/health/, /api/v1/health/live, /api/v1/health/ready. Settings: GET and PATCH /api/v1/settings/\
    \ for the whole map, plus GET, PUT and DELETE /api/v1/settings/{key} for individual keys retained\
    \ for OPAL suite consistency; PATCH is atomic. Mutable configuration uses strong ETags and mandatory If-Match with 428\
    \ missing, 412 stale. For bounded configuration catalogs return full arrays (subject to explicit deployment\
    \ caps); for growing histories use cursor pagination with stable deterministic ordering, opaque next_cursor\
    \ and has_more. Cursors are scoped to the exact filter set and invalidate on mismatch (422); cursor values\
    \ expire explicitly. Standard HTTP creation 201 Location, async admission 202, empty deletion 204. Streaming\
    \ keeps media-specific transports but exposes correlation headers, defined failure behavior, and no unsupported\
    \ replay guarantee. Configuration export/import/validation excludes secrets and history.\n"
tags:
- name: engines
  description: 'Discover and configure TTS engines installed by the service implementation.

    Engines are not created or deleted through this API.

    '
- name: voices
  description: 'Register and manage OPAL voices backed by engine-specific resources already

    present on the host. Voice operations never upload, modify, or delete model files.

    '
- name: profiles
  description: 'Manage reusable generation presets. Exactly one profile may be active at a time.

    The active profile supplies defaults when a generation request does not name a

    profile explicitly.

    '
- name: generate
  description: 'Generate completed or progressively streamed speech audio from plain text.

    SSML is not supported by version 1 of this contract.

    '
- name: settings
  description: Service-wide key/value settings.
- name: health
  description: Service readiness and health information. Playback devices are out of scope.
- name: backup
  description: Backup, restore, import, export, and validate OPAL Say configuration.
paths:
  /api/v1/engines/:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/engines_collection'
  /api/v1/engines/{engine_id}:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/engine_item'
  /api/v1/engines/{engine_id}/validate:
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/EngineId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - engines
      summary: Validate Engine
      description: 'Validate that the engine is correctly configured and usable by the service.


        Validation should check the adapter/runtime and current engine configuration.

        A validation failure is normally returned as HTTP 200 with `valid: false` and

        diagnostic messages because the validation operation itself completed normally.

        '
      operationId: validate_engine_api_v1_engines__engine_id__validate_post
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Engine validation result.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalValidationReport'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
  /api/v1/voices/:
    get:
      tags:
      - voices
      summary: List Voices
      description: 'List registered OPAL voices. Registrations describe host-resident voice/model

        resources and their engine association; they do not contain the model data itself.


        Return the complete bounded configuration collection; pagination is not supported. An implementation
        may reject catalog sizes over an advertised deployment cap, rather than silently truncate.

        '
      operationId: list_voices_api_v1_voices__get
      parameters:
      - name: engine_id
        in: query
        required: false
        description: If supplied, return only voices registered to this engine.
        schema:
          type: string
          minLength: 1
      - name: enabled
        in: query
        required: false
        description: If supplied, filter by enabled state.
        schema:
          type: boolean
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Registered voices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
    post:
      tags:
      - voices
      summary: Register Voice
      description: 'Register a host-resident voice/model resource with OPAL Say.


        `engine_voice_ref` is an opaque identifier interpreted only by the selected

        engine adapter. It may represent a model path, installed voice name, composite

        identifier, or another engine-defined reference. OPAL clients must not infer

        filesystem semantics from it.


        This endpoint does not upload, copy, download, or otherwise provision model

        files. Implementations SHOULD validate that the referenced resource can be

        resolved before accepting the registration.

        '
      operationId: create_voice_api_v1_voices__post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceCreate'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '201':
          description: Voice registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            Location:
              description: Resource URL
              schema:
                type: string
        '404':
          description: The specified engine does not exist.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '409':
          description: The requested `voice_id` is already registered.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IfMatch'
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/voices/{voice_id}:
    parameters:
    - $ref: '#/components/parameters/VoiceId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    get:
      tags:
      - voices
      summary: Get Voice
      description: Return one registered voice.
      operationId: get_voice_api_v1_voices__voice_id__get
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Voice details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
            ETag:
              description: Strong revision of logical portable configuration
              schema:
                type: string
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
    patch:
      tags:
      - voices
      summary: Update Voice
      description: 'Update a voice registration. The engine association and opaque

        `engine_voice_ref` may be changed, but the referenced host resource itself is

        never modified by this API.

        '
      operationId: update_voice_api_v1_voices__voice_id__patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceUpdate'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Updated voice registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          description: The update would leave the voice in an incompatible or referenced state.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IfMatch'
    delete:
      tags:
      - voices
      summary: Unregister Voice
      description: 'Remove the OPAL voice registration only.


        The implementation MUST NOT delete the underlying model, voice files, engine

        resources, or other host assets. If a profile currently references this voice,

        the service SHOULD reject the operation with `409 Conflict` until the profile

        is changed or removed.

        '
      operationId: delete_voice_api_v1_voices__voice_id__delete
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '204':
          description: Voice registration removed. No response body is returned.
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          description: The voice is still referenced by configuration such as a profile.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalError'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '412':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: './shared/opal_kernel.yaml#/components/responses/PreconditionRequired'
      parameters:
      - $ref: './shared/opal_kernel.yaml#/components/parameters/IfMatch'
  /api/v1/voices/{voice_id}/validate:
    parameters:
    - $ref: '#/components/parameters/VoiceId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - voices
      summary: Validate Voice
      description: 'Ask the registered engine to validate that this voice registration can be

        resolved and is usable. Validation may include model metadata checks or a

        lightweight engine-specific load check but does not return generated speech.

        '
      operationId: validate_voice_api_v1_voices__voice_id__validate_post
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Voice validation result.
          content:
            application/json:
              schema:
                $ref: './shared/opal_kernel.yaml#/components/schemas/OpalValidationReport'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
  /api/v1/voices/{voice_id}/test:
    parameters:
    - $ref: '#/components/parameters/VoiceId'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
    post:
      tags:
      - voices
      summary: Test Voice
      description: 'Generate a short test utterance with this voice.


        The path selects the voice. Request fields can adjust the portable generation

        controls and engine-specific options. Unlike `/generate/stream`, this operation

        returns completed WAV or PCM audio.

        '
      operationId: test_voice_api_v1_voices__voice_id__test_post
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceTestRequest'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/AudioResponse'
        '404':
          $ref: './shared/opal_kernel.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
  /api/v1/profiles/:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/profiles_collection'
  /api/v1/profiles/{profile_id}:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/profile_item'
  /api/v1/profiles/{profile_id}/activate:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/profile_activate'
  /api/v1/generate:
    post:
      tags:
      - generate
      summary: Generate Audio
      description: "Generate completed speech audio from plain text.\n\nThe service may internally split long\
        \ text into multiple engine calls, but it\nMUST preserve the original text order and return one logically\
        \ continuous audio\nresult. Internal chunk boundaries are not part of the public API.\n\nGeneration\
        \ settings are resolved in this order, from lowest to highest precedence:\n\n1. Service defaults.\n\
        2. The active profile, when `profile_id` is omitted and an active profile exists.\n3. The explicitly\
        \ selected `profile_id`, when present.\n4. Fields supplied directly in this request.\n\nRequest-level\
        \ `engine_options` are shallow-merged over profile-level\n`engine_options`; request keys win. Other\
        \ request fields directly replace their\ncorresponding profile defaults.\n\nVoice and engine selection:\n\
        \n* A request-level `voice_id` overrides the profile voice.\n* The resolved voice normally determines\
        \ the engine.\n* `engine_id` is an optional advanced override. The service MUST reject an\n  override\
        \ that cannot use the resolved voice rather than silently substituting\n  another voice.\n* If no voice\
        \ can be resolved from either the request or a profile, generation\n  fails with `409 Conflict`.\n\n\
        Output behavior:\n\n* `wav` returns a completed WAV container as `audio/wav`.\n* `pcm` returns headerless\
        \ signed 16-bit little-endian mono PCM as\n  `application/octet-stream`.\n* The actual output sample\
        \ rate is always returned in `X-Opal-Sample-Rate`.\n* When a `sample_rate` is explicitly requested,\
        \ the service either returns audio\n  at that rate or rejects the request; it must not silently return\
        \ another rate.\n* Plain text only is accepted. SSML markup has no special meaning and is not a\n \
        \ supported input mode.\n"
      operationId: generate_audio_api_v1_generate_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/AudioResponse'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '413':
          $ref: './shared/opal_kernel.yaml#/components/responses/PayloadTooLarge'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/GenerationFailed'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/generate/stream:
    post:
      tags:
      - generate
      summary: Stream Generated Audio
      description: "Generate speech synchronously while progressively streaming raw PCM bytes to the\ncaller.\n\
        \nThis endpoint always returns headerless signed 16-bit little-endian mono PCM.\nWAV is intentionally\
        \ not supported for streaming because the contract does not\nrequire buffering a complete container\
        \ before response delivery.\n\nThe request follows the same profile, voice, engine, speed, volume,\
        \ sample-rate,\nand `engine_options` resolution rules as `/api/v1/generate`. There is no\n`output_format`\
        \ field because the streaming format is fixed to PCM.\n\nStreaming semantics:\n\n* HTTP status and\
        \ response headers are established before audio bytes are sent.\n* The actual sample rate is supplied\
        \ by `X-Opal-Sample-Rate` and remains constant\n  for the entire stream.\n* The channel count is always\
        \ one and sample format is always `s16le`.\n* The byte stream contains audio samples only—no WAV header,\
        \ chunk markers,\n  events, JSON envelopes, or internal text-chunk metadata.\n* Callers consume bytes\
        \ until normal end-of-stream.\n* If generation fails before streaming begins, the service returns a\
        \ normal JSON\n  error response with an appropriate non-2xx status.\n* If generation fails after a\
        \ 200 response has begun, the service terminates the\n  stream. Clients MUST treat premature termination\
        \ as a failed generation; the\n  protocol does not inject an error object into the audio byte stream.\n\
        * Service-side text chunking MUST NOT reset sample format or sample rate between\n  internal chunks.\n"
      operationId: stream_audio_api_v1_generate_stream_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateStreamRequest'
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          $ref: '#/components/responses/PcmStreamResponse'
        '409':
          $ref: './shared/opal_kernel.yaml#/components/responses/Conflict'
        '413':
          $ref: './shared/opal_kernel.yaml#/components/responses/PayloadTooLarge'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/GenerationFailed'
        '503':
          $ref: './shared/opal_kernel.yaml#/components/responses/ServiceUnavailable'
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/settings/:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/settings_collection'
  /api/v1/settings/{key}:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/settings_key'
  /api/v1/health/:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/health'
  /api/v1/backup/list:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_list'
  /api/v1/backup/create:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_create'
  /api/v1/backup/download/{filename}:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_download'
  /api/v1/backup/restore/{filename}:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_restore'
  /api/v1/backup/{filename}:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_delete'
  /api/v1/backup/export:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_export'
  /api/v1/backup/import:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_import'
  /api/v1/backup/validate:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/backup_validate'
  /:
    get:
      summary: Root
      description: Return basic service identity and API version information.
      operationId: root__get
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Service identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /healthz:
    get:
      summary: Healthz
      description: 'Lightweight liveness endpoint suitable for process supervisors and container

        probes. This endpoint indicates that the HTTP service is alive; callers needing

        engine readiness should use `/api/v1/health/`.

        '
      operationId: healthz_healthz_get
      responses:
        '401':
          $ref: './shared/opal_kernel.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/opal_kernel.yaml#/components/responses/Forbidden'
        '200':
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessRead'
          headers:
            X-Opal-Session-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: './shared/opal_kernel.yaml#/components/responses/UnprocessableEntity'
    parameters:
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter'
    - $ref: './shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter'
  /api/v1/health/live:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/health_live'
  /api/v1/health/ready:
    $ref: './shared/opal_kernel.yaml#/components/pathItems/health_ready'
components:
  securitySchemes:
    BearerAuth: {$ref: './shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth'}
  parameters:
    VoiceId:
      name: voice_id
      in: path
      required: true
      description: Globally unique OPAL voice identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      example: en-us-lessac-medium
  headers:
    AudioFormat:
      description: Logical output format returned in the response body.
      schema:
        $ref: '#/components/schemas/AudioFormat'
    SampleRate:
      description: Actual audio sample rate in Hz. Constant for the entire response body.
      schema:
        type: integer
        minimum: 8000
        maximum: 192000
      example: 22050
    Channels:
      description: Number of audio channels. OPAL Say v1 returns mono audio only.
      schema:
        type: integer
        enum:
        - 1
    SampleFormat:
      description: PCM sample representation. OPAL Say v1 standardizes on signed 16-bit little-endian.
      schema:
        type: string
        enum:
        - s16le
    ResolvedEngineId:
      description: Engine actually used for generation.
      schema:
        type: string
      example: piper
    ResolvedVoiceId:
      description: OPAL voice actually used for generation.
      schema:
        type: string
      example: en-us-lessac-medium
    ResolvedProfileId:
      description: Profile used to supply defaults, when a profile participated in resolution.
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    AudioResponse:
      description: 'Completed generated audio. The media type corresponds to the resolved

        `output_format`. PCM bodies are headerless S16LE mono samples.

        '
      headers:
        X-Opal-Audio-Format:
          $ref: '#/components/headers/AudioFormat'
        X-Opal-Sample-Rate:
          $ref: '#/components/headers/SampleRate'
        X-Opal-Channels:
          $ref: '#/components/headers/Channels'
        X-Opal-Sample-Format:
          $ref: '#/components/headers/SampleFormat'
        X-Opal-Engine-Id:
          $ref: '#/components/headers/ResolvedEngineId'
        X-Opal-Voice-Id:
          $ref: '#/components/headers/ResolvedVoiceId'
        X-Opal-Profile-Id:
          $ref: '#/components/headers/ResolvedProfileId'
        X-Opal-Session-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
      content:
        audio/wav:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    PcmStreamResponse:
      description: 'Progressive raw PCM audio stream. Bytes are S16LE, mono, with no container,

        framing, JSON envelope, or chunk metadata. The response ends when generation

        completes. Transport-level chunk boundaries have no audio semantic meaning.

        '
      headers:
        X-Opal-Audio-Format:
          description: Always `pcm` for this endpoint.
          schema:
            type: string
            enum:
            - pcm
        X-Opal-Sample-Rate:
          $ref: '#/components/headers/SampleRate'
        X-Opal-Channels:
          $ref: '#/components/headers/Channels'
        X-Opal-Sample-Format:
          $ref: '#/components/headers/SampleFormat'
        X-Opal-Engine-Id:
          $ref: '#/components/headers/ResolvedEngineId'
        X-Opal-Voice-Id:
          $ref: '#/components/headers/ResolvedVoiceId'
        X-Opal-Profile-Id:
          $ref: '#/components/headers/ResolvedProfileId'
        X-Opal-Session-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    GenerationFailed:
      description: TTS generation failed after the request was accepted for processing.
      content:
        application/json:
          schema:
            $ref: './shared/opal_kernel.yaml#/components/schemas/OpalError'
      headers:
        X-Opal-Session-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader'
        X-Opal-Transaction-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader'
        X-Opal-Request-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader'
        X-Opal-Causation-Id:
          $ref: './shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader'
  schemas:
    AudioFormat:
      type: string
      enum:
      - wav
      - pcm
      description: '`wav` is a completed WAV container. `pcm` is headerless signed 16-bit

        little-endian mono PCM.

        '
      example: wav
    EngineOptions:
      type: object
      additionalProperties: true
      description: 'Opaque engine-specific options. The public contract deliberately does not define

        these keys or values. They are interpreted only by the resolved engine adapter.


        Portable behavior should use the standardized OPAL fields whenever possible.

        Implementations SHOULD reject unsupported or invalid engine options rather than

        silently ignoring them. Sensitive credentials or secrets SHOULD NOT be exposed

        through this object.

        '
      example:
        noise_scale: 0.667
    VoiceCreate:
      type: object
      additionalProperties: false
      required:
      - voice_id
      - name
      - engine_id
      - engine_voice_ref
      properties:
        voice_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Globally unique OPAL identifier for this voice registration.
          example: en-us-lessac-medium
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable voice name.
          example: Lessac Medium
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional human-readable description.
        engine_id:
          type: string
          minLength: 1
          description: Installed engine that owns/interprets `engine_voice_ref`.
          example: piper
        engine_voice_ref:
          type: string
          minLength: 1
          maxLength: 2048
          description: 'Opaque engine-specific reference to a voice/model resource already available

            on the host. Although an implementation may use a filesystem path here,

            clients must treat the value as an opaque string.

            '
          example: /opt/opal/voices/en_US-lessac-medium.onnx
        language:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Optional BCP 47-style language tag or implementation-provided language label.
          example: en-US
        enabled:
          type: boolean
          default: true
          description: Whether this voice may be selected for generation.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        voice_id: en-us-lessac-medium
        name: Lessac Medium
        engine_id: piper
        engine_voice_ref: /opt/opal/voices/en_US-lessac-medium.onnx
        language: en-US
        enabled: true
        engine_options: {}
    VoiceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Partial update to a registered voice.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        engine_id:
          type: string
          minLength: 1
          description: Reassign this registration to another installed engine.
        engine_voice_ref:
          type: string
          minLength: 1
          maxLength: 2048
          description: New opaque host-resource reference interpreted by the engine.
        language:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
        enabled:
          type: boolean
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    VoiceRead:
      type: object
      required:
      - voice_id
      - name
      - engine_id
      - engine_voice_ref
      - enabled
      - engine_options
      - metadata
      - created_at
      - updated_at
      properties:
        voice_id:
          type: string
          description: Globally unique OPAL voice identifier.
          example: en-us-lessac-medium
        name:
          type: string
          description: Human-readable voice name.
          example: Lessac Medium
        description:
          anyOf:
          - type: string
          - type: 'null'
        engine_id:
          type: string
          description: Engine associated with this registration.
          example: piper
        engine_voice_ref:
          type: string
          description: Opaque engine-specific reference to the host-resident voice/model resource.
          example: /opt/opal/voices/en_US-lessac-medium.onnx
        language:
          anyOf:
          - type: string
          - type: 'null'
          example: en-US
        enabled:
          type: boolean
        native_sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          readOnly: true
          description: Native voice/engine sample rate when known; not a guarantee about requested output rate.
          example: 22050
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
          description: Read-only engine-reported voice metadata. Keys are not standardized.
          example:
            quality: medium
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PortableGenerationOptions:
      type: object
      description: 'Engine-neutral generation controls shared by completed and streaming generation.

        These fields are standardized by OPAL Say and must retain the same meaning

        regardless of the selected engine.

        '
      properties:
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
          default: 1.0
          description: Speech-rate multiplier. `1.0` is normal speed; `0.5` is half speed; `2.0` is double
            speed.
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 1.0
          description: Linear output gain. `1.0` is unchanged, `0.0` is silence, and `2.0` is approximately
            double amplitude before clipping control.
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: 'Requested output sample rate in Hz. If omitted/null, the service chooses an

            appropriate rate, commonly the voice''s native rate. If explicitly requested,

            the accepted response must use exactly this rate.

            '
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    GenerateRequest:
      type: object
      additionalProperties: false
      required:
      - text
      description: 'Request for completed speech audio. Any omitted generation setting is resolved

        from the selected/active profile and then service defaults.

        '
      properties:
        text:
          type: string
          minLength: 1
          description: 'Plain text to speak. Long text may be internally chunked. The maximum

            accepted request length is service-configurable and intentionally not fixed

            by the OpenAPI schema.

            '
          example: Hello from OPAL Say.
        profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Explicit profile to use. If omitted/null, the active profile may supply defaults.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Request-level voice override. Takes precedence over the profile voice.
          example: en-us-lessac-medium
        engine_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: 'Optional advanced engine override. Normally the resolved voice selects its

            registered engine. Incompatible overrides are rejected with `409 Conflict`.

            '
        speed:
          anyOf:
          - type: number
            format: float
            minimum: 0.25
            maximum: 4.0
          - type: 'null'
          description: Request-level speech-rate override; `1.0` is normal speed.
        volume:
          anyOf:
          - type: number
            format: float
            minimum: 0.0
            maximum: 2.0
          - type: 'null'
          description: Request-level linear gain override; `1.0` is unchanged.
        output_format:
          anyOf:
          - $ref: '#/components/schemas/AudioFormat'
          - type: 'null'
          description: Request-level completed-audio format override.
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: Optional requested output sample rate in Hz.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        text: The quick brown fox jumps over the lazy dog.
        voice_id: en-us-lessac-medium
        speed: 1.0
        volume: 1.0
        output_format: wav
        engine_options: {}
    GenerateStreamRequest:
      type: object
      additionalProperties: false
      required:
      - text
      description: 'Request for progressively streamed speech. The wire format is fixed to raw PCM,

        so there is intentionally no `output_format` property.

        '
      properties:
        text:
          type: string
          minLength: 1
          description: Plain text to speak. Long text may be internally chunked.
          example: This audio begins streaming as it is generated.
        profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Explicit profile to use; otherwise the active profile may provide defaults.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Request-level voice override.
        engine_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Optional advanced engine override; incompatible overrides are rejected.
        speed:
          anyOf:
          - type: number
            format: float
            minimum: 0.25
            maximum: 4.0
          - type: 'null'
        volume:
          anyOf:
          - type: number
            format: float
            minimum: 0.0
            maximum: 2.0
          - type: 'null'
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: Optional requested PCM stream sample rate in Hz.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        text: Stream this sentence as raw PCM audio.
        profile_id: 1
        speed: 1.0
        volume: 1.0
        sample_rate: 22050
        engine_options: {}
    VoiceTestRequest:
      type: object
      additionalProperties: false
      description: 'Parameters for generating a short completed-audio voice test. If `text` is

        omitted, the implementation uses a short built-in neutral test phrase.

        '
      properties:
        text:
          type: string
          minLength: 1
          default: This is a test of the selected OPAL Say voice.
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
          default: 1.0
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 1.0
        output_format:
          allOf:
          - $ref: '#/components/schemas/AudioFormat'
          default: wav
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          default: null
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    ValidationMessage:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Stable machine-readable diagnostic code when possible.
          example: model_not_found
        message:
          type: string
          description: Human-readable diagnostic message.
          example: The configured voice resource could not be resolved on this host.
        field:
          anyOf:
          - type: string
          - type: 'null'
          description: Related configuration field, when applicable.
          example: engine_voice_ref
        details:
          type: object
          additionalProperties: true
          description: Optional implementation-specific diagnostic context.
    EngineHealthRead:
      type: object
      required:
      - engine_id
      - enabled
      - available
      properties:
        engine_id:
          type: string
        enabled:
          type: boolean
        available:
          type: boolean
        message:
          anyOf:
          - type: string
          - type: 'null'
    OperationResult:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      example:
        success: true
        message: Backup restored successfully.
        details: {}
    ServiceInfo:
      type: object
      required:
      - name
      - version
      - api_version
      properties:
        name:
          type: string
          example: opal-say-svc
        version:
          type: string
          example: 1.0.0
        api_version:
          type: string
          example: v1
        description:
          type: string
          example: Implementation-neutral OPAL text-to-speech service
    LivenessRead:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          example: ok
x-opal-context-standard:
  version: '1.2'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
