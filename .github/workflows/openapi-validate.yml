name: Validate OpenAPI contracts

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'integration/**'
      - 'proposal/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Structural validation of every spec in openapi/: parsing,
      # $ref resolution, and OpenAPI 3.1 correctness (redocly.yaml).
      # Each stage uses continue-on-error so one failure does not hide
      # results from the remaining stages; the aggregate step fails the job.
      - name: Validate specs
        id: validate
        continue-on-error: true
        run: npm run validate

      # Generic OpenAPI lint rules (.spectral.yaml).
      - name: Lint specs
        id: lint
        continue-on-error: true
        run: npm run lint

      # OPAL suite conventions, kept separate from generic rules
      # (.spectral.opal.yaml).
      - name: Lint OPAL conventions
        id: lint_opal
        continue-on-error: true
        run: npm run lint:opal

      # Look-specific contract guarantees (.spectral.opal.look.yaml).
      - name: Lint OPAL Look contract
        id: lint_look
        continue-on-error: true
        run: npm run lint:look

      # Python runtime for the regression harness (requirements.txt).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        id: deps
        continue-on-error: true
        run: python -m pip install -r requirements.txt

      # Prove the rules above actually fire on deliberately invalid specs
      # (tests/test_lint.py).
      - name: Run lint regression tests
        id: test_lint
        continue-on-error: true
        run: npm run test:lint

      # Versioned event contract regression tests (tests/test_event_141.py).
      - name: Run event 1.4.1 contract tests
        id: test_event141
        continue-on-error: true
        run: npm run test:event141

      # THINK <-> EVENT interoperability boundary tests (tests/test_think_event.py).
      - name: Run THINK/EVENT boundary tests
        id: test_think_event
        continue-on-error: true
        run: npm run test:think-event

      # Draft proposal lint + dedicated checks (openapi/proposals/, tests/test_look_vnext.py).
      - name: Lint draft proposals
        id: lint_proposals
        continue-on-error: true
        run: npm run lint:proposals

      - name: Run LOOK draft checks
        id: test_look_vnext
        continue-on-error: true
        run: npm run test:look-vnext

      - name: Run LOOK draft CLI parity checks
        id: test_look_vnext_cli
        continue-on-error: true
        run: npm run test:look-vnext-cli

      - name: Run LISTEN 1.4.1 contract tests
        id: test_listen141
        continue-on-error: true
        run: npm run test:listen141

      # Fail the job if any required stage failed; every stage's output is
      # already visible above.
      - name: Aggregate stage results
        if: always()
        run: |
          set -u
          failed=0
          for outcome in \
            "validate=${{ steps.validate.outcome }}" \
            "lint=${{ steps.lint.outcome }}" \
            "lint_opal=${{ steps.lint_opal.outcome }}" \
            "lint_look=${{ steps.lint_look.outcome }}" \
            "deps=${{ steps.deps.outcome }}" \
            "test_lint=${{ steps.test_lint.outcome }}" \
            "test_event141=${{ steps.test_event141.outcome }}"             "test_think_event=${{ steps.test_think_event.outcome }}"             "lint_proposals=${{ steps.lint_proposals.outcome }}"             "test_look_vnext=${{ steps.test_look_vnext.outcome }}" 
            "test_look_vnext_cli=${{ steps.test_look_vnext_cli.outcome }}" 
            "test_listen141=${{ steps.test_listen141.outcome }}"; do
            name="${outcome%%=*}"
            result="${outcome##*=}"
            echo "$name: $result"
            if [ "$result" = "failure" ]; then failed=1; fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more validation stages failed"
            exit 1
          fi
          echo "All validation stages passed"
